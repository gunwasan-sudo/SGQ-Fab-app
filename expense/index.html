<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>SGQ บันทึกค่าใช้จ่าย</title>
<meta name="description" content="ตัวอย่างหน้าเว็บระบบบันทึกค่าใช้จ่ายจากสลิปในกลุ่ม LINE ของ SGQ Co., Ltd. (ข้อมูลสมมติ)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&amp;family=Prompt:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
/* ===== SGQ บันทึกค่าใช้จ่าย v2 — "ledger on aluminium" (ธีมสว่างเดียว) ===== */
:root{
  color-scheme: light;
  /* ตัวอักษร */
  --font-display:"Prompt","IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
  --font-body:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
  --fs-12:12px; --fs-13:13px; --fs-14:14px; --fs-16:16px; --fs-18:18px; --fs-22:22px; --fs-28:28px; --fs-40:40px;
  --lh-body:1.5; --lh-display:1.15; --ls-label:.02em;
  /* พื้นผิว (เทาอลูมิเนียม) */
  --bg:#eef1f4; --surface:#ffffff; --surface2:#f6f8fa; --line:#d9dfe6; --line2:#e8edf2;
  --ink:#0f1b2d; --ink2:#4a5668; --ink3:#8a95a5;
  /* กรอบสีกรมท่า */
  --navy:#0b1f33; --navy2:#122b45; --onNavy:#e6edf5; --onNavy2:#9fb3c8; --navyLine:rgba(230,237,245,.14);
  /* สีเน้น */
  --brand:#0f4c81; --brandSoft:#e4eef8; --accent:#1d6fd1; --accentOnNavy:#6fb0ff; --onBrand:#ffffff;
  /* ความหมาย */
  --ok:#15803d; --okSoft:#dcfce7; --warn:#b45309; --warnSoft:#fef3c7; --bad:#b91c1c; --badSoft:#fee2e2; --inc:#0e7490; --incSoft:#cffafe;
  /* รูปทรง */
  --r:10px; --rc:8px; --rp:999px;
  --scrim:rgba(11,31,51,.55); --shadowFloat:0 16px 40px rgba(11,31,51,.22);
  /* กราฟ */
  --chart-grid:#e4eef8; --chart-axis:#d9dfe6; --chart-ink:#8a95a5; --chart-ink-strong:#0f1b2d;
  --barToday:#0f4c81; --barMuted:rgba(15,76,129,.45); --barHover:#1d6fd1; --weekend:#f6f8fa; --track:#e8edf2;
  /* หมวด (ลำดับเดิมจาก v1 ผ่าน validator) */
  --cat-alu:#1d6fd1; --cat-glass:#eb6834; --cat-hw:#1baf7a; --cat-labor:#eda100; --cat-fuel:#e87ba4;
  --cat-tool:#008300; --cat-office:#6250d6; --cat-util:#e34948; --cat-other:#94a3b8;
  /* ธนาคาร (ภาพสลิปจำลอง) */
  --bk-kbank:#138f2d; --bk-scb:#4e2a84; --bk-bbl:#1e3a8a; --bk-ktb:#1ba5e1; --bk-ttb:#f07c1b;
  --bk-gsb:#eb198d; --bk-pp:#123a6b; --bk-cash:#64748b; --on-bank:#ffffff;
  /* สลิป */
  --slip-paper:#ffffff; --slip-ink:#0f1b2d; --slip-muted:#64748b; --slip-line:#e2e8f0; --slip-ok:#16a34a; --slip-qr:#0f1b2d; --slip-ph:#cbd5e1;
  /* แชต LINE จำลอง */
  --chat-bg:#cbd7e4; --bubbleMember:#a6e58a; --bubbleBot:#ffffff; --bubble-ink:#0f1b2d; --chat-time:#4a5668; --line-green:#06c755; --chat-av1:#b45309; --chat-av2:#0e7490;
  /* ตำแหน่ง sticky (มือถือมีหัว 56px) */
  --stickTop:calc(env(safe-area-inset-top, 0px) + 56px); --fbarH:0px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);font-family:var(--font-body);color:var(--ink);font-size:var(--fs-16);line-height:var(--lh-body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top, 0px);background:var(--navy);z-index:45}
body.noscroll{overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
h1,h2,h3,h4{margin:0;font-family:var(--font-display);font-weight:600;line-height:var(--lh-display);text-wrap:balance}
.num,.tab{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top :focus-visible,.side :focus-visible{outline-color:var(--accentOnNavy)}
svg :focus-visible{outline:none}
h2[tabindex="-1"]:focus{outline:none}
.muted{color:var(--ink3)}

/* ---------- หัวมือถือ (กรมท่า 56px) ---------- */
.col{min-width:0}
.top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:30;height:56px;display:flex;align-items:center;gap:10px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));background:var(--navy);color:var(--onNavy)}
.wm{width:36px;height:36px;border-radius:var(--rc);border:1.5px solid var(--onNavy2);color:var(--onNavy);font-family:var(--font-display);font-weight:600;font-size:var(--fs-13);letter-spacing:.04em;display:grid;place-items:center;flex:none}
.top .tt{min-width:0;flex:1;line-height:1.2}
.top .t1{font-family:var(--font-display);font-weight:600;font-size:var(--fs-16);display:flex;align-items:center;gap:6px}
.top .t2{font-size:var(--fs-12);color:var(--onNavy2);letter-spacing:var(--ls-label)}
.live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--line-green);flex:none}
.meav{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:var(--fs-13);background:var(--navy2);color:var(--onNavy);border:1px solid var(--navyLine);flex:none;text-decoration:none}
.demo{height:28px;display:flex;align-items:center;justify-content:center;background:var(--surface2);color:var(--ink2);font-size:var(--fs-12);letter-spacing:var(--ls-label);border-bottom:1px solid var(--line);padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- พื้นที่เนื้อหา ---------- */
.wrap{padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:16px calc(108px + env(safe-area-inset-bottom, 0px));max-width:1180px;margin:0 auto}
.view{min-width:0}
.shead{display:flex;align-items:center;gap:10px;margin:0 0 14px;flex-wrap:wrap}
.shead h2{font-size:var(--fs-22);flex:1;min-width:0}
.shead .sub{font-size:var(--fs-13);color:var(--ink3)}
.msw{display:inline-flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--rc);flex:none;height:40px}
.msw button{width:38px;height:38px;border:none;background:none;display:grid;place-items:center;color:var(--brand);font-size:var(--fs-12);padding:0;border-radius:var(--rc)}
.msw button:hover:not(:disabled){background:var(--brandSoft)}
.msw button:disabled{color:var(--line);cursor:default}
.msw b{min-width:86px;text-align:center;font-family:var(--font-display);font-weight:500;font-size:var(--fs-16);border-inline:1px solid var(--line2);line-height:38px}

/* ---------- การ์ด ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card h3{font-size:var(--fs-18);display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
.card h3 .sp{flex:1}
.card h3 .note,.card h3 small{font-family:var(--font-body);font-size:var(--fs-13);font-weight:400;color:var(--ink3)}
.lnk{background:none;border:none;color:var(--accent);font-weight:500;font-size:var(--fs-14);padding:4px 2px;text-decoration:none;font-family:var(--font-body)}
.lnk:hover{text-decoration:underline}
.grid{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.stack{display:grid;gap:12px;min-width:0}

/* ---------- แถบ KPI (hero band) ---------- */
.kband{padding:0;display:grid;grid-template-columns:minmax(0,1fr)}
.kmain{padding:16px 16px 14px;min-width:0}
.klabel,.kl{font-size:var(--fs-13);color:var(--ink2);letter-spacing:var(--ls-label)}
.kfig{font-family:var(--font-display);font-weight:600;font-size:32px;line-height:var(--lh-display);color:var(--ink);font-variant-numeric:tabular-nums;margin:4px 0 6px;overflow-wrap:anywhere}
.kfoot{font-size:var(--fs-12);color:var(--ink3)}
.kstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line2)}
.kstat{padding:12px 10px;display:flex;flex-direction:column;gap:2px;min-width:0;border-left:1px solid var(--line2);color:inherit;text-decoration:none}
.kstat:first-child{border-left:none}
a.kstat:hover{background:var(--surface2)}
.kv{font-size:var(--fs-22);font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:4px;white-space:nowrap}
.kv .ar{font-size:var(--fs-13)}
.ks{font-size:var(--fs-12);color:var(--ink3);line-height:1.35}
.kstat.pend .kv{color:var(--warn)}
.wdot{width:8px;height:8px;border-radius:50%;background:var(--warn);display:inline-block;flex:none}
.delta.up{color:var(--warn)} .delta.down{color:var(--ok)} .delta.flat{color:var(--ink2)}

/* ---------- กราฟ ---------- */
.chart{position:relative;min-width:0}
.chart svg{display:block;overflow:visible;font-family:var(--font-body)}
.chart svg:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:4px}
.ctext{font-size:var(--fs-12);font-variant-numeric:tabular-nums}
.legend-note{font-size:var(--fs-12);color:var(--ink3);margin:8px 0 0;letter-spacing:var(--ls-label)}
.legend-note i{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:4px}
details.tbl{margin-top:8px;font-size:var(--fs-14)}
details.tbl summary{cursor:pointer;color:var(--accent);font-weight:500;padding:4px 0;width:max-content;max-width:100%}
.tblwrap{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:var(--rc);margin-top:6px}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line2);font-size:var(--fs-13)}
th{background:var(--surface2);color:var(--ink2);font-weight:500;position:sticky;top:0;letter-spacing:var(--ls-label)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.tip{position:fixed;z-index:90;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--rc);box-shadow:var(--shadowFloat);padding:7px 10px;font-size:var(--fs-12);line-height:1.4;max-width:220px}
.tip b{display:block;font-size:var(--fs-16);font-weight:600;font-variant-numeric:tabular-nums}
.tip span{color:var(--ink3)}

/* ---------- ตารางบัญชี (หมวด / โครงการ) ---------- */
.ledger{list-style:none;margin:0 -16px;padding:0}
.ledger li{border-top:1px solid var(--line2)}
.ledger li:first-child{border-top:none}
.lrow{width:100%;border:none;background:none;text-align:left;padding:10px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto 46px;grid-template-areas:"name amt pct" "bar bar bar";gap:6px 10px;align-items:center;min-width:0;border-radius:0}
.lrow:hover{background:var(--surface2)}
.lname{grid-area:name;min-width:0;display:flex;align-items:center;gap:8px;font-size:var(--fs-14);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lname span{overflow:hidden;text-overflow:ellipsis}
.lname i,.cat i{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.lbar{grid-area:bar;min-width:0;display:block}
.lbar svg{display:block}
.lamt{grid-area:amt;font-size:var(--fs-14);font-weight:600;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.lpct{grid-area:pct;font-size:var(--fs-12);color:var(--ink3);font-variant-numeric:tabular-nums;text-align:right}
.lrow.np .lname{color:var(--ink2);font-weight:400}

/* ---------- แถวรายการ ---------- */
.lcard{padding:0;overflow:visible}
.rows{display:block}
.row{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px 10px 18px;border:none;border-top:1px solid var(--line2);background:var(--surface);text-align:left;min-width:0}
.row:first-child{border-top:none}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--stripe, var(--line))}
.row:hover{background:var(--surface2)}
.row.s-approved{--stripe:var(--ok)} .row.s-pending{--stripe:var(--warn)} .row.s-rejected{--stripe:var(--bad)} .row.s-in{--stripe:var(--inc)}
.row.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{background:var(--brandSoft)}100%{background:var(--surface)}}
.thumb{flex:none;width:40px;height:52px;border-radius:4px;overflow:hidden;border:1px solid var(--line);display:block;background:var(--slip-paper)}
.thumb svg,.thumb img{display:block;width:38px;height:50px;object-fit:cover}
.rmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.rname{font-weight:500;font-size:var(--fs-14);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rsub{font-size:var(--fs-12);color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.rsub2{font-size:var(--fs-12);color:var(--ink2);display:flex;flex-wrap:wrap;gap:2px 10px;align-items:center}
.cat{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.flag{font-weight:600;white-space:nowrap;letter-spacing:var(--ls-label)}
.flag.bad{color:var(--bad)} .flag.warn{color:var(--warn)} .flag.inc{color:var(--inc)}
.ramt{flex:none;font-weight:600;font-size:var(--fs-14);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.ramt.void{color:var(--ink3);text-decoration:line-through}
.ramt.inc{color:var(--inc)}
.dhd{position:sticky;top:calc(var(--stickTop) + var(--fbarH));z-index:5;display:flex;align-items:baseline;gap:8px;font-size:var(--fs-13);font-weight:600;color:var(--ink2);padding:6px 14px;background:var(--surface2);border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);letter-spacing:var(--ls-label)}
.lcard > .dgrp:first-child > .dhd{border-top:none}
.dhd span{flex:1}
.dhd small{font-size:var(--fs-13);font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}

/* ---------- ชิป / กลุ่มปุ่ม ---------- */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:var(--rp);padding:5px 12px;font-size:var(--fs-13);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;flex:none;color:var(--ink2)}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chip[aria-pressed="true"]{background:var(--brandSoft);color:var(--brand);border-color:var(--brand);font-weight:500}
.chip .n,.seg-b .n{font-size:var(--fs-12);opacity:.7;font-variant-numeric:tabular-nums}
.segs{display:flex;border:1px solid var(--line);border-radius:var(--rp);background:var(--surface);padding:2px;gap:2px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.segs::-webkit-scrollbar{display:none}
.seg-b{flex:1 0 auto;border:none;background:none;border-radius:var(--rp);padding:6px 8px;font-size:var(--fs-13);white-space:nowrap;color:var(--ink2);min-height:34px}
.seg-b[aria-pressed="true"]{background:var(--brand);color:var(--onBrand);font-weight:500}
.seg-b[aria-pressed="true"] .n{opacity:.85}

/* ---------- แถบตัวกรอง (รายการ) ---------- */
.lhead{gap:10px}
.lhead h2{flex:1 1 auto}
.lhead .msw-wrap{order:1;flex:none}
.lhead .search{order:2;flex:1 1 200px}
.lhead .ftoggle{order:3;flex:none}
.search{min-width:0;position:relative}
.search input{width:100%;height:44px;border:1px solid var(--line);border-radius:var(--rc);padding:0 12px 0 38px;font-size:var(--fs-16);background:var(--surface)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--ink3)}
.ftoggle{height:44px;border:1px solid var(--line);background:var(--surface);border-radius:var(--rc);padding:0 14px;font-family:var(--font-display);font-weight:500;font-size:var(--fs-14);display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.ftoggle[aria-expanded="true"]{border-color:var(--brand);color:var(--brand);background:var(--brandSoft)}
.ftoggle .cnt{background:var(--brand);color:var(--onBrand);border-radius:var(--rp);font-size:var(--fs-12);padding:0 6px;line-height:1.6;font-family:var(--font-body)}
.fbar{position:sticky;top:var(--stickTop);z-index:20;background:var(--bg);margin:0 0 10px;padding:8px 0 2px}
.fpanel{margin-top:8px}
.fpanel .g2{margin-bottom:6px}
.fsum{display:flex;align-items:center;gap:8px;font-size:var(--fs-13);color:var(--ink2);padding:6px 2px 4px;flex-wrap:wrap}
.fsum b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.fsum .sp{flex:1}

/* ---------- ฟอร์ม ---------- */
.f label,.flabel{display:block;font-size:var(--fs-13);font-weight:500;color:var(--ink2);margin:14px 0 6px;letter-spacing:var(--ls-label)}
.f input,.f textarea,.f select,.sel{width:100%;min-width:0;max-width:100%;min-height:44px;border:1px solid var(--line);border-radius:var(--rc);padding:9px 12px;font-size:var(--fs-16);background:var(--surface);color:var(--ink)}
.f input[type=file]{padding:8px;font-size:var(--fs-14)}
.f textarea{min-height:84px;resize:vertical}
.f input:focus-visible,.f textarea:focus-visible,.f select:focus-visible,.sel:focus-visible,.search input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-color:var(--accent)}
.f [aria-invalid="true"]{border-color:var(--bad)}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.err{font-size:var(--fs-13);color:var(--bad);margin-top:5px}
.hint{font-size:var(--fs-13);color:var(--ink3);margin-top:6px}
.segfs{border:none;padding:0;margin:14px 0 0;min-width:0}
.segfs legend{padding:0;margin:0 0 6px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg label{margin:0;border:1px solid var(--line);background:var(--surface);border-radius:var(--rp);padding:8px 16px;font-size:var(--fs-14);font-weight:400;color:var(--ink);cursor:pointer;letter-spacing:0}
.seg input:checked+label{border-color:var(--brand);background:var(--brandSoft);color:var(--brand);font-weight:500}
.seg input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchip{border:1px solid var(--line);background:var(--surface);border-radius:var(--rp);padding:5px 11px;font-size:var(--fs-13);display:inline-flex;align-items:center;gap:6px;color:var(--ink2)}
.tchip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.tchip[aria-pressed="true"]{border-color:var(--brand);background:var(--brandSoft);color:var(--brand);font-weight:500}
button.tchip:hover{border-color:var(--ink3)}
.photo{position:relative;border:1px dashed var(--ink3);border-radius:var(--r);padding:18px 10px;text-align:center;color:var(--ink2);background:var(--surface2);display:block;cursor:pointer;font-weight:500}
.photo:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.photo .big{font-size:26px;display:block}
.photo input{position:absolute;opacity:0;width:1px;height:1px}
.preview{margin-top:10px;display:flex;gap:10px;align-items:center}
.preview img{width:84px;height:84px;object-fit:cover;border-radius:var(--rc);display:block;border:1px solid var(--line)}

/* ---------- ปุ่ม ---------- */
.btn{border:1px solid transparent;border-radius:var(--rc);padding:9px 16px;font-family:var(--font-display);font-weight:500;font-size:var(--fs-14);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;min-height:44px;letter-spacing:.01em}
.btn.primary{background:var(--brand);color:var(--onBrand);border-color:var(--brand)}

/* ---------- กล่องเตือน ---------- */

.warnbox.b{background:var(--badSoft);color:var(--bad)}

/* ---------- การ์ดตรวจสอบ ---------- */

.rv{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;transition:opacity .25s ease,transform .25s ease}

.rvtop .thumbbtn{border:none;padding:0;background:none;border-radius:4px;flex:none}
.rvm{flex:1;min-width:0}
.rvamt{font-size:var(--fs-22);font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.rvname{font-weight:500;font-size:var(--fs-14);overflow-wrap:anywhere}
.rvsub{font-size:var(--fs-12);color:var(--ink3);font-variant-numeric:tabular-nums}
.conf{flex:none;font-size:var(--fs-12);font-weight:600;border-radius:var(--rp);padding:1px 9px;background:var(--okSoft);color:var(--ok);font-variant-numeric:tabular-nums}

.rvsec .flabel{margin:0 0 6px}

.empty .big{font-size:36px;display:block}
.empty b{display:block;font-family:var(--font-display);font-weight:600;font-size:var(--fs-18);color:var(--ink);margin:6px 0 2px}

/* ---------- บอท LINE ---------- */
.bot{display:flex;gap:12px;align-items:center}
.bot .lg{width:40px;height:40px;border-radius:var(--rc);background:var(--line-green);color:var(--onBrand);font-weight:700;display:grid;place-items:center;font-size:var(--fs-12);flex:none}

.chat{background:var(--chat-bg);border-radius:var(--r);padding:12px 10px;display:flex;flex-direction:column;gap:10px}
.chat .day{align-self:center;font-size:var(--fs-12);background:var(--surface2);color:var(--chat-time);padding:0 10px;border-radius:var(--rp)}
.msg{display:flex;gap:8px;align-items:flex-start;max-width:100%}
.msg .av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--onBrand);font-weight:600;font-size:var(--fs-12);flex:none;font-family:var(--font-display)}

.qr{display:flex;flex-wrap:wrap;gap:6px}
.qr button{border:1px solid var(--line-green);background:var(--bubbleBot);color:var(--ok);border-radius:var(--rp);padding:4px 11px;font-size:var(--fs-13);font-weight:500}
.qr button[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--onBrand)}

/* ---------- เมนู / ตั้งค่า ---------- */
.set{border-top:1px solid var(--line2);padding:14px 0}

.role.admin{border-color:var(--brand);color:var(--brand);background:var(--brandSoft)}
.role.acc{border-color:var(--ok);color:var(--ok);background:var(--okSoft)}

/* ---------- แถบเมนูล่าง (มือถือ) + ปุ่ม + กลาง ---------- */
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end;padding:0 max(4px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(4px, env(safe-area-inset-left, 0px))}

/* ---------- แถบข้าง (จอคอม) ---------- */
.side{display:none}

/* ---------- แผ่นรายละเอียด ---------- */
.ov{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease}

.shd{position:sticky;top:0;background:var(--surface);display:flex;align-items:center;gap:10px;padding:14px 0 12px;z-index:2;border-bottom:1px solid var(--line2)}

.sgrid{display:grid;gap:16px;padding-top:14px;min-width:0}
.slipbig{display:flex;justify-content:center;background:var(--surface2);border:1px solid var(--line2);border-radius:var(--r);padding:12px}

.dchips{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:var(--fs-13)}
.kvl{display:grid;grid-template-columns:auto minmax(0,1fr);font-size:var(--fs-14);margin:12px 0 0;border-top:1px solid var(--line2)}
.kvl dt,.kvl dd{padding:7px 0;border-bottom:1px solid var(--line2)}
.kvl dt{color:var(--ink3);padding-right:12px}
.kvl dd{margin:0;font-weight:500;text-align:right;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.linewrap{display:inline-block}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--navy);color:var(--onNavy);padding:10px 18px;border-radius:var(--rc);font-size:var(--fs-14);z-index:80;max-width:calc(100vw - 32px);text-align:center}

.flag.ok{color:var(--ok)}

/* ===== จอคอม ≥ 900px ===== */

  .sn .sbadge{margin-left:auto;background:var(--bad);color:var(--onBrand);border-radius:var(--rp);font-size:var(--fs-12);font-weight:600;padding:0 7px;line-height:1.6;font-variant-numeric:tabular-nums}
  .sfoot{margin-top:auto;padding:14px 8px 0;border-top:1px solid var(--navyLine)}

  .col{margin-left:240px}

}

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function hashStr(s){ let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function qrSVG(seed, x0, y0, m, full){
  // QR ปลอม 9×9 โมดูล: มุมระบุตำแหน่ง 3 มุม + จุดสุ่มตาม ref
  let out = '<rect x="' + (x0 - 2) + '" y="' + (y0 - 2) + '" width="' + (m * 9 + 4) + '" height="' + (m * 9 + 4) + '" ' + F('--slip-paper') + '/>';
  const finder = (cx, cy) => '<rect x="' + (x0 + cx * m) + '" y="' + (y0 + cy * m) + '" width="' + (3 * m) + '" height="' + (3 * m) + '" ' + F('--slip-qr') + '/>' +
    '<rect x="' + (x0 + (cx + 1) * m) + '" y="' + (y0 + (cy + 1) * m) + '" width="' + m + '" height="' + m + '" ' + F('--slip-paper') + '/>';
  out += finder(0, 0) + finder(6, 0) + finder(0, 6);
  let h = hashStr(seed);
  for (let y = 0; y < 9; y++) for (let x = 0; x < 9; x++){
    const inF = (x < 4 && y < 4) || (x > 4 && y < 4) || (x < 4 && y > 4);
    h = Math.imul(h ^ (h >>> 13), 1103515245) + 12345 >>> 0;
    if (inF || (!full && (x + y) % 2)) continue;
    if (h & 4) out += '<rect x="' + (x0 + x * m) + '" y="' + (y0 + y * m) + '" width="' + m + '" height="' + m + '" ' + F('--slip-qr') + '/>';
  }
  return out;
}
// size: 'sm' (รูปย่อ 44×56) | 'md' (แชต) | 'lg' (แผ่นรายละเอียด)

const tip = $('tip');
function showTip(x, y, value, title, sub){
  tip.replaceChildren();

  let top = y - h - 10; if (top < 8) top = y + 14;

}

/* ---------- สเกลตัวเลขกลม ๆ ---------- */
function niceStep(raw){ const p = Math.pow(10, Math.floor(Math.log10(raw))); const f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
function niceScale(max, n){ if (max <= 0) return {top:1000, step:250}; const step = niceStep(max / (n || 4)); return {top: Math.ceil(max / step - 1e-9) * step, step}; }
// แท่งตั้ง: ปลายมน ฐานเหลี่ยม
function colPath(x, y0, w, h, r){
  r = Math.min(r, w / 2, h);
  return 'M' + x + ',' + y0 + ' v' + (-(h - r)) + ' a' + r + ',' + r + ' 0 0 1 ' + r + ',' + (-r) + ' h' + (w - 2 * r) + ' a' + r + ',' + r + ' 0 0 1 ' + r + ',' + r + ' v' + (h - r) + ' z';
}

function compareMonth(mk){
  const [y, m] = mk.split('-').map(Number);
  const pk = iso(new Date(y, m - 2, 1)).slice(0, 7);
  if (!state.recs.some(r => monthKey(r) === pk)) return null;
  const partial = mk === TODAY_MK, lim = partial ? TODAY.getDate() : 31;
  const upTo = key => state.recs.filter(r => monthKey(r) === key && +r.slipDate.slice(8, 10) <= lim);
  const cur = countedTotal(upTo(mk)), prv = countedTotal(upTo(pk));
  return {cur, prv, pk, partial, lim, change: prv > 0 ? (cur - prv) / prv * 100 : null};
}

function dailySeries(mk){
  const [y, m] = mk.split('-').map(Number), nDays = new Date(y, m, 0).getDate();
  const byDay = groupBy(monthRecs(mk).filter(isCounted), r => +r.slipDate.slice(8, 10));
  return Array.from({length:nDays}, (_, i) => { const L = byDay[i + 1] || []; return {d:i + 1, iso: mk + '-' + pad(i + 1), v: round2(sumBy(L, amountOf)), n: L.length}; });
}
function dailyTable(mk){
  const rows = dailySeries(mk).filter(x => x.n > 0);
  return '<details class="tbl"><summary>ดูเป็นตาราง</summary><div class="tblwrap"><table><thead><tr><th scope="col">วันที่</th><th scope="col" class="r">สลิป</th><th scope="col" class="r">ยอด</th></tr></thead><tbody>' +
    rows.map(x => '<tr><td>' + fmtDow(x.iso) + ' ' + fmtDate(x.iso) + '</td><td class="r">' + x.n + '</td><td class="r">' + baht(x.v) + '</td></tr>').join('') +
    '</tbody></table></div></details>';
}
// กราฟแท่งรายวัน: สเกลเดียวเริ่มที่ 0, กริดทุกค่า tick, วันนี้สีแบรนด์ วันอื่น 45%, พื้นเทาจาง = เสาร์–อาทิตย์
function drawDaily(){
  const el = $('dailyChart'); if (!el) return;
  const mk = state.month, data = dailySeries(mk), nDays = data.length;
  const todayIdx = mk === TODAY_MK ? TODAY.getDate() - 1 : -1;
  const max = Math.max(0, ...data.map(x => x.v));
  const maxIdx = data.findIndex(x => x.v === max && max > 0);
  const {top, step} = niceScale(max, 4);
  const W = Math.max(280, Math.floor(el.clientWidth || 320)), H = 220;
  const M = {l:48, r:6, t:24, b:28}, pw = W - M.l - M.r, ph = H - M.t - M.b;
  const band = pw / nDays, bw = Math.max(2, Math.min(24, band - 2));
  const yS = v => M.t + ph - v / top * ph;
  const barTok = i => i === todayIdx ? '--barToday' : '--barMuted';
  let s = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" tabindex="0" role="group" aria-roledescription="กราฟแท่ง" ' +
    'aria-label="' + esc('ค่าใช้จ่ายรายวัน ' + monthLabel(mk) + ' สูงสุด ' + baht(max) + ' ใช้ปุ่มลูกศรซ้ายขวาเพื่อดูแต่ละวัน') + '" xmlns="http://www.w3.org/2000/svg">';
  data.forEach((x, i) => { const dw = parseISO(x.iso).getDay(); if (dw === 0 || dw === 6) s += '<rect x="' + (M.l + i * band) + '" y="' + M.t + '" width="' + band + '" height="' + ph + '" ' + F('--weekend') + '/>'; });
  s += '<rect id="dBand" x="0" y="' + M.t + '" width="' + band + '" height="' + ph + '" ' + F('--brandSoft') + ' visibility="hidden"/>';
  for (let v = 0; v <= top + 1e-6; v += step){
    const yy = Math.round(yS(v)) + 0.5;
    s += '<rect x="' + M.l + '" y="' + (yy - 0.5) + '" width="' + pw + '" height="1" ' + F(v === 0 ? '--chart-axis' : '--chart-grid') + '/>';
    s += '<text class="ctext" x="' + (M.l - 8) + '" y="' + (yy + 4) + '" text-anchor="end" ' + F('--chart-ink') + '>' + compactBaht(v) + '</text>';
  }
  data.forEach((x, i) => {
    if (x.v <= 0) return;
    const h = Math.max(2, x.v / top * ph), bx = M.l + i * band + (band - bw) / 2;
    s += '<path class="dbar" data-i="' + i + '" d="' + colPath(bx, M.t + ph, bw, h, 2) + '" ' + F(barTok(i)) + '/>';
  });
  // ป้ายแกน X: ทุก 5 วัน + วันนี้ (ตัวหนา)
  const ticks = [1, 5, 10, 15, 20, 25, 30].filter(d => d <= nDays && (todayIdx < 0 || Math.abs(d - 1 - todayIdx) > 2));
  ticks.forEach(d => { s += '<text class="ctext" x="' + (M.l + (d - 0.5) * band) + '" y="' + (H - 8) + '" text-anchor="middle" ' + F('--chart-ink') + '>' + d + '</text>'; });
  if (todayIdx >= 0) s += '<text class="ctext" font-weight="600" x="' + (M.l + (todayIdx + 0.5) * band) + '" y="' + (H - 8) + '" text-anchor="middle" ' + F('--chart-ink-strong') + '>' + (todayIdx + 1) + '</text>';
  // ป้ายค่าเฉพาะจุด: วันสูงสุด + วันนี้
  const lab = (i, txt) => {
    const cx = Math.min(Math.max(M.l + (i + 0.5) * band, M.l + 30), W - 30);
    return '<text class="ctext" font-weight="600" x="' + cx + '" y="' + (yS(data[i].v) - 7) + '" text-anchor="middle" ' + F('--chart-ink-strong') + '>' + esc(txt) + '</text>';
  };
  if (maxIdx >= 0) s += lab(maxIdx, (maxIdx === todayIdx ? 'วันนี้ ' : 'สูงสุด ') + compactBaht(Math.round(max / 100) * 100));
  if (todayIdx >= 0 && todayIdx !== maxIdx && data[todayIdx].v > 0 && Math.abs(maxIdx - todayIdx) * band > 84) s += lab(todayIdx, 'วันนี้ ' + compactBaht(Math.round(data[todayIdx].v / 100) * 100));
  s += '<rect class="dhit" x="' + M.l + '" y="0" width="' + pw + '" height="' + (H - 6) + '" fill="transparent"/>';
  s += '</svg>';
  el.innerHTML = s;

  const svg = el.querySelector('svg'), bandEl = svg.querySelector('#dBand');
  let active = -1;
  const def = todayIdx >= 0 ? todayIdx : (maxIdx >= 0 ? maxIdx : 0);
  function setActive(i, fromKey){
    active = i;
    svg.querySelectorAll('.dbar').forEach(p => { const k = +p.dataset.i; p.style.fill = 'var(' + (k === i ? '--barHover' : barTok(k)) + ')'; });
    if (i < 0){ bandEl.setAttribute('visibility', 'hidden'); hideTip(); return; }
    bandEl.setAttribute('x', M.l + i * band); bandEl.setAttribute('visibility', 'visible');
    const x = data[i], r = svg.getBoundingClientRect(), sx = r.width / W, sy = r.height / H;
    const title = fmtDow(x.iso) + ' ' + fmtDate(x.iso) + (i === todayIdx ? ' (วันนี้)' : '');
    const sub = x.n ? x.n + ' สลิป' : (mk === TODAY_MK && i > todayIdx ? 'ยังไม่ถึงวันนี้' : 'ไม่มีรายการ');
    showTip(r.left + (M.l + (i + 0.5) * band) * sx, r.top + yS(x.v) * sy, baht(x.v), title, sub);
    if (fromKey) $('dailyLive').textContent = title + ' ' + baht(x.v) + ' ' + sub;
  }
  const idxAt = cx => { const r = svg.getBoundingClientRect(); const x = (cx - r.left) * (W / r.width); return Math.max(0, Math.min(nDays - 1, Math.floor((x - M.l) / band))); };
  svg.addEventListener('pointermove', e => setActive(idxAt(e.clientX)));
  svg.addEventListener('pointerdown', e => setActive(idxAt(e.clientX)));
  svg.addEventListener('pointerleave', () => { if (document.activeElement !== svg) setActive(-1); });
  svg.addEventListener('focus', () => setActive(active >= 0 ? active : def, true));
  svg.addEventListener('blur', () => setActive(-1));
  svg.addEventListener('keydown', e => {
    const k = e.key; let i = active < 0 ? def : active;
    if (k === 'ArrowRight') i = Math.min(nDays - 1, i + 1); else if (k === 'ArrowLeft') i = Math.max(0, i - 1);
    else if (k === 'Home') i = 0; else if (k === 'End') i = nDays - 1;
    else if (k === 'Escape'){ setActive(-1); return; } else return;
    e.preventDefault(); setActive(i, true);
  });
}

function categoryLedger(counted){
  const total = sumBy(counted, amountOf);

    .map(([k, L]) => ({key:k, label:catOf(k).name, color:catOf(k).color, v:round2(sumBy(L, amountOf)), n:L.length})).sort((a, b) => b.v - a.v);

}
function projectLedger(counted){
  const total = sumBy(counted, amountOf);
  const items = Object.entries(groupBy(counted, r => r.project))
    .map(([p, L]) => ({key:p, label:p, np: p === NO_PROJ, v:round2(sumBy(L, amountOf)), n:L.length})).sort((a, b) => b.v - a.v).slice(0, 5);

function handleFile(input){
  const f = input.files && input.files[0], err = $('add-file-err');
  addFile = null; err.hidden = true; $('add-preview').hidden = true;
  if (!f) return;
  if (!/^image\//.test(f.type)){ err.textContent = 'ไฟล์ต้องเป็นรูปภาพ (JPG, PNG, HEIC)'; err.hidden = false; input.value = ''; return; }
  if (f.size > 5 * 1024 * 1024){ err.textContent = 'รูปต้องมีขนาดไม่เกิน 5 MB'; err.hidden = false; input.value = ''; return; }
  const rd = new FileReader();
  rd.onload = () => { addFile = rd.result; $('add-img').src = rd.result; $('add-fname').textContent = f.name + ' · ' + Math.round(f.size / 1024) + ' KB'; $('add-preview').hidden = false; };
  rd.readAsDataURL(f);
}

  if (v === 'list') syncStick();
  if (state.flashId && v === 'list'){
    const row = document.querySelector('#listBody [data-id="' + state.flashId + '"]');
    if (row){ row.scrollIntoView({block:'center'}); row.focus({preventScroll:true}); }
    setTimeout(() => { state.flashId = null; }, 1800);
  } else if (fromUser){
    const h2 = $('h-' + v); if (h2){ h2.setAttribute('tabindex', '-1'); h2.focus({preventScroll:true}); }
  }
}
function goFiltered(f){
  state.filters = Object.assign({q:'', cat:'all', status:'all', project:'all', poster:'all'}, f);
  state.fOpen = true;
  if (location.hash === '#list') route(true); else location.hash = '#list';
}
function stepMonth(step){
  const ms = monthsWithData(), i = ms.indexOf(state.month) + step;
  if (i < 0 || i >= ms.length) return;
  state.month = ms[i];
  rerender();
  const sel = '.view:not([hidden]) [data-act="month"]';
  const b = document.querySelector(sel + '[data-step="' + step + '"]:not(:disabled)') || document.querySelector(sel + ':not(:disabled)');
  if (b) b.focus();
}
const refocus = (act, val) => { const b = document.querySelector('[data-act="' + act + '"][data-val="' + CSS.escape(val) + '"]'); if (b) b.focus(); };
const announce = msg => { $('live').textContent = msg; };
let toastT = 0;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2400); }

/* ---------- event delegation ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const act = el.dataset.act, id = el.dataset.id, r = id ? byId(id) : null;
  switch (act){
    case 'month': stepMonth(+el.dataset.step); break;
    case 'open': openDetail(id, el); break;
    case 'close': closeSheet(); break;
    case 'cat-filter': hideTip(); goFiltered({cat: el.dataset.cat}); break;
    case 'proj-filter': goFiltered({project: el.dataset.proj}); break;
    case 'f-status': state.filters.status = el.dataset.val; renderListFilters(); renderListBody(); refocus(act, el.dataset.val); break;
    case 'f-cat': state.filters.cat = el.dataset.val; renderListFilters(); renderListBody(); refocus(act, el.dataset.val); break;
    case 'f-toggle': state.fOpen = !state.fOpen; renderListFilters(); break;
    case 'f-clear': state.filters = {q:'', cat:'all', status:'all', project:'all', poster:'all'}; $('f-q').value = ''; renderListFilters(); renderListBody(); $('f-q').focus(); break;
    case 'd-approve': r.status = 'approved'; closeSheet(); rerender(); toast(r.direction === 'in' ? 'บันทึกเป็นรายรับแล้ว' : 'อนุมัติแล้ว · ' + baht(r.amount)); break;
    case 'd-reject': armConfirm(el, 'แตะอีกครั้งเพื่อยืนยัน', () => { r.status = 'rejected'; closeSheet(); rerender(); toast('ไม่อนุมัติแล้ว · ไม่นับในยอด'); }); break;
    case 'rv-cat':
      r.category = el.dataset.cat;
      el.parentElement.querySelectorAll('.tchip').forEach(b => b.setAttribute('aria-pressed', String(b === el)));
      announce('ตั้งหมวด: ' + catOf(r.category).name);
      break;
    case 'rv-approve': {
      const inp = $('rv-amt-' + id);
      if (inp){
        const v = parseAmount(inp.value), err = $('rv-amt-err-' + id);
        if (isNaN(v) || v <= 0){ err.textContent = 'กรุณาระบุยอดเงินที่ถูกต้อง (มากกว่า 0)'; err.hidden = false; inp.setAttribute('aria-invalid', 'true'); inp.focus(); return; }
        r.amount = v;
      }
      r.project = $('rv-proj-' + id).value; r.status = 'approved';
      resolveCard(id, 'อนุมัติแล้ว · ' + baht(r.amount));
      break;
    }
    case 'rv-dup-remove': armConfirm(el, 'แตะอีกครั้งเพื่อยืนยัน', () => { r.status = 'rejected'; r.note = (r.note ? r.note + ' · ' : '') + 'ลบเพราะสลิปซ้ำ'; resolveCard(id, 'ลบรายการซ้ำแล้ว'); }); break;
    case 'rv-dup-keep': r.duplicateOf = null; rerender(); toast('ยืนยันว่าไม่ซ้ำ — ตรวจตามปกติ'); { const c = $('rv-' + id); if (c) c.querySelector('button').focus(); } break;
    case 'rv-income': r.status = 'approved'; r.category = 'other'; r.note = r.note || 'รายรับ (ลูกค้าโอนเข้า)'; resolveCard(id, 'บันทึกเป็นรายรับแล้ว · ไม่นับเป็นค่าใช้จ่าย'); break;
    case 'rv-ignore': r.status = 'rejected'; resolveCard(id, 'ไม่นับรายการนี้แล้ว'); break;
    case 'add-clear-file': addFile = null; $('add-file').value = ''; $('add-preview').hidden = true; $('add-file').focus(); break;
    case 'chat-qr': state.chatQR = el.dataset.val; renderMenu(); refocus(act, el.dataset.val); toast('ตัวอย่าง — ในระบบจริงบอทจะส่งตัวเลือกให้ในกลุ่ม'); break;
    case 'chat-proj': {
      const rec = byId(CHAT_ASK); rec.project = el.dataset.val; state.chatPick = el.dataset.val;
      renderMenu(); updateNav(); refocus(act, el.dataset.val); toast('ตั้งโครงการแล้ว — ยอดตามโครงการอัปเดตทุกหน้า');
      break;
    }
    case 'set-add': { const k = el.dataset.kind; state.setOpen[k] = true; $('set-' + k + '-row').hidden = false; el.setAttribute('aria-expanded', 'true'); $('set-' + k + '-new').focus(); break; }
    case 'set-cancel': { const k = el.dataset.kind; state.setOpen[k] = false; $('set-' + k + '-row').hidden = true; $('set-' + k + '-err').hidden = true;
      const b = document.querySelector('[data-act="set-add"][data-kind="' + k + '"]'); b.setAttribute('aria-expanded', 'false'); b.focus(); break; }
    case 'set-save': saveSetting(el.dataset.kind); break;
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.change === 'rv-proj'){ byId(t.dataset.id).project = t.value; announce('ตั้งโครงการ: ' + t.value); }
  else if (t.id === 'exp-month') updateExportSum();
  else if (t.id === 'add-file') handleFile(t);
});
document.addEventListener('submit', e => {
  if (e.target.id === 'd-form'){ e.preventDefault(); saveDetail(); }
  else if (e.target.id === 'add-form'){ e.preventDefault(); submitAdd(); }
});
document.addEventListener('keydown', e => {
  // กด Enter/Space บนแถวกราฟหมวด (SVG <g>) = คลิก
  if ((e.key === 'Enter' || e.key === ' ') && e.target instanceof SVGElement && e.target.matches('[data-act]')){ e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', {bubbles:true})); return; }
  if (e.key === 'Enter' && e.target.id && /^set-(cat|proj)-new$/.test(e.target.id)){ e.preventDefault(); saveSetting(e.target.id.split('-')[1]); return; }
  if ($('ov').hidden) return;
  if (e.key === 'Escape'){ e.preventDefault(); closeSheet(); return; }
  if (e.key === 'Tab'){
    // วนโฟกัสอยู่ในแผ่นรายละเอียด
    const f = [...$('sheet').querySelectorAll('button:not(:disabled),input,select,textarea,[href],[tabindex]:not([tabindex="-1"])')].filter(x => x.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }
});
$('ov').addEventListener('click', e => { if (e.target === $('ov')) closeSheet(); });
let rzT = 0;
window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { if (state.view === 'overview'){ hideTip(); drawDaily(); } if (state.view === 'list') syncStick(); }, 150); });
window.addEventListener('scroll', hideTip, {passive:true});
window.addEventListener('hashchange', () => route(true));

/* ---------- เริ่มต้น ---------- */
renderNav();
route(false);
</script>
</body>
</html>

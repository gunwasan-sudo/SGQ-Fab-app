<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>SGQ ตารางงานทีมช่าง</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Sans+Myanmar:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://static.line-scdn.net/liff/edge/versions/2.22.3/sdk.js"></script>
<style>
/* ===== UI v2 (ต.ค. 2569) — ตกลงจาก sample-ui-v2.html: แถบเมนูล่างจอ, Gantt สัปดาห์, แถบงานข้ามวันในเดือน ===== */
:root{
  --bg:#eef2f7; --surface:#fff; --ink:#0f172a; --ink2:#475569; --ink3:#94a3b8; --line:#e2e8f0;
  --brand:#0f4c81; --brand2:#1d6fd1; --brandSoft:#e7f0fb;
  --ok:#16a34a; --okSoft:#dcfce7; --warn:#d97706; --warnSoft:#fef3c7; --bad:#dc2626; --badSoft:#fee2e2;
  --offBg:#fff1f2; --offInk:#e11d48;
  --r:16px; --sh:0 1px 2px rgba(15,23,42,.06),0 6px 18px rgba(15,23,42,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#d9e0ea}
body{font-family:"Noto Sans Thai","Noto Sans Myanmar",system-ui,sans-serif;color:var(--ink);font-size:16px;line-height:1.45}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
a{color:var(--brand2)}
.app{max-width:440px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:104px}

/* header */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:12px 16px;background:linear-gradient(135deg,#0f4c81,#1a5f9e);color:#fff;box-shadow:0 2px 10px rgba(15,76,129,.25)}
.logo{width:40px;height:40px;border-radius:12px;background:#fff;color:var(--brand);font-weight:800;font-size:14px;display:grid;place-items:center;letter-spacing:.5px;flex:none}
.top .t1{font-weight:700;font-size:17px;line-height:1.2;display:flex;align-items:center;gap:6px}
.top .t2{font-size:13px;opacity:.85}
.top .sp{flex:1}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:#4ade80;flex:none}
.live.off{background:#fbbf24}
.langbtn{border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:5px 12px;font-size:13px;flex:none}
.meav{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:#fff;color:var(--brand);border:2px solid rgba(255,255,255,.6);flex:none;padding:0}

main{padding:14px 14px 0}

/* section head */
.shead{display:flex;align-items:center;gap:8px;margin:2px 2px 10px}
.shead h2{margin:0;font-size:20px;font-weight:700;flex:1;min-width:0}
.navbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;box-shadow:0 1px 2px rgba(0,0,0,.05);flex:none;padding:0}
.todaybtn{height:38px;border-radius:12px;border:1px solid var(--brand);background:#fff;color:var(--brand);padding:0 12px;font-weight:600;font-size:14px;flex:none}
.loadline{background:#fff7e6;color:#92400e;border-radius:12px;padding:8px 12px;margin-bottom:10px;font-size:14px}

/* week strip */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.sday{border:none;background:#fff;border-radius:14px;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:0 1px 2px rgba(15,23,42,.06)}
.sday .dn{font-size:12px;color:var(--ink2)}
.sday .dd{font-size:19px;font-weight:700}
.sday .dots{display:flex;gap:3px;height:7px;margin-top:2px}
.sday .dots i{width:6px;height:6px;border-radius:50%;display:block}
.sday.off{background:var(--offBg)} .sday.off .dn,.sday.off .dd{color:var(--offInk)}
.sday.today{outline:2px solid var(--brand2);outline-offset:-2px}
.sday.sel{background:var(--brand);box-shadow:0 6px 14px rgba(15,76,129,.35);transform:translateY(-2px)}
.sday.sel .dn,.sday.sel .dd{color:#fff}

/* summary */
.summary{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border-radius:12px;padding:8px 10px;background:#f8fafc}
.stat b{display:block;font-size:24px;line-height:1.1}
.stat span{font-size:13px;color:var(--ink2)}
.stat.prog{background:var(--warnSoft)} .stat.prog b{color:var(--warn)}
.stat.done{background:var(--okSoft)} .stat.done b{color:var(--ok)}
.crewrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:10px 4px;padding:14px 0 2px}
.cw{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--ink2);text-align:center;line-height:1.2}
.warnline{margin-top:10px;background:var(--badSoft);color:#991b1b;border-radius:10px;padding:8px 10px;font-size:14px}
.leaveline{margin-top:10px;background:#f1f5f9;color:#334155;border-radius:10px;padding:8px 10px;font-size:14px}
.leaveline a{color:var(--bad);text-decoration:none;font-weight:700;margin-left:2px}
.holline{margin-bottom:12px;background:var(--offBg);color:#9f1239;border-radius:12px;padding:10px 12px;font-size:15px;font-weight:600}

/* avatar */
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;font-size:15px;position:relative;flex:none}
.av.sm{width:30px;height:30px;font-size:12px}
.av .ring{position:absolute;right:-2px;bottom:-2px;width:15px;height:15px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;font-size:8px;color:#fff;line-height:1}
.av.sm .ring{width:12px;height:12px;font-size:7px}
.ring.in{background:var(--ok)} .ring.wait{background:var(--warn)} .ring.lv{background:#94a3b8}
.av.me{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--brand)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:14px;white-space:nowrap;font-weight:500}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* job card */
.job{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:14px 14px 14px 18px;margin-bottom:12px;position:relative;overflow:hidden;cursor:pointer}
.job::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--pc)}
.job.isdone{opacity:.72}
.row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.type{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:#f1f5f9;color:#334155;background:color-mix(in srgb,var(--pc) 14%,#fff);color:color-mix(in srgb,var(--pc) 75%,#000)}
.time{font-weight:700;font-size:15px}
.st{margin-left:auto;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.st-planned{background:#f1f5f9;color:#475569}
.st-in_progress{background:var(--warnSoft);color:#b45309}
.st-done{background:var(--okSoft);color:#15803d}
.st-postponed{background:#ede9fe;color:#6d28d9}
.st-cancelled{background:var(--badSoft);color:#b91c1c}
.job h3{margin:8px 0 2px;font-size:19px;line-height:1.3}
.spanline{font-size:13px;color:var(--ink2)}
.spanline b{color:var(--ink);font-weight:600}
.job .detail{margin:8px 0 0;font-size:15px;color:#334155;white-space:pre-line}
.job .note{margin:6px 0 0;font-size:14px;color:var(--ink2)}
.addr{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px;color:var(--ink2)}
.addr span{flex:1;min-width:0}
.go{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:10px;padding:5px 10px;font-size:13px;font-weight:600;color:var(--brand);text-decoration:none;white-space:nowrap;flex:none}
.crew{display:flex;align-items:center;gap:6px;margin-top:10px;flex-wrap:wrap}
.crew .names{font-size:13px;color:var(--ink2);margin-left:4px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.acts.one{grid-template-columns:1fr}
.btn{border:none;border-radius:12px;padding:12px 10px;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.start{background:var(--warn);color:#fff;box-shadow:0 3px 0 #b45309}
.btn.finish{background:var(--ok);color:#fff;box-shadow:0 3px 0 #15803d}
.btn.ghost{background:#f1f5f9;color:var(--ink);font-weight:600}
.btn.primary{background:var(--brand);color:#fff;box-shadow:0 3px 0 #0a365c}
.btn.danger{background:#fff;color:var(--bad);border:1px solid #fecaca;font-weight:600}
.btn.red{background:var(--bad);color:#fff;box-shadow:0 3px 0 #991b1b}
.btn.sm{padding:8px 10px;font-size:14px}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn:disabled{opacity:.6}
.mine-tag{position:absolute;top:0;right:0;background:var(--brand);color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-bottom-left-radius:10px}
.pend{margin-top:12px;font-size:14px;color:#b45309;background:#fef3c7;border-radius:10px;padding:8px 12px;text-align:center}

.empty{background:#fff;border-radius:var(--r);padding:28px 16px;text-align:center;color:var(--ink2);box-shadow:var(--sh)}
.empty .big{font-size:40px}
.offcard{background:linear-gradient(135deg,#fff1f2,#ffe4e6);color:#9f1239;border-radius:var(--r);padding:22px 16px;text-align:center;box-shadow:var(--sh)}
.offcard .big{font-size:42px}

/* week gantt */
.gwrap{background:#fff;border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.ghead,.wrow{display:grid;grid-template-columns:58px repeat(7,minmax(0,1fr))}
.ghead div{padding:8px 2px;text-align:center;font-size:12px;color:var(--ink2);border-bottom:1px solid var(--line);line-height:1.25;cursor:pointer}
.ghead div b{display:block;font-size:16px;color:var(--ink);margin:1px auto 0;width:28px;line-height:24px}
.ghead .off,.ghead .off b{color:var(--offInk)}
.ghead .today b{color:#fff;background:var(--brand);border-radius:8px}
.ghead .corner{cursor:default}
.ghead small{display:block;font-size:9px;color:var(--offInk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrow{grid-auto-rows:32px;border-bottom:1px solid var(--line);padding:4px 0}
.wrow:last-child{border-bottom:none}
.wname{grid-column:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;line-height:1.2;text-align:center;background:#fff;z-index:2;padding:0 2px;overflow:hidden}
.gcell{z-index:0}
.gcell.off{background:var(--offBg)}
.gcell.today{background:#eef5fd}
.bar{z-index:1;margin:2px 1px;border-radius:7px;color:#fff;font-size:11.5px;font-weight:600;padding:0 5px;min-width:0;display:flex;align-items:center;white-space:nowrap;overflow:hidden;border:none;text-align:left}
.bar span{overflow:hidden;text-overflow:ellipsis}
.bar.isdone{opacity:.45}
.bar.leave{background:repeating-linear-gradient(45deg,#cbd5e1,#cbd5e1 6px,#e2e8f0 6px,#e2e8f0 12px);color:#334155}
.bar.clash{outline:2px dashed var(--bad);outline-offset:-2px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink2);margin:10px 4px 0}
.legend i{display:inline-block;width:14px;height:10px;border-radius:3px;vertical-align:middle;margin-right:4px}

/* month */
.mcal{background:#fff;border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.mhead{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line)}
.mhead div{text-align:center;font-size:12px;font-weight:600;color:var(--ink2);padding:8px 0}
.mhead div.off{color:var(--offInk)}
.mweek{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:26px repeat(3,19px) 17px;border-bottom:1px solid var(--line)}
.mweek:last-child{border-bottom:none}
.mday{grid-row:1/6;padding:3px 0 0 5px;font-size:13px;font-weight:600;border:none;background:none;text-align:left;display:flex;flex-direction:column;box-shadow:inset -1px 0 #eef2f6}
.mday.out{color:#cbd5e1}
.mday.off{background:var(--offBg);color:var(--offInk)}
.mday.out.off{color:#fda4af}
.mday .n{width:24px;height:22px;display:grid;place-items:center;border-radius:7px}
.mday.today .n{background:var(--brand);color:#fff}
.mbar{z-index:1;margin:1px;border-radius:5px;color:#fff;font-size:11px;font-weight:600;padding:0 5px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;border:none;min-width:0}
.mbar span{overflow:hidden;text-overflow:ellipsis}
.mbar.isdone{opacity:.45}
.mbar.hol{background:#e11d48}
.mbar.cont{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:0}
.mbar.goes{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:0}
.mmore{grid-row:5;font-size:11px;color:var(--ink2);padding-left:6px;z-index:1;pointer-events:none}
.plist{background:#fff;border-radius:var(--r);box-shadow:var(--sh);margin-top:12px;padding:6px 0}
.plist h4{margin:8px 14px 4px;font-size:15px}
.pitem{display:flex;align-items:center;gap:10px;padding:9px 14px;border:none;background:none;width:100%;text-align:left;border-top:1px solid #f1f5f9}
.pitem i{width:12px;height:36px;border-radius:6px;flex:none}
.pitem .pt{flex:1;min-width:0}
.pitem .pt b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem .pt span{font-size:13px;color:var(--ink2)}
.pitem .cnt{font-size:13px;color:var(--ink2);white-space:nowrap}

/* menu */
.mlist{background:#fff;border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;margin-bottom:12px}
.mitem{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border:none;background:none;text-align:left;border-top:1px solid #f1f5f9;font-size:16px}
.mitem:first-child{border-top:none}
.mitem .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none}
.mitem .tx{flex:1}
.mitem .tx small{display:block;color:var(--ink2);font-size:13px}
.mitem .chev{color:var(--ink3)}
.mtitle{font-size:13px;font-weight:600;color:var(--ink2);margin:6px 4px 8px;letter-spacing:.3px}
.meinfo{display:flex;align-items:center;gap:12px;background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px;margin-bottom:12px}
.meinfo small{display:block;color:var(--ink2);font-size:13px}

/* bottom nav */
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,440px);z-index:40;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px rgba(15,23,42,.08)}
.bnav.nofab{grid-template-columns:repeat(4,1fr)}
.nb{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:12px;font-weight:600;color:var(--ink3);border-radius:14px}
.nb svg{width:24px;height:24px}
.nb.on{color:var(--brand);background:var(--brandSoft)}
.fab{display:flex;justify-content:center;align-items:flex-start}
.fab button{width:58px;height:58px;margin-top:-26px;border-radius:50%;border:4px solid #fff;background:linear-gradient(135deg,#1d6fd1,#0f4c81);color:#fff;font-size:30px;line-height:1;box-shadow:0 6px 16px rgba(15,76,129,.45);display:grid;place-items:center;padding:0}

/* modal (กล่องกลางจอ) */
.ov{position:fixed;inset:0;z-index:60;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;padding:16px}
.ov.on{display:flex;animation:fade .15s ease}
.sheet{background:#fff;width:min(100%,408px);max-height:86vh;overflow-y:auto;border-radius:20px;box-shadow:0 24px 60px rgba(0,0,0,.35);animation:pop .18s ease;-webkit-overflow-scrolling:touch}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:translateY(12px) scale(.97);opacity:.4}to{transform:none;opacity:1}}
.dhead{padding:16px 18px 14px;color:#fff;background:var(--pc,var(--brand));position:relative}
.dhead .type{background:rgba(255,255,255,.22);color:#fff}
.dhead h3{margin:8px 40px 2px 0;font-size:21px;line-height:1.3}
.dhead .sub{font-size:14px;opacity:.9}
.x{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:50%;border:none;background:rgba(255,255,255,.22);color:#fff;font-size:18px;padding:0}
.dbody{padding:16px 18px 18px}
.dtitle{font-size:20px;font-weight:700;margin:0 0 12px}
.dsub{margin:-6px 0 12px;color:var(--ink2);font-size:14px}
.stepper{display:flex;align-items:center;margin:0 0 16px}
.stepper .sp{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--ink3);flex:none;width:64px;text-align:center}
.stepper .sp i{width:26px;height:26px;border-radius:50%;background:#e2e8f0;display:grid;place-items:center;font-style:normal;font-size:13px;color:#fff;font-weight:700}
.stepper .sp.done i{background:var(--ok)} .stepper .sp.cur i{background:var(--warn);box-shadow:0 0 0 4px var(--warnSoft)}
.stepper .sp.done,.stepper .sp.cur{color:var(--ink)}
.stepper .ln{flex:1;height:3px;background:#e2e8f0;margin-bottom:18px;border-radius:2px}
.stepper .ln.done{background:var(--ok)}
.stbadge{display:inline-block;margin-bottom:14px}
.info{display:grid;grid-template-columns:26px 1fr;gap:10px 8px;font-size:15px;margin-bottom:14px}
.info .k{font-size:18px;text-align:center}
.info .v{min-width:0;overflow-wrap:anywhere;white-space:pre-line}
.info .v small{display:block;color:var(--ink2);font-size:13px}
.plist2{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.prow{display:flex;align-items:center;gap:10px;font-size:15px}
.prow .tag{margin-left:auto;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px}
.tag.in{background:var(--okSoft);color:#15803d} .tag.wait{background:var(--warnSoft);color:#b45309} .tag.lv{background:#f1f5f9;color:#475569}
.dacts{display:grid;gap:8px}
.dacts.two{grid-template-columns:1fr 1fr}

/* form */
.f label{display:block;font-size:14px;font-weight:600;color:var(--ink2);margin:12px 0 6px}
.f input,.f textarea,.f select{width:100%;min-width:0;max-width:100%;border:1.5px solid #dbe2ea;border-radius:12px;padding:11px 12px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}
.f input[type=file]{padding:8px;font-size:14px}
.f input:focus,.f textarea:focus,.f select:focus{outline:none;border-color:var(--brand2);box-shadow:0 0 0 3px var(--brandSoft)}
.f textarea{min-height:76px;resize:vertical}
.f .cbline{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--ink)}
.f .cbline input{width:auto}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchip{border:1.5px solid #dbe2ea;background:#fff;border-radius:999px;padding:7px 12px;font-size:14px;font-weight:500}
.tchip.on{border-color:var(--brand);background:var(--brandSoft);color:var(--brand);font-weight:700}
.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pk{border:1.5px solid #dbe2ea;background:#fff;border-radius:14px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;position:relative;line-height:1.2;text-align:center}
.pk.on{border-color:var(--brand);background:var(--brandSoft)}
.pk.on::after{content:"✓";position:absolute;top:4px;right:6px;color:var(--brand);font-weight:800;font-size:13px}
.pk.lv{opacity:.55}
.pk small{font-weight:400;color:var(--ink3);font-size:10px}
.teamlbl{grid-column:1/-1;font-size:12px;color:var(--ink3);font-weight:600;margin-top:4px}
.hint{font-size:13px;color:var(--ink2);margin-top:6px;font-weight:400}
.hint.bad{color:var(--bad)}

const LS = { get:k=>{try{return localStorage.getItem(k)}catch(e){return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}} };
let lang = LS.get('sgq_lang') || 'th';
const T = k => (I18N[lang][k] !== undefined ? I18N[lang][k] : I18N.th[k]);
function applyLang(){
  document.querySelectorAll('[data-i]').forEach(el => el.textContent = T(el.dataset.i));
  document.getElementById('langBtn').textContent = lang === 'th' ? 'မြန်မာ' : 'ไทย';
  document.documentElement.lang = lang;
}
function toggleLang(){ lang = lang === 'th' ? 'mm' : 'th'; LS.set('sgq_lang', lang); applyLang(); render(); }
const wName = w => (lang === 'mm' && w.name_mm) ? w.name_mm : w.name_th;

/* ================== state ================== */
// หน้าแอปโฮสต์บน GitHub Pages (URL บนสุด) เพื่อให้ LIFF ล็อกอินได้ — Apps Script เป็น backend ผ่าน fetch
const API_URL = 'https://script.google.com/macros/s/AKfycbzhVyuG_UMTLcr5GhVAdauWmd1B4k5W9ukIxLb8f3XW7UWkvkuJ-XudIBNHHCpmVBGh/exec';
// ?nologin=1 = โหมดทดสอบไม่ผ่าน LINE (backend จะปฏิเสธถ้าตั้ง LINE_LOGIN_CHANNEL_ID ไว้)
const LIFF_ID = /[?&]nologin=1/.test(location.search) ? '' : '2010515509-H5QemVMr';
let S = { userId:null, displayName:'', idToken:null, user:null, isAdmin:false, workers:[], jobTypes:[], statuses:[], today:null, checkinEnabled:false,
  view:'day', cursor:null, jobs:[], leaves:[], holidays:[], checkins:{userIds:[],names:[]}, version:0, filter:'all', loaded:{from:null,to:null} };

/* ================== date helpers ================== */
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const dow = s => parse(s).getDay();
const WEEKLY_OFF = [0];                                          // 0 = อาทิตย์ (บริษัททำงาน จ.–ส.)
const WEEK_ORDER = [1,2,3,4,5,6,0];                              // จ. อ. พ. พฤ. ศ. ส. อา.
const weekStart = s => addDays(s, -((dow(s)+6)%7));             // เริ่มวันจันทร์
const isWeeklyOff = s => WEEKLY_OFF.includes(dow(s));
// วันอาทิตย์ไม่แสดงงานที่ลากผ่าน (งานหลายวัน) — ยกเว้นงานที่ตั้งวันเริ่มเป็นวันอาทิตย์เอง ไม่งั้นงานนั้นจะหายจากแอป
const showOn = (j, d) => !isWeeklyOff(d) || j.start_date === d;
const holidayOf = s => S.holidays.find(h => h.date === s) || (isWeeklyOff(s) ? { date:s, name:T('weeklyOff'), weekly:true } : null);
const be = s => parse(s).getFullYear() + 543;
function fmt(s, withDay){ if(!s) return ''; const d = parse(s); return (withDay ? T('days')[d.getDay()]+' ' : '') + `${d.getDate()} ${T('months')[d.getMonth()]} ${d.getFullYear()+543}`; }
function fmtLong(s){ const d = parse(s); return `${T('daysFull')[d.getDay()]} ${d.getDate()} ${T('monthsFull')[d.getMonth()]} ${d.getFullYear()+543}`; }
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ================== API ================== */
function call(action, payload){
  payload = Object.assign({ userId: S.userId, displayName: S.displayName }, payload || {});
  // เปิดจาก GitHub Pages (ไม่มี google.script.run) → ยิง fetch ไป /exec ; ใน demo.html / Apps Script ใช้ google.script.run ตามเดิม
  if (typeof google === 'undefined' || !google.script || !google.script.run) return callFetch(action, payload);
  return new Promise((res, rej) => {
    var done = false;
    var timer = setTimeout(function(){
      if (done) return; done = true;
      rej(new Error('เรียก "' + action + '" ไม่ตอบกลับภายใน 30 วินาที'));
    }, 30000);
    google.script.run
      .withSuccessHandler(function(r){
        if (done) return; done = true; clearTimeout(timer);
        try { const o = JSON.parse(r); o.ok ? res(o) : rej(new Error(o.error)); }
        catch(err){ rej(new Error('อ่านผลลัพธ์ไม่ได้: ' + String(r).substring(0,150))); }
      })
      .withFailureHandler(function(e){
        if (done) return; done = true; clearTimeout(timer);
        rej(e instanceof Error ? e : new Error(String((e && e.message) || e)));
      })
      .api(action, payload);
  });
}
// การเขียน (ต้องตรงกับ WRITE_ACTIONS ใน Code.gs) — backend กันเขียนซ้ำด้วย reqId จึงยิงซ้ำ/คู่ขนานได้อย่างปลอดภัย
const WRITE_ACTIONS = ['register','saveJob','deleteJob','setStatus','uploadFile','saveLeave','deleteLeave','saveHoliday','deleteHoliday','saveWorker','broadcast'];
let netBusy = 0, writesInFlight = 0;
function netStart(isWrite){ netBusy++; if (isWrite) writesInFlight++; document.getElementById('netbar').classList.add('on'); }
function netEnd(isWrite){ netBusy = Math.max(0, netBusy-1); if (isWrite) writesInFlight = Math.max(0, writesInFlight-1); if (!netBusy) document.getElementById('netbar').classList.remove('on'); }

// ยิง 1 ครั้ง → JSON (โยน error ถ้าไม่ใช่ JSON เช่น หน้า 'ไม่พบเพจ' ของ Google)
function fetchApi(body, timeout){
  const ac = new AbortController(); const timer = setTimeout(() => ac.abort(), timeout);
  return fetch(API_URL, { method:'POST', redirect:'follow', signal: ac.signal,
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body })   // text/plain = ไม่มี CORS preflight
    .then(r => r.text())
    .then(txt => { try { return JSON.parse(txt); } catch(e) { throw new Error('อ่านผลลัพธ์ไม่ได้: ' + String(txt).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').substring(0,120)); } })
    .catch(e => { throw e.name === 'AbortError' ? new Error('เซิร์ฟเวอร์ไม่ตอบกลับภายใน ' + Math.round(timeout/1000) + ' วินาที') : e; })
    .finally(() => clearTimeout(timer));
}
// ยิงแบบ "hedged": Apps Script ตอบผ่าน redirect ไป script.googleusercontent.com ซึ่งวัดจริงล้ม ~1 ใน 3 ครั้ง
// และแต่ละครั้งค้าง ~10 วิ ก่อนคืน 404 — ถ้ารอให้ล้มก่อนค่อยยิงซ้ำ แอปจะค้างเป็นสิบวิ
// → ถ้าคำขอแรกยังไม่ตอบภายใน hedge ms ให้ยิงคำขอเดิม (reqId เดิม) คู่ขนานเพิ่ม เอาคำตอบแรกที่มา ตัวที่เหลือทิ้ง
let netSlow = false;   // ครั้งล่าสุดช้า/ล้ม → ครั้งถัดไปยิง 2 คำขอพร้อมกันตั้งแต่แรก (Google ช้าเป็นช่วง ๆ ไม่ใช่ทีละคำขอ)
function hedgedFetch(body, { hedge, timeout, maxAttempts, burst }){
  return new Promise((resolve, reject) => {
    let attempts = 0, inflight = 0, settled = false, lastErr = null, hedgeTimer = null;
    const t0 = Date.now();
    const fire = () => {
      if (settled || attempts >= maxAttempts) return;
      attempts++; inflight++;
      fetchApi(body, timeout)
        .then(o => { if (settled) return; settled = true; clearInterval(hedgeTimer); netSlow = (Date.now() - t0) > 6000; resolve(o); })
        .catch(e => { lastErr = e; })
        .finally(() => {
          inflight--;
          if (settled) return;
          if (attempts < maxAttempts) setTimeout(fire, 300);                          // ล้ม → ยิงใหม่ทันที
          else if (inflight === 0) { clearInterval(hedgeTimer); netSlow = true; reject(lastErr || new Error('เชื่อมต่อไม่ได้')); }
        });
    };
    fire();
    if (burst && netSlow) setTimeout(fire, 150);
    hedgeTimer = setInterval(fire, hedge);
  });
}
async function callFetch(action, payload){
  const isWrite = WRITE_ACTIONS.includes(action);
  const heavy = action === 'uploadFile' || action === 'exportWeek' || (payload.photos && payload.photos.length);   // ข้อมูลใหญ่/งานหนัก ไม่รีบยิงซ้ำ
  const reqId = Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  const body = JSON.stringify({ action, payload, idToken: S.idToken, reqId });
  netStart(isWrite);
  let o;
  try { o = await hedgedFetch(body, { hedge: heavy ? 20000 : isWrite ? 8000 : 3500, timeout: heavy ? 90000 : isWrite ? 60000 : 20000, maxAttempts: heavy ? 2 : 4, burst: !heavy }); }
  finally { netEnd(isWrite); }
  if (o.ok) return o;
  if (o.code === 'token' && LIFF_ID && typeof liff !== 'undefined') {   // token หมดอายุ → ล็อกอินใหม่
    try { liff.logout(); } catch(e) {}
    liff.login(); await new Promise(() => {});
  }
  throw new Error(o.error);
}
// poll เวอร์ชัน: ยิงครั้งเดียว ไม่ hedge ไม่ retry (เบื้องหลัง ประหยัดโควตา) — ล้มก็แค่จุดส้ม รอบหน้าค่อยลองใหม่
function callVersion(){
  if (typeof google !== 'undefined' && google.script && google.script.run) return call('version');
  return fetchApi(JSON.stringify({ action:'version', payload:{ userId:S.userId }, idToken:S.idToken }), 12000)
    .then(o => { if (!o.ok) throw new Error(o.error); return o; });
}
function noteVersion(r){ if (r && r.version != null) S.version = r.version; }   // หลังเขียนสำเร็จ: ไม่ต้องโหลดซ้ำเพราะ state ในเครื่องตรงแล้ว
function upsertLocal(list, key, obj){ const i = list.findIndex(x => x[key] === obj[key]); if (i < 0) list.push(obj); else list[i] = obj; }
function step(m){ const el = document.getElementById('loaderTxt'); if (el) el.textContent = m; }
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.style.display='block'; clearTimeout(t._h); t._h = setTimeout(()=>t.style.display='none', 2200); }

/* ================== อัพเดตหน้าแอปอัตโนมัติ ==================
   GitHub Pages ให้แคช HTML 10 นาที (เบราว์เซอร์ใน LINE อาจนานกว่า) → อัพเดตแล้วช่างยังเห็นหน้าเก่า
   ตอนเปิดแอป/กลับมาที่แอป: ดึง index.html สด (no-store + ?_=เวลา) อ่าน APP_BUILD ถ้าไม่ตรงกับหน้านี้
   → โหลดใหม่ด้วย ?v=<build> (URL ใหม่ = ไม่โดนแคช) · ไม่โหลดใหม่ขณะมีการบันทึกค้าง/เปิดฟอร์มอยู่ (ลองใหม่รอบหน้า)
   · กันวนด้วย sessionStorage (โหลดใหม่ได้ครั้งเดียวต่อ build) · เช็กเฉพาะบน github.io (demo/Apps Script ข้าม)
   **แก้ index.html แล้วต้องเปลี่ยน APP_BUILD ทุกครั้ง** ไม่งั้นเครื่องที่ติดแคชจะไม่รู้ว่ามีของใหม่ */
const APP_BUILD = '2026-10-11.2';   // UI v2
let updChecking = false, updLast = 0;
async function checkAppUpdate(){
  if (!/\.github\.io$/.test(location.hostname)) return;
  if (updChecking || Date.now() - updLast < 60000) return;   // ไม่เช็กถี่กว่า 1 นาที/ครั้ง
  updChecking = true; updLast = Date.now();
  try {
    const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 8000);
    const html = await fetch(location.pathname + '?_=' + Date.now(), { cache: 'no-store', signal: ctl.signal }).then(r => r.ok ? r.text() : '');
    clearTimeout(tm);
    const m = html.match(/const APP_BUILD = '([^']+)'/);
    if (!m || m[1] === APP_BUILD) return;
    const key = 'sgq_reloaded_' + m[1];
    try { if (sessionStorage.getItem(key)) return; } catch(e) {}
    const busy = S.jobs.some(j => j._pending) || S.leaves.some(l => /^tmp/.test(String(l.leave_id))) || ov().classList.contains('on');
    if (busy) { updLast = 0; return; }
    try { sessionStorage.setItem(key, '1'); } catch(e) {}
    const u = new URL(location.origin + location.pathname);
    if (/[?&]nologin=1/.test(location.search)) u.searchParams.set('nologin', '1');
    u.searchParams.set('v', m[1]);
    location.replace(u.toString());
  } catch(e) {} finally { updChecking = false; }
}
// กลับมาที่แอป → เช็กของใหม่ (ผูกนอก boot: แม้ boot ล้ม/ขึ้นหน้า error ก็ยังได้หน้าเวอร์ชันแก้แล้ว)
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkAppUpdate(); });

/* ================== boot ================== */

  checkAppUpdate();   // เบื้องหลัง ไม่รอ — มีของใหม่จะโหลดหน้าใหม่เอง
  try{
    if (LIFF_ID){
      step('1/4 เชื่อมต่อ LINE...');
      if (typeof liff === 'undefined') throw new Error('โหลด LIFF SDK ไม่สำเร็จ (เน็ตมีปัญหา หรือถูกบล็อก)');
      await liff.init({ liffId: LIFF_ID });
      // ห้ามใส่ redirectUri: ใน Apps Script location.href คือ URL ของ iframe (googleusercontent)
      // ซึ่งไม่ตรงกับ Endpoint URL ของ LIFF จะโดนปฏิเสธและได้หน้าขาว
      if (!liff.isLoggedIn()) { step('กำลังพาไปล็อกอิน LINE...'); liff.login(); return; }
      step('2/4 อ่านโปรไฟล์...');
      const p = await liff.getProfile(); S.userId = p.userId; S.displayName = p.displayName;
      S.idToken = liff.getIDToken();
    } else {  // โหมดทดสอบ (?nologin=1)
      S.userId = LS.get('sgq_dev_uid') || prompt('DEV: ใส่ userId ทดสอบ (เช่น admin1)') || 'dev';
      LS.set('sgq_dev_uid', S.userId); S.displayName = 'DEV';
    }
    step('3/4 เชื่อมต่อฐานข้อมูล...');
    // แสดงตารางครั้งล่าสุดจากเครื่องทันที (ถ้ามี) ระหว่างรอ Apps Script — แล้วค่อยอัพเดตเงียบ ๆ
    S.today = S.cursor = ymd(new Date());
    const cached = loadCache();
    if (cached) { applyState(cached); S.today = S.cursor = ymd(new Date()); render(); document.getElementById('loader').style.display = 'none'; toast(T('refreshing')); }
    // init รอบเดียวพร้อมข้อมูลช่วงกว้าง (ย้อน 5 สัปดาห์ / ล่วงหน้า 10 สัปดาห์) → เลื่อน วัน/สัปดาห์/เดือน ได้ทันทีไม่ต้องรอเซิร์ฟเวอร์
    const [a0, b0] = viewRange(); const f0 = addDays(a0, -RANGE_BACK), t0 = addDays(b0, RANGE_FWD);
    let r;
    try { r = await call('init', { from: f0, to: t0 }); }
    catch(e) { if (!cached) throw e; toast(T('refreshFail') + ' ' + (e.message || e)); r = null; }
    if (r) {
      applyState({ user:r.user, isAdmin:r.isAdmin, workers:r.workers, jobTypes:r.jobTypes, statuses:r.statuses, today:r.today, checkinEnabled:r.checkinEnabled, version:r.version, companyName:r.companyName,
        jobs:r.jobs, leaves:r.leaves, holidays:r.holidays, checkins:r.checkins, loaded: r.jobs ? { from:f0, to:t0 } : { from:null, to:null } });
      if (!cached) S.cursor = S.today;
      if (!r.jobs) { step('4/4 โหลดตารางงาน...'); await loadRange(true); }   // backend/mock รุ่นเก่าไม่คืนข้อมูลใน init
      saveCache();
      render();
    }
    document.getElementById('loader').style.display = 'none';
    if (r && !S.user && !S.isAdmin) openRegister();
    // poll ทุก 20 วิ และหยุดเมื่อแอปอยู่เบื้องหลัง — ประหยัดโควตารันสคริปต์ (ฟรี 90 นาที/วัน)
    setInterval(() => { if (!document.hidden) pollVersion(); }, 20000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) pollVersion(); });
  }catch(e){
    const inLine = /Line\//i.test(navigator.userAgent);
    document.getElementById('loaderTxt').innerHTML =
      '<div style="max-width:340px;text-align:left;font-size:13px;line-height:1.7;color:#334155">' +
      '<b style="color:#dc2626">เปิดแอปไม่สำเร็จ</b><br><br>' +
      '<b>สาเหตุ:</b> ' + esc(e.message || e) + '<br>' +
      (e.code ? '<b>code:</b> ' + esc(e.code) + '<br>' : '') +
      '<b>LIFF ID:</b> ' + (LIFF_ID ? esc(LIFF_ID) : '(ไม่ได้ตั้งค่า)') + '<br>' +
      '<b>เปิดจาก:</b> ' + (inLine ? 'แอป LINE' : 'เบราว์เซอร์ปกติ') + '<br><br>' +
      'ถ่ายหน้าจอนี้ส่งให้ผู้ดูแลระบบได้เลย</div>';
    console.error('boot error', e);
  }
}

let pollBusy = false;
async function pollVersion(){
  if (pollBusy || writesInFlight) return;      // กำลังบันทึกอยู่ → ไม่รีเฟรชทับ state ที่เพิ่งแก้ในเครื่อง

/* ================== data range ================== */
const RANGE_BACK = 35, RANGE_FWD = 70;   // โหลดกว้างกว่าที่ดู จะได้เลื่อนดูได้โดยไม่ต้องรอเซิร์ฟเวอร์
function viewRange(){
  const c = S.cursor;
  if (S.view === 'day' || S.view === 'menu') return [c, c];
  if (S.view === 'week') { const ws = weekStart(c); return [ws, addDays(ws, 6)]; }
  const d = parse(c); const first = ymd(new Date(d.getFullYear(), d.getMonth(), 1));
  const gridStart = weekStart(first); return [gridStart, addDays(gridStart, 41)];
}
let rangeReq = null;   // คำขอ getData ที่ค้างอยู่ (กันยิงซ้ำเมื่อกดเลื่อนรัว ๆ)
function loadRange(force){
  const [a,b] = viewRange();
  const from = addDays(a,-7), to = addDays(b,7);
  const covered = S.loaded.from && S.loaded.from <= from && S.loaded.to >= to;
  if (!force && covered) { render(); return Promise.resolve(); }
  if (!force && rangeReq && rangeReq.from <= from && rangeReq.to >= to) { render(); return rangeReq.p; }
  // ช่วงที่โหลด = ช่วงเดิม ∪ ช่วงกว้างรอบที่ดู (ถ้าเดิมกว้างเกิน ~1 ปีให้เริ่มนับใหม่ ไม่ให้คำตอบบวมขึ้นเรื่อย ๆ)
  let f = addDays(a,-RANGE_BACK), t = addDays(b,RANGE_FWD);
  if (S.loaded.from && S.loaded.to && addDays(S.loaded.from, 365) > S.loaded.to) { if (S.loaded.from < f) f = S.loaded.from; if (S.loaded.to > t) t = S.loaded.to; }
  if (!covered) render();   // แสดงเท่าที่มีไปก่อน (แถบโหลดด้านบนบอกว่ากำลังดึงข้อมูล)
  const req = { from:f, to:t };
  req.p = (async () => {
    try {
      const r = await call('getData', { from:f, to:t });
      const pend = S.jobs.filter(j => j._pending);   // งานที่กำลังบันทึกอยู่ในเครื่อง ห้ามหายไปกับข้อมูลจากเซิร์ฟเวอร์
      S.jobs = r.jobs.filter(j => !pend.some(p => p.job_id === j.job_id)).concat(pend);
      S.leaves = r.leaves; S.holidays = r.holidays; S.checkins = r.checkins; S.workers = r.workers; S.version = r.version; S.today = r.today;
      S.loaded = { from:f, to:t };
      saveCache();
      return true;
    } catch(e) {
      document.getElementById('live').className = 'live off';
      toast(T('refreshFail') + ' ' + (e.message || e));
      return false;
    } finally { if (rangeReq === req) rangeReq = null; render(); }
  })();
  rangeReq = req;
  return req.p;
}
// ช่วงที่กำลังดูมีข้อมูลครบหรือยัง (ไม่ครบ = กำลังโหลด → โชว์แถบบอกในหน้า)

/* ================== ช่าง / สีโปรเจกต์ / เช็คอิน ================== */
const worker = id => S.workers.find(w => w.worker_id === id);
/* ===== สีตามโปรเจกต์: งานโปรเจกต์เดียวกันสีเดียวกันทุกวัน/ทุกมุมมอง, ต่างโปรเจกต์ต่างสี (คละแบบสุ่มแต่คงที่) =====
   ชื่อ "บ้านคุณหมวย" = "คุณหมวย", "หมู่บ้านเอสเคฟ" = "หมู่เอสเคฟ" (ตัดคำนำหน้า/ช่องว่าง/สระซ้ำ)
   เลือกสีจาก hash ของชื่อ ชนกับโปรเจกต์อื่นที่โหลดอยู่ → เลื่อนไปสีถัดไปที่ยังว่าง (ทุกสีอ่านตัวอักษรขาวได้) */
const PROJ_COLORS = ['#2563eb','#dc2626','#15803d','#9333ea','#c2410c','#0e7490','#be185d','#4d7c0f','#a16207','#3730a3',
  '#0f766e','#78350f','#64748b','#1e3a8a','#991b1b','#166534','#6b21a8','#9a3412','#155e75','#86198f'];
function projKey(name){
  const raw = String(name||'').normalize('NFC');
  const k = raw.replace(/\[[^\]]*\]/g,'').replace(/([ั-ฺ็-๎])\1+/g,'$1').replace(/\s+/g,'')
    .replace(/^(?:หมู่บ้าน|หมู่|บ้าน|คุณ|งาน|โครงการ)+/,'');
  return k || raw;
}
function hashStr(s){ let h = 2166136261; for (const ch of s){ h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
let projMap = {}, projSig = '';
function projColor(j){
  const sig = S.jobs.length + ':' + S.version;
  if (sig !== projSig) {
    projSig = sig; projMap = {}; const used = new Set(), N = PROJ_COLORS.length;
    [...new Set(S.jobs.map(x => projKey(x.customer)))]
      .sort((a,b) => hashStr(a) - hashStr(b) || a.localeCompare(b))
      .forEach(k => { let i = hashStr(k) % N; for (let n = 0; n < N && used.has(i); n++) i = (i + 1) % N;
        used.add(i); if (used.size >= N) used.clear(); projMap[k] = PROJ_COLORS[i]; });
  }
  const k = projKey(j.customer);
  return projMap[k] || PROJ_COLORS[hashStr(k) % PROJ_COLORS.length];
}
function checkinState(w){
  // ok=false = ต่อระบบเช็คอินไม่ได้ → ไม่แสดงสัญลักษณ์เลย (ไม่ให้ ⏳ ทุกคนจนเข้าใจผิด)
  if (!S.checkinEnabled || !S.checkins || !S.checkins.ok) return '';
  const ok = (S.checkins.workerIds || []).includes(w.worker_id) ||
    (w.line_user_id && S.checkins.userIds.includes(w.line_user_id)) || S.checkins.names.includes(w.name_th);
  return ok ? 'ci' : 'nci';
}

function wInitial(w){ const n = String(w.name_th || '?').replace(/^ช่าง/, '') || String(w.name_th || '?'); return /^[เแโใไ]/.test(n) ? n.slice(0, 2) : n.slice(0, 1); }

function ciState(wid, d){
  if (leaveOf(wid, d)) return 'lv';
  if (d !== S.today) return '';
  const w = worker(wid); if (!w) return '';
  const s = checkinState(w); return s === 'ci' ? 'in' : s === 'nci' ? 'wait' : '';
}
function avatar(wid, d, sm){
  const w = worker(wid); if (!w) return `<span class="av${sm?' sm':''}" style="background:#94a3b8">?</span>`;
  const s = d ? ciState(wid, d) : '';
  const ring = s ? `<span class="ring ${s}">${s==='in'?'✓':s==='lv'?'–':''}</span>` : '';
  const me = S.user && S.user.worker_id === wid ? ' me' : '';
  return `<span class="av${sm?' sm':''}${me}" style="background:${wColor(w)}" title="${esc(wName(w))}">${esc(wInitial(w))}${ring}</span>`;

function viewDay(){
  const d = S.cursor, ws = weekStart(d), dt = parse(d);
  let h = `<div class="shead"><h2>${T('monthsFull')[dt.getMonth()]} ${dt.getFullYear()+543}</h2>
    ${d!==S.today?`<button class="todaybtn" onclick="goToday()">${T('today')}</button>`:''}
    <button class="navbtn" onclick="dayWeek(-1)">${ICONS.l}</button><button class="navbtn" onclick="dayWeek(1)">${ICONS.r}</button></div>`;
  h += '<div class="strip">';
  for (let i = 0; i < 7; i++){
    const x = addDays(ws, i), js = jobsOn(x).filter(j => j.status !== 'cancelled');
    const dots = [...new Set(js.map(pc))].slice(0,3).map(c => `<i style="background:${c}"></i>`).join('');
    h += `<button class="sday ${isOffDay(x)?'off':''} ${x===S.today?'today':''} ${x===d?'sel':''}" onclick="pickDay('${x}')">
      <span class="dn">${T('days')[dow(x)]}</span><span class="dd">${parse(x).getDate()}</span><span class="dots">${dots}</span></button>`;
  }
  h += '</div>';

  const all = S.jobs.filter(j => j.start_date <= d && j.end_date >= d && showOn(j, d) && j.status !== 'cancelled');
  const hol = holidayOf(d);
  const leaves = S.leaves.filter(l => l.date_from <= d && l.date_to >= d);
  if (hol && !all.length){
    let nx = addDays(d,1); for (let k = 0; k < 14 && holidayOf(nx); k++) nx = addDays(nx,1);
    return h + `<div class="offcard"><div class="big">${hol.weekly?'🌴':'🎌'}</div><b>${esc(hol.weekly?T('weeklyOff'):hol.name)}</b><div>${fmtLong(d)}</div>
      ${S.isAdmin && !hol.weekly ? `<div style="margin-top:8px"><a href="#" onclick="openHoliday('${d}');return false">${T('edit')}</a></div>` : ''}
      <button class="btn primary" style="margin:14px auto 0;padding:10px 18px" onclick="pickDay('${nx}')">${T('seeNext')} →</button></div>`;
  }
  if (hol) h += `<div class="holline">🎌 ${esc(hol.weekly?T('weeklyOff'):hol.name)}</div>`;

  const busy = [...new Set(all.flatMap(asgIds))];
  const leaverIds = [...new Set(leaves.map(l => l.worker_id))];
  const clash = leaverIds.filter(id => busy.includes(id));
  const crewIds = [...new Set([...busy, ...leaverIds])].filter(id => worker(id));
  h += `<div class="summary"><div class="stats">
      <div class="stat"><b>${all.length}</b><span>${T('jobsN')}</span></div>
      <div class="stat prog"><b>${all.filter(j=>j.status==='in_progress').length}</b><span>${T('inprog')}</span></div>
      <div class="stat done"><b>${all.filter(j=>j.status==='done').length}</b><span>${T('doneN')}</span></div></div>
    ${crewIds.length ? `<div class="crewrow">${crewIds.map(id => `<div class="cw">${avatar(id, d)}<span>${esc(wName(worker(id)))}</span></div>`).join('')}</div>` : ''}
    ${leaves.length ? `<div class="leaveline">🏖 ${T('leave')}: ${leaves.map(l => { const w = worker(l.worker_id);
        return `${esc(w?wName(w):l.worker_id)} (${esc(l.type)})` + (S.isAdmin ? ` <a href="#" onclick="delLeave('${esc(l.leave_id)}');return false" aria-label="${esc(T('del'))}">✕</a>` : ''); }).join(', ')}</div>` : ''}
    ${clash.length ? `<div class="warnline">⚠ ${clash.map(id => esc(wName(worker(id)))).join(', ')} — ${T('leaveClash')}</div>` : ''}</div>`;
  h += chipsHtml();
  const js = all.filter(applyFilter).sort((a,b) => (isMine(b)-isMine(a)) || (a.start_time||'99').localeCompare(b.start_time||'99'));
  if (!js.length) h += `<div class="empty"><div class="big">🗓️</div>${T('noJobs')}</div>`;
  js.forEach(j => h += jobCard(j, d));
  return h;
}

function actionsHtml(j, inModal){

function jobCard(j, d){
  const n = Math.round((parse(j.end_date) - parse(j.start_date)) / 864e5) + 1, k = Math.round((parse(d) - parse(j.start_date)) / 864e5) + 1;
  return `<article class="job ${j.status==='done'?'isdone':''}" style="--pc:${pc(j)}" onclick="if(!event.target.closest('button,a'))openDetail('${j.job_id}')">
    ${isMine(j) && S.filter !== 'me' ? `<span class="mine-tag">${T('myJobs')}</span>` : ''}
    <div class="row1"><span class="type">${TYPE_IC[j.job_type]||''} ${esc(T('types')[j.job_type]||j.job_type)}</span>${j.start_time?`<span class="time">${esc(j.start_time)}</span>`:''}
      <span class="st st-${esc(j.status)}">${esc(T('statuses')[j.status]||j.status)}</span></div>
    <h3>${esc(j.customer)}</h3>
    ${n>1?`<div class="spanline"><b>${T('dayOf')} ${k}/${n}</b> · ${shortD(j.start_date)} – ${shortD(j.end_date)}</div>`:''}
    ${j.detail?`<p class="detail">${esc(j.detail)}</p>`:''}
    ${j.note?`<p class="note">💬 ${esc(j.note)}</p>`:''}
    ${addrHtml(j)}
    <div class="crew">${asgIds(j).map(id => avatar(id, d, true)).join('')}<span class="names">${esc(wNames(j) || T('unassigned'))}</span></div>
    ${actionsHtml(j)}</article>`;

/* ---------- สัปดาห์ (แท่งต่อเนื่องแบบ Gantt) ---------- */
function lanes(items){   // ใส่ lane ไม่ให้แท่งทับกัน (items: {a,b} = index วันในสัปดาห์)
  const end = []; items.sort((x,y) => x.a - y.a || (y.b-y.a) - (x.b-x.a));
  items.forEach(it => { let L = end.findIndex(e => e < it.a); if (L < 0){ L = end.length; end.push(-1); } end[L] = it.b; it.lane = L; });
  return Math.max(1, end.length);
}
// ช่วงวันของงานในสัปดาห์ ws: ตัดวันอาทิตย์ท้ายสัปดาห์ออกตามกติกา showOn (ยกเว้นงานเริ่มวันอาทิตย์เอง)
function segOf(j, ws){
  let a = Math.max(0, Math.round((parse(j.start_date) - parse(ws)) / 864e5));
  let b = Math.min(6, Math.round((parse(j.end_date) - parse(ws)) / 864e5));
  if (b === 6 && !showOn(j, addDays(ws, 6))) b = 5;
  return b >= a ? { a, b } : null;
}
function viewWeek(){
  const ws = weekStart(S.cursor), we = addDays(ws,6);
  let h = `<div class="shead"><h2>${shortD(ws)} – ${shortD(we)}</h2>
    ${weekStart(S.today)!==ws?`<button class="todaybtn" onclick="goToday()">${T('today')}</button>`:''}
    <button class="navbtn" onclick="nav(-1)">${ICONS.l}</button><button class="navbtn" onclick="nav(1)">${ICONS.r}</button></div>`;
  h += chipsHtml();
  h += `<div class="gwrap"><div class="ghead"><div class="corner">${T('worker')}</div>`;
  for (let i = 0; i < 7; i++){ const x = addDays(ws,i), hol = holidayOf(x);
    h += `<div class="${hol?'off':''} ${x===S.today?'today':''}" onclick="pickDay('${x}')">${T('days')[dow(x)]}<b>${parse(x).getDate()}</b>${hol && !hol.weekly ? `<small>${esc(hol.name)}</small>` : ''}</div>`; }
  h += '</div>';
  let list = S.workers;
  if (S.filter === 'me' && S.user) list = S.workers.filter(w => w.worker_id === S.user.worker_id);
  else if (S.filter.startsWith('team:')) list = S.workers.filter(w => w.team === S.filter.slice(5));
  const live = S.jobs.filter(j => j.status !== 'cancelled' && j.end_date >= ws && j.start_date <= we);
  const rowHtml = (label, items) => {
    const L = Math.max(2, lanes(items));
    let r = `<div class="wrow" style="grid-template-rows:repeat(${L},32px)"><div class="wname" style="grid-row:1/${L+1}">${label}</div>`;
    for (let i = 0; i < 7; i++){ const x = addDays(ws,i); r += `<div class="gcell ${holidayOf(x)?'off':''} ${x===S.today?'today':''}" style="grid-column:${i+2};grid-row:1/${L+1}"></div>`; }
    items.forEach(it => {
      const pos = `grid-column:${it.a+2}/${it.b+3};grid-row:${it.lane+1}`;
      if (it.lv) r += `<div class="bar leave" style="${pos}"><span>🏖 ${esc(it.lv.type || T('onLeave'))}</span></div>`;
      else {
        const clash = items.some(o => o.lv && o.a <= it.b && o.b >= it.a);
        r += `<button class="bar ${it.j.status==='done'?'isdone':''} ${clash?'clash':''}" style="${pos};background:${pc(it.j)}" onclick="openDetail('${it.j.job_id}')"><span>${TYPE_IC[it.j.job_type]||''} ${esc(it.j.customer)}</span></button>`;
      }
    });
    return r + '</div>';
  };
  list.forEach(w => {
    const items = [];
    live.filter(j => asgIds(j).includes(w.worker_id)).forEach(j => { const s = segOf(j, ws); if (s) items.push(Object.assign({ j }, s)); });
    S.leaves.filter(l => l.worker_id === w.worker_id && l.date_to >= ws && l.date_from <= we).forEach(l =>
      items.push({ lv: l, a: Math.max(0, Math.round((parse(l.date_from)-parse(ws))/864e5)), b: Math.min(6, Math.round((parse(l.date_to)-parse(ws))/864e5)) }));
    h += rowHtml(`${avatar(w.worker_id, null, true)}<span>${esc(wName(w))}</span>`, items);
  });
  if (S.filter === 'all'){
    const un = []; live.filter(j => !asgIds(j).length).forEach(j => { const s = segOf(j, ws); if (s) un.push(Object.assign({ j }, s)); });
    if (un.length) h += rowHtml(`<span style="font-size:18px">❓</span><span>${T('unassigned')}</span>`, un);
  }
  h += `</div><div class="legend"><span><i style="background:var(--offBg);border:1px solid #fecdd3"></i>${T('holiday')}</span>
    <span><i style="background:repeating-linear-gradient(45deg,#cbd5e1,#cbd5e1 3px,#e2e8f0 3px,#e2e8f0 6px)"></i>${T('leave')}</span>
    <span><i style="outline:2px dashed var(--bad);outline-offset:-2px;background:#fff"></i>${T('leaveClash')}</span></div>`;
  return h;
}

/* ---------- เดือน ---------- */
function viewMonth(){
  const c = parse(S.cursor), y = c.getFullYear(), mo = c.getMonth();
  const first = ymd(new Date(y, mo, 1)), last = ymd(new Date(y, mo+1, 0)), gs = weekStart(first);
  const weeks = Math.ceil((Math.round((parse(last) - parse(gs)) / 864e5) + 1) / 7);
  let h = `<div class="shead"><h2>${T('monthsFull')[mo]} ${y+543}</h2>
    ${(S.today||'').slice(0,7)!==first.slice(0,7)?`<button class="todaybtn" onclick="goToday()">${T('today')}</button>`:''}
    <button class="navbtn" onclick="nav(-1)">${ICONS.l}</button><button class="navbtn" onclick="nav(1)">${ICONS.r}</button></div>`;
  h += chipsHtml();
  h += `<div class="mcal"><div class="mhead">${WEEK_ORDER.map(i => `<div class="${WEEKLY_OFF.includes(i)?'off':''}">${T('days')[i]}</div>`).join('')}</div>`;
  for (let w = 0; w < weeks; w++){
    const a = addDays(gs, w*7), b = addDays(a, 6);
    h += '<div class="mweek">';
    for (let i = 0; i < 7; i++){
      const x = addDays(a,i), out = parse(x).getMonth() !== mo;
      h += `<button class="mday ${out?'out':''} ${holidayOf(x)?'off':''} ${x===S.today?'today':''}" style="grid-column:${i+1}" onclick="pickDay('${x}')"><span class="n">${parse(x).getDate()}</span></button>`;
    }
    const items = [];
    S.holidays.filter(hd => hd.date >= a && hd.date <= b).forEach(hd => { const i = Math.round((parse(hd.date)-parse(a))/864e5); items.push({ hol: hd, a: i, b: i }); });
    S.jobs.filter(j => j.status !== 'cancelled' && j.end_date >= a && j.start_date <= b && applyFilter(j))
      .forEach(j => { const s = segOf(j, a); if (s) items.push(Object.assign({ j }, s)); });
    lanes(items);
    const hidden = Array(7).fill(0);
    items.forEach(it => {
      if (it.lane > 2){ for (let i = it.a; i <= it.b; i++) hidden[i]++; return; }
      const pos = `grid-column:${it.a+1}/${it.b+2};grid-row:${it.lane+2}`;
      if (it.hol) { h += `<button class="mbar hol" style="${pos}" onclick="pickDay('${it.hol.date}')"><span>🎌 ${esc(it.hol.name)}</span></button>`; return; }
      const cont = it.j.start_date < a, goes = it.j.end_date > b && it.b === 6;
      h += `<button class="mbar ${it.j.status==='done'?'isdone':''} ${cont?'cont':''} ${goes?'goes':''}" style="${pos};background:${pc(it.j)}" onclick="openDetail('${it.j.job_id}')"><span>${esc(it.j.customer)}</span></button>`;
    });
    hidden.forEach((n,i) => { if (n) h += `<div class="mmore" style="grid-column:${i+1}">+${n}</div>`; });
    h += '</div>';
  }
  h += '</div>';
  // โปรเจกต์ในเดือนนี้
  const groups = {};
  S.jobs.filter(j => j.status !== 'cancelled' && j.end_date >= first && j.start_date <= last && applyFilter(j)).forEach(j => {
    const k = projKey(j.customer);
    const g = groups[k] = groups[k] || { name: j.customer, s: j.start_date, e: j.end_date, n: 0, ppl: new Set(), col: pc(j), first: j.job_id };
    if (j.start_date < g.s) g.s = j.start_date; if (j.end_date > g.e) g.e = j.end_date; g.n++; asgIds(j).forEach(p => g.ppl.add(p));
  });
  const gl = Object.values(groups).sort((x,y) => x.s.localeCompare(y.s));
  if (gl.length) h += `<div class="plist"><h4>${T('projects')} (${gl.length})</h4>` + gl.map(g =>
    `<button class="pitem" onclick="openDetail('${g.first}')"><i style="background:${g.col}"></i><div class="pt"><b>${esc(g.name)}</b><span>${shortD(g.s)} – ${shortD(g.e)}</span></div>
     <div class="cnt">${g.n} ${T('jobsN')} · ${g.ppl.size} ${T('people')}</div></button>`).join('') + '</div>';
  return h;
}

function togW(b, id){ const i = FA.indexOf(id); if (i < 0) FA.push(id); else FA.splice(i,1); b.classList.toggle('on'); }
function attThumbs(){ return jobAtt.map((u,i)=>`<span>${/^data:image|uc\?export|drive\.google\.com\/thumbnail|\.(jpe?g|png|webp)/i.test(u)?`<img src="${esc(u)}" alt="">`:'📎'}<a href="#" onclick="jobAtt.splice(${i},1);document.getElementById('f_thumbs').innerHTML=attThumbs();return false;">✕</a></span>`).join(''); }
async function addAttachments(inp){
  for (const f of inp.files){
    try{
      const data = f.type.startsWith('image/') ? await shrink(f) : await toB64(f);
      const r = await call('uploadFile', { name:f.name, data, mime: f.type.startsWith('image/')?'image/jpeg':f.type });
      jobAtt.push(r.url);
    }catch(e){ alert(e.message); }
  }
  inp.value=''; const el = document.getElementById('f_thumbs'); if (el) el.innerHTML = attThumbs();

function useLocation(){
  if (!navigator.geolocation) return alert('no geolocation');
  navigator.geolocation.getCurrentPosition(p => {
    const la = p.coords.latitude.toFixed(6), ln = p.coords.longitude.toFixed(6);
    document.getElementById('f_lat').value = la; document.getElementById('f_lng').value = ln;
    document.getElementById('f_map').value = `https://maps.google.com/?q=${la},${ln}`;
    toast('📍 OK');
  }, e => alert(e.message), { enableHighAccuracy:true, timeout:10000 });
}
function syncDates(v){ if(!v) return; document.getElementById('f_end').value = v; document.getElementById('f_due').value = v; }
// ทีมของงาน = ทีมที่ช่างที่เลือกส่วนใหญ่สังกัด (ไม่เลือกช่าง = คงค่าเดิม)
function teamOf(ids, fallback){
  const cnt = {}; ids.forEach(id => { const w = worker(id); if (w && w.team) cnt[w.team] = (cnt[w.team]||0) + 1; });
  const best = Object.keys(cnt).sort((a,b) => cnt[b] - cnt[a])[0];
  return best || fallback || '';
}
async function saveJob(){
  const g = id => document.getElementById(id);
  const job = { job_id:g('f_id').value, job_type:FTYPE, customer:g('f_customer').value.trim(), start_date:g('f_start').value, end_date:g('f_end').value||g('f_start').value,
    start_time:g('f_time').value, due_date:g('f_due').value, assignees:FA.slice(), team:teamOf(FA, g('f_team').value),
    address:g('f_addr').value.trim(), map_url:g('f_map').value.trim(), lat:g('f_lat').value, lng:g('f_lng').value, detail:g('f_detail').value.trim(),
    status: g('f_status') ? g('f_status').value : 'planned', attachments: jobAtt };
  if (!job.customer || !job.start_date) return toast(T('needCust'));
  if (job.end_date < job.start_date) job.end_date = job.start_date;
  // optimistic: แสดงผลในเครื่องทันที ปิดฟอร์ม แล้วค่อยส่งขึ้นเซิร์ฟเวอร์เบื้องหลัง (ล้มเหลว → ย้อนกลับ + แจ้ง)
  const isNew = !job.job_id;
  const prev = isNew ? null : Object.assign({}, S.jobs.find(x => x.job_id === job.job_id) || {});
  const local = Object.assign({}, prev || {}, job, { job_id: job.job_id || ('tmp' + Date.now()), assignees: job.assignees.join(','), attachments: jobAtt.join('|'), _pending: true });
  upsertLocal(S.jobs, 'job_id', local); closeModal();
  if (isNew) { S.cursor = job.start_date; if (S.view === 'menu') S.view = 'day'; }
  render(); toast(T('saving'));
  try{
    const r = await call('saveJob', { job, isNew });
    S.jobs = S.jobs.filter(x => x.job_id !== local.job_id); upsertLocal(S.jobs, 'job_id', r.job); noteVersion(r); saveCache(); render(); toast(T('saved'));
  }catch(e){
    S.jobs = S.jobs.filter(x => x.job_id !== local.job_id); if (prev && prev.job_id) upsertLocal(S.jobs, 'job_id', prev); render(); alert(e.message);
  }
}
function delJob(id){
  const j = S.jobs.find(x => x.job_id === id); if (!j) return;
  askConfirm(T('confirmDel'), j.customer, '🗑 ' + T('del2'), async () => {
    const prev = j; S.jobs = S.jobs.filter(x => x.job_id !== id); render();
    try{ const r = await call('deleteJob',{jobId:id}); noteVersion(r); saveCache(); toast(T('saved')); }
    catch(e){ upsertLocal(S.jobs, 'job_id', prev); render(); alert(e.message); }
  });
}
async function setStatus(id, st, extra){
  const j = S.jobs.find(x => x.job_id === id); if (!j) return;
  const prev = Object.assign({}, j);
  closeModal();   // กดจาก popup รายละเอียด → ปิดให้เลย ตารางด้านหลังอัปเดตทันที
  j.status = st; j._pending = true;
  if (extra && extra.note) j.note = extra.note;
  if (extra && extra.photos && extra.photos.length) j.done_photos = [j.done_photos, extra.photos.map(p => p.data).join('|')].filter(Boolean).join('|');   // โชว์รูปจากเครื่องไปก่อน
  render(); toast(T('saving'));
  try{ const r = await call('setStatus', Object.assign({ jobId:id, status:st }, extra || {})); upsertLocal(S.jobs, 'job_id', r.job); noteVersion(r); saveCache(); render(); toast(T('saved')); }
  catch(e){ Object.assign(j, prev); delete j._pending; render(); alert(e.message); }
}

function openLeave(){
  LVTYPE = I18N.th.lvTypes[0];
  openModal(`<div class="dbody f"><div class="dtitle">🏖 ${T('addLeave')}</div>
    <label>${T('worker')}</label><select id="lv_w">${S.workers.map(w=>`<option value="${w.worker_id}">${esc(wName(w))}</option>`).join('')}</select>
    <div class="g2"><div><label>${T('dateFrom')}</label><input type="date" id="lv_from" value="${esc(S.cursor)}" onchange="document.getElementById('lv_to').value=this.value"></div><div><label>${T('dateTo')}</label><input type="date" id="lv_to" value="${esc(S.cursor)}"></div></div>
    <label>${T('leaveType')}</label><div class="tchips" id="lv_types">${T('lvTypes').map((t,i)=>`<button type="button" class="tchip ${i?'':'on'}" onclick="LVTYPE='${esc(I18N.th.lvTypes[i])}';document.querySelectorAll('#lv_types .tchip').forEach(b=>b.classList.toggle('on',b===this))">${esc(t)}</button>`).join('')}</div>
    <label>${T('note')}</label><input id="lv_note">
    <div class="dacts two" style="margin-top:16px"><button class="btn ghost" onclick="closeModal()">${T('cancel')}</button><button class="btn primary" onclick="saveLeave()">${T('save')}</button></div></div>`);
}
async function saveLeave(){
  const g = id => document.getElementById(id).value;
  const leave = { leave_id:'tmp'+Date.now(), worker_id:g('lv_w'), date_from:g('lv_from'), date_to:g('lv_to')||g('lv_from'), type:LVTYPE, note:g('lv_note') };
  if (!leave.date_from) return;
  if (leave.date_to < leave.date_from) leave.date_to = leave.date_from;
  const clash = S.jobs.filter(j => asgIds(j).includes(leave.worker_id) && j.end_date >= leave.date_from && j.start_date <= leave.date_to && !['done','cancelled'].includes(j.status));
  S.leaves.push(leave); closeModal(); render(); toast(T('saving'));
  try{ const r = await call('saveLeave',{ leave:{ worker_id:leave.worker_id, date_from:leave.date_from, date_to:leave.date_to, type:leave.type, note:leave.note } });
    S.leaves = S.leaves.filter(l => l.leave_id !== leave.leave_id); upsertLocal(S.leaves, 'leave_id', r.leave); noteVersion(r); saveCache(); render();
    toast(clash.length ? `⚠ ${T('clashWarn')} ${clash.length} ${T('jobsN')}` : T('leaveSaved')); }
  catch(e){ S.leaves = S.leaves.filter(l => l.leave_id !== leave.leave_id); render(); alert(e.message); }
}
function delLeave(id){
  const l = S.leaves.find(x => x.leave_id === id); if (!l) return;
  const w = worker(l.worker_id);
  askConfirm(T('delLeaveQ'), `${w ? wName(w) : ''} · ${shortD(l.date_from)}${l.date_to !== l.date_from ? ' – ' + shortD(l.date_to) : ''}`, T('del'), async () => {
    S.leaves = S.leaves.filter(x => x.leave_id !== id); render();
    try{ const r = await call('deleteLeave',{leaveId:id}); noteVersion(r); saveCache(); }
    catch(e){ S.leaves.push(l); render(); alert(e.message); }
  });
}

/* ---- วันหยุดบริษัท ---- */
function openHoliday(date){
  const d0 = date || S.cursor, cur = S.holidays.find(h=>h.date===d0);
  openModal(`<div class="dbody f"><div class="dtitle">🎌 ${T('addHoliday')}</div>
    <label>${T('date')}</label><input type="date" id="h_date" value="${esc(d0)}">
    <label>${T('holidayName')}</label><input id="h_name" value="${esc(cur?cur.name:'')}">
    <div class="dacts ${cur?'':'two'}" style="margin-top:16px;${cur?'grid-template-columns:1fr 1fr 1fr':''}"><button class="btn ghost" onclick="closeModal()">${T('cancel')}</button>${cur?`<button class="btn danger" onclick="delHoliday()">${T('del')}</button>`:''}<button class="btn primary" onclick="saveHoliday()">${T('save')}</button></div></div>`);
}
async function saveHoliday(){
  const date = document.getElementById('h_date').value, name = document.getElementById('h_name').value.trim(); if (!date || !name) return;
  const prev = S.holidays.slice(); upsertLocal(S.holidays, 'date', { date, name }); closeModal(); render(); toast(T('saving'));
  try{ const r = await call('saveHoliday',{ date, name }); noteVersion(r); saveCache(); toast(T('saved')); }
  catch(e){ S.holidays = prev; render(); alert(e.message); }
}
async function delHoliday(){
  const date = document.getElementById('h_date').value;
  const prev = S.holidays.slice(); S.holidays = S.holidays.filter(h => h.date !== date); closeModal(); render();
  try{ const r = await call('deleteHoliday',{ date }); noteVersion(r); saveCache(); }
  catch(e){ S.holidays = prev; render(); alert(e.message); }
}

/* ---- ช่าง ---- */
function openWorker(){
  openModal(`<div class="dbody f"><div class="dtitle">👷 ${T('manageWorkers')}</div>
    <label>${T('worker')}</label><select id="w_sel" onchange="fillWorker()"><option value="">+ ${T('newWorker')}</option>${S.workers.map(w=>`<option value="${w.worker_id}">${esc(w.name_th)}</option>`).join('')}</select>
    <div class="g2"><div><label>${T('nameTh')}</label><input id="w_th"></div><div><label>${T('nameMm')}</label><input id="w_mm"></div></div>
    <div class="g2"><div><label>${T('team')}</label><input id="w_team" list="teams"><datalist id="teams">${[...new Set(S.workers.map(w=>w.team).filter(Boolean))].map(t=>`<option value="${esc(t)}">`).join('')}</datalist></div>
      <div><label>${T('role')}</label><select id="w_role"><option value="worker">worker</option><option value="lead">lead</option></select></div></div>
    <label class="cbline"><input type="checkbox" id="w_active" checked> ${T('active')}</label>
    <div class="dacts two" style="margin-top:16px"><button class="btn ghost" onclick="closeModal()">${T('cancel')}</button><button class="btn primary" onclick="saveWorker()">${T('save')}</button></div></div>`);
}
function fillWorker(){
  const w = worker(document.getElementById('w_sel').value) || {};
  document.getElementById('w_th').value = w.name_th||''; document.getElementById('w_mm').value = w.name_mm||'';
  document.getElementById('w_team').value = w.team||''; document.getElementById('w_role').value = w.role||'worker'; document.getElementById('w_active').checked = w.active!=='FALSE';
}
async function saveWorker(){
  const g = id => document.getElementById(id);
  const id = g('w_sel').value; const old = worker(id) || {};
  const w = { worker_id:id, name_th:g('w_th').value.trim(), name_mm:g('w_mm').value.trim(), team:g('w_team').value.trim(), role:g('w_role').value, line_user_id: old.line_user_id||'', active: g('w_active').checked };
  if (!w.name_th) return;
  try{ const r = await call('saveWorker',{worker:w}); S.workers = r.workers; noteVersion(r); saveCache(); closeModal(); render(); toast(T('saved')); }catch(e){ alert(e.message); }
}

  openModal(`<div class="dbody"><div class="dtitle">📄 ${T('export')}</div><p class="dsub">${T('week_of')} ${fmt(ws)} – ${fmt(addDays(ws,6))}</p><div id="ex_body" class="hint" style="text-align:center;padding:14px 0">⏳ ${T('exporting')}</div>
    <div class="dacts"><button class="btn ghost" onclick="closeModal()">${T('close')}</button></div></div>`);

    document.getElementById('ex_body').innerHTML = `<div class="dacts"><a class="btn primary" href="${esc(r.pdfUrl)}" target="_blank" rel="noopener">📄 ${T('openPdf')}</a><a class="btn finish" href="${esc(r.xlsxUrl)}" target="_blank" rel="noopener">📊 ${T('openXlsx')}</a><a class="btn ghost" href="${esc(r.sheetUrl)}" target="_blank" rel="noopener">${T('openSheet')}</a></div>`;

}

/* ================== บอร์ดแคสต์เข้ากลุ่ม (แอดมิน) ================== */
// ลงงาน/แก้งานไม่ส่ง LINE อัตโนมัติ — แอดมินเลือกร่างข้อความ แก้ได้ แล้วกดส่งเข้ากลุ่มเอง
const BC_KINDS = [['today','bcToday'],['tomorrow','bcTomorrow'],['week','bcWeek'],['nextweek','bcNextWeek'],['custom','bcCustom']];
let bcSeq = 0;
function openBroadcast(){
  openModal(`<div class="dbody f"><div class="dtitle">${T('broadcast')}</div>
    <div class="tchips" id="bc_kinds">${BC_KINDS.map(([k,l])=>`<button type="button" class="tchip" data-k="${k}" onclick="bcPick('${k}')">${T(l)}</button>`).join('')}</div>
    <textarea id="bc_text" class="bctext" style="margin-top:10px"></textarea>
    <div class="hint">${T('bcHint')}</div>
    <div class="dacts two" style="margin-top:14px"><button class="btn ghost" onclick="closeModal()">${T('cancel')}</button><button class="btn primary" id="bc_send" onclick="sendBroadcast()">${T('bcSend')}</button></div></div>`);
  bcPick('today');
}
async function bcPick(kind){
  document.querySelectorAll('#bc_kinds .tchip').forEach(b => b.classList.toggle('on', b.dataset.k === kind));
  const ta = document.getElementById('bc_text'); ta.dataset.kind = kind;
  if (kind === 'custom') { ta.value = ''; ta.placeholder = ''; ta.focus(); return; }
  const seq = ++bcSeq; ta.value = ''; ta.placeholder = T('loading');
  try{ const r = await call('broadcastPreview',{ kind }); if (seq === bcSeq && document.getElementById('bc_text')) { ta.value = r.text; ta.placeholder = ''; } }
  catch(e){ if (seq === bcSeq) ta.placeholder = e.message; }
}
async function sendBroadcast(){
  const ta = document.getElementById('bc_text'), btn = document.getElementById('bc_send');
  const text = ta.value.trim(); if (!text) return;
  if (!btn.dataset.sure){ btn.dataset.sure = '1'; btn.textContent = T('confirm') + ' — ' + T('bcSend').replace(/^📢\s*/,''); btn.classList.add('red'); return; }   // กดซ้ำเพื่อยืนยัน
  btn.disabled = true; btn.textContent = T('bcSending');
  try{ await call('broadcast',{ text, kind: ta.dataset.kind }); closeModal(); toast(T('bcSent')); }
  catch(e){ btn.disabled = false; delete btn.dataset.sure; btn.classList.remove('red'); btn.textContent = T('bcSend'); alert(e.message); }
}

/* ================== image helpers ================== */
function toB64(file){ return new Promise((res,rej)=>{ const r = new FileReader(); r.onload = ()=>res(r.result); r.onerror = rej; r.readAsDataURL(file); }); }
function shrink(file, max=1280, q=0.75){
  return new Promise((res,rej)=>{
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => { const s = Math.min(1, max/Math.max(img.width,img.height)); const c = document.createElement('canvas');
      c.width = Math.round(img.width*s); c.height = Math.round(img.height*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q)); };
    img.onerror = rej; img.src = url;
  });
}
boot();

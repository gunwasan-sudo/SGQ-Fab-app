<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>SGQ ตารางงานทีมช่าง</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&family=Noto+Sans+Myanmar:wght@400;700&display=swap" rel="stylesheet">
<script src="https://static.line-scdn.net/liff/edge/versions/2.22.3/sdk.js"></script>
<style>
  :root{--bg:#f3f4f6;--card:#fff;--line:#e5e7eb;--text:#111827;--muted:#6b7280;--brand:#0f4c81;--brand2:#1e6fb5;
    --planned:#6b7280;--in_progress:#d97706;--done:#16a34a;--postponed:#7c3aed;--cancelled:#dc2626;
    --t-วัดหน้างาน:#0284c7;--t-ตัดประกอบ:#7c3aed;--t-ติดตั้ง:#16a34a;--t-แก้งาน:#d97706;--t-ส่งมอบ:#0f766e;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:"Noto Sans Thai","Noto Sans Myanmar",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:17px;padding-bottom:90px}
  header{background:var(--brand);color:#fff;padding:10px 12px 0;position:sticky;top:0;z-index:20}
  .top{display:flex;align-items:center;gap:8px}
  .top h1{font-size:18px;margin:0;flex:1;font-weight:700}
  .top .who{font-size:13px;opacity:.9;text-align:right;line-height:1.2}
  .lang{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:16px;padding:3px 10px;font-size:13px}
  .tabs{display:flex;gap:8px;margin-top:10px;padding-bottom:10px}
  .tabs button{flex:1;border:1px solid rgba(255,255,255,.35);border-radius:10px;background:linear-gradient(#2a6aa8,#1a5590);color:#fff;padding:8px 0;font-size:16px;font-weight:600;font-family:inherit;box-shadow:0 3px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .08s}
  .tabs button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
  .tabs button.on{background:linear-gradient(#ffffff,#e8eef5);color:var(--brand);border-color:#fff;box-shadow:0 4px 8px rgba(0,0,0,.35),inset 0 1px 0 #fff;transform:translateY(-1px)}
  .nav{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:86px;z-index:19}
  .nav button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;font-size:16px;font-family:inherit}
  .nav .lbl{flex:1;text-align:center;font-weight:700;font-size:17px}
  .chips{display:flex;gap:6px;padding:8px 12px;overflow-x:auto}
  .chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:4px 12px;font-size:15px;white-space:nowrap;font-family:inherit}
  .chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  main{padding:0 12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .card.done{opacity:.72}
  .row{display:flex;align-items:center;gap:8px}
  .badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:13px;color:#fff;font-weight:500}
  .st{display:inline-block;padding:2px 8px;border-radius:12px;font-size:13px;color:#fff}
  .title{font-weight:700;font-size:18px;margin:4px 0}
  .meta{color:var(--muted);font-size:15px;line-height:1.5}
  .meta a{color:var(--brand2)}
  .ppl{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
  .ppl span{background:#eef2ff;color:#3730a3;border-radius:6px;padding:2px 8px;font-size:13px}
  .ppl span.ci{background:#dcfce7;color:#166534}
  .ppl span.nci{background:#fee2e2;color:#991b1b}
  .ppl span.me{outline:2px solid #3730a3}
  .acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .btn{border:none;border-radius:8px;padding:8px 14px;font-size:16px;font-family:inherit;background:#e5e7eb;color:#111}
  .btn.p{background:var(--brand);color:#fff}.btn.g{background:var(--done);color:#fff}.btn.w{background:var(--in_progress);color:#fff}.btn.d{background:var(--cancelled);color:#fff}
  .btn.sm{padding:5px 10px;font-size:15px}
  .empty{text-align:center;color:var(--muted);padding:30px 0}
  .banner{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:16px}
  .leaveline{background:#f1f5f9;border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:15px;color:#334155}
  /* week */
  .wk{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:12px}
  table.wk-t{border-collapse:collapse;min-width:780px;width:100%}
  .wk-t th,.wk-t td{border:1px solid var(--line);vertical-align:top;padding:4px;font-size:13px}
  .wk-t th{background:#f8fafc;font-weight:600;position:sticky;top:0}
  .wk-t th.today,.wk-t td.today{background:#eff6ff}
  .wk-t th.hol,.wk-t td.hol{background:#fff1f2}
  .wk-t td:first-child,.wk-t th:first-child{position:sticky;left:0;background:#f8fafc;font-weight:600;min-width:80px;z-index:1}
  .cell-chip{display:block;border-radius:5px;padding:2px 5px;margin-bottom:3px;color:#fff;font-size:12px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px}
  .cell-chip.lv{background:#94a3b8}
  .cell-chip.done{opacity:.55;text-decoration:line-through}
  /* month */
  .mo{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .mo .h{background:#f8fafc;text-align:center;font-size:13px;padding:6px 0;font-weight:600}
  .mo .d{background:#fff;min-height:82px;min-width:0;overflow:hidden;padding:3px;font-size:12px}
  .mo .d.out{background:#f9fafb;color:#9ca3af}
  .mo .d.today .n{background:var(--brand);color:#fff;border-radius:10px}
  .mo .d.hol{background:#fff1f2}
  .mo .n{display:inline-block;padding:0 5px;font-weight:600;font-size:13px}
  .mo .dot{display:block;cursor:pointer;border-radius:3px;padding:1px 3px;margin-top:2px;color:#fff;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mo .more{color:var(--muted);font-size:11px}
  .mo .lvn{font-size:11px;color:#64748b}
  /* fab */
  .fab{position:fixed;right:16px;bottom:20px;z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  .fab .main{width:56px;height:56px;border-radius:50%;background:var(--brand);color:#fff;font-size:30px;border:none;box-shadow:0 4px 12px rgba(0,0,0,.25)}
  .fab .mini{background:#fff;border:1px solid var(--line);border-radius:20px;padding:8px 14px;font-size:15px;font-family:inherit;box-shadow:0 2px 6px rgba(0,0,0,.12);display:none}
  .fab.open .mini{display:block}
  .fab.noadmin .adm{display:none!important}
  /* modal */
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none;align-items:center;justify-content:center;padding:16px}
  .ov.on{display:flex}
  .sheet{background:#fff;width:min(92vw,440px);max-height:85vh;overflow-y:auto;border-radius:16px;padding:14px 14px 18px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
  .sheet h3{margin:0 0 10px;font-size:19px}
  label{display:block;font-size:15px;color:var(--muted);margin:10px 0 3px}
  input,select,textarea{width:100%;min-width:0;max-width:100%;border:1px solid #d1d5db;border-radius:8px;padding:9px 10px;font-size:17px;font-family:inherit;background:#fff}
  textarea{min-height:70px}
  .g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
  .cbs{display:flex;flex-wrap:wrap;gap:6px}
  .cbs label{display:flex;align-items:center;gap:5px;margin:0;border:1px solid var(--line);border-radius:16px;padding:5px 10px;color:var(--text);font-size:16px}
  .cbs input{width:auto}
  .thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
  .thumbs a{font-size:13px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#111;color:#fff;padding:8px 16px;border-radius:20px;font-size:15px;z-index:60;display:none}
  .live{display:inline-block;width:8px;height:8px;border-radius:50%;background:#22c55e;margin-left:4px}
  .live.off{background:#f59e0b}
  /* แถบบาง ๆ บนสุด = กำลังคุยกับเซิร์ฟเวอร์ (แทนการค้างเงียบ ๆ) */
  .netbar{position:fixed;left:0;right:0;top:0;height:3px;z-index:200;display:none;background:linear-gradient(90deg,#93c5fd,#1e6fb5,#93c5fd);background-size:200% 100%}
  .netbar.on{display:block;animation:nb 1.1s linear infinite}
  @keyframes nb{from{background-position:0 0}to{background-position:200% 0}}
  .pend{font-size:14px;color:#b45309;background:#fef3c7;border-radius:8px;padding:4px 10px}
  .wk,.chips,.sheet{-webkit-overflow-scrolling:touch}
  #loader{position:fixed;inset:0;background:#fff;z-index:100;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--muted)}
</style>
</head>
<body>
<div class="netbar" id="netbar"></div>
<div id="loader"><div style="font-size:28px">🗓</div><div id="loaderTxt">กำลังโหลด...</div></div>

<header>
  <div class="top">
    <h1><span id="coName">SGQ</span> <span style="font-weight:400;font-size:13px" data-i="appTitle">ตารางงานทีมช่าง</span><span class="live" id="live"></span></h1>
    <div class="who" id="who"></div>
    <button class="lang" id="langBtn" onclick="toggleLang()">မြန်မာ</button>
  </div>
  <div class="tabs">
    <button data-v="day" class="on" onclick="setView('day')" data-i="day">วัน</button>
    <button data-v="week" onclick="setView('week')" data-i="week">สัปดาห์</button>
    <button data-v="month" onclick="setView('month')" data-i="month">เดือน</button>
  </div>
</header>
<div class="nav">
  <button onclick="nav(-1)">‹</button>
  <div class="lbl" id="navLbl"></div>
  <button onclick="nav(1)">›</button>
  <button onclick="goToday()" data-i="today">วันนี้</button>
</div>
<div class="chips" id="chips"></div>
<main id="main"></main>

<div class="fab" id="fab">
  <button class="mini" onclick="openExport()" data-i="export">ส่งออกสัปดาห์นี้ (PDF/Excel)</button>
  <button class="mini adm" id="fabLeave" onclick="openLeave()" data-i="addLeave">ลงวันลา/หยุด</button>
  <button class="mini adm" id="fabHol" onclick="openHoliday()" data-i="addHoliday">วันหยุดบริษัท</button>
  <button class="mini adm" id="fabWorker" onclick="openWorker()" data-i="manageWorkers">เพิ่ม/แก้ช่าง</button>
  <button class="mini adm" id="fabCast" onclick="openBroadcast()" data-i="broadcast">📢 บอร์ดแคสต์เข้ากลุ่ม</button>
  <button class="mini adm" id="fabJob" onclick="openJob()" data-i="addJob">+ ลงงาน</button>
  <button class="main" onclick="document.getElementById('fab').classList.toggle('open')">＋</button>
</div>

<div class="ov" id="ov" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const dow = s => parse(s).getDay();
const WEEKLY_OFF = [0];                                          // 0 = อาทิตย์ (บริษัททำงาน จ.–ส.)
const WEEK_ORDER = [1,2,3,4,5,6,0];                              // จ. อ. พ. พฤ. ศ. ส. อา.
const weekStart = s => addDays(s, -((dow(s)+6)%7));             // เริ่มวันจันทร์

function call(action, payload){
  payload = Object.assign({ userId: S.userId, displayName: S.displayName }, payload || {});
  // เปิดจาก GitHub Pages (ไม่มี google.script.run) → ยิง fetch ไป /exec ; ใน demo.html / Apps Script ใช้ google.script.run ตามเดิม
  if (typeof google === 'undefined' || !google.script || !google.script.run) return callFetch(action, payload);
  return new Promise((res, rej) => {
    var done = false;
    var timer = setTimeout(function(){
      if (done) return; done = true;
      rej(new Error('เรียก "' + action + '" ไม่ตอบกลับภายใน 30 วินาที'));
    }, 30000);
    google.script.run
      .withSuccessHandler(function(r){
        if (done) return; done = true; clearTimeout(timer);
        try { const o = JSON.parse(r); o.ok ? res(o) : rej(new Error(o.error)); }
        catch(err){ rej(new Error('อ่านผลลัพธ์ไม่ได้: ' + String(r).substring(0,150))); }
      })
      .withFailureHandler(function(e){
        if (done) return; done = true; clearTimeout(timer);
        rej(e instanceof Error ? e : new Error(String((e && e.message) || e)));
      })
      .api(action, payload);
  });
}
// การเขียน (ต้องตรงกับ WRITE_ACTIONS ใน Code.gs) — backend กันเขียนซ้ำด้วย reqId จึงยิงซ้ำ/คู่ขนานได้อย่างปลอดภัย
const WRITE_ACTIONS = ['register','saveJob','deleteJob','setStatus','uploadFile','saveLeave','deleteLeave','saveHoliday','deleteHoliday','saveWorker','broadcast'];
let netBusy = 0, writesInFlight = 0;
function netStart(isWrite){ netBusy++; if (isWrite) writesInFlight++; document.getElementById('netbar').classList.add('on'); }
function netEnd(isWrite){ netBusy = Math.max(0, netBusy-1); if (isWrite) writesInFlight = Math.max(0, writesInFlight-1); if (!netBusy) document.getElementById('netbar').classList.remove('on'); }

// ยิง 1 ครั้ง → JSON (โยน error ถ้าไม่ใช่ JSON เช่น หน้า 'ไม่พบเพจ' ของ Google)
function fetchApi(body, timeout){
  const ac = new AbortController(); const timer = setTimeout(() => ac.abort(), timeout);
  return fetch(API_URL, { method:'POST', redirect:'follow', signal: ac.signal,
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body })   // text/plain = ไม่มี CORS preflight
    .then(r => r.text())
    .then(txt => { try { return JSON.parse(txt); } catch(e) { throw new Error('อ่านผลลัพธ์ไม่ได้: ' + String(txt).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').substring(0,120)); } })
    .catch(e => { throw e.name === 'AbortError' ? new Error('เซิร์ฟเวอร์ไม่ตอบกลับภายใน ' + Math.round(timeout/1000) + ' วินาที') : e; })
    .finally(() => clearTimeout(timer));
}
// ยิงแบบ "hedged": Apps Script ตอบผ่าน redirect ไป script.googleusercontent.com ซึ่งวัดจริงล้ม ~1 ใน 3 ครั้ง
// และแต่ละครั้งค้าง ~10 วิ ก่อนคืน 404 — ถ้ารอให้ล้มก่อนค่อยยิงซ้ำ แอปจะค้างเป็นสิบวิ
// → ถ้าคำขอแรกยังไม่ตอบภายใน hedge ms ให้ยิงคำขอเดิม (reqId เดิม) คู่ขนานเพิ่ม เอาคำตอบแรกที่มา ตัวที่เหลือทิ้ง
let netSlow = false;   // ครั้งล่าสุดช้า/ล้ม → ครั้งถัดไปยิง 2 คำขอพร้อมกันตั้งแต่แรก (Google ช้าเป็นช่วง ๆ ไม่ใช่ทีละคำขอ)
function hedgedFetch(body, { hedge, timeout, maxAttempts, burst }){
  return new Promise((resolve, reject) => {
    let attempts = 0, inflight = 0, settled = false, lastErr = null, hedgeTimer = null;
    const t0 = Date.now();
    const fire = () => {
      if (settled || attempts >= maxAttempts) return;
      attempts++; inflight++;
      fetchApi(body, timeout)
        .then(o => { if (settled) return; settled = true; clearInterval(hedgeTimer); netSlow = (Date.now() - t0) > 6000; resolve(o); })
        .catch(e => { lastErr = e; })
        .finally(() => {
          inflight--;
          if (settled) return;
          if (attempts < maxAttempts) setTimeout(fire, 300);                          // ล้ม → ยิงใหม่ทันที
          else if (inflight === 0) { clearInterval(hedgeTimer); netSlow = true; reject(lastErr || new Error('เชื่อมต่อไม่ได้')); }
        });
    };
    fire();
    if (burst && netSlow) setTimeout(fire, 150);
    hedgeTimer = setInterval(fire, hedge);
  });
}
async function callFetch(action, payload){
  const isWrite = WRITE_ACTIONS.includes(action);
  const heavy = action === 'uploadFile' || action === 'exportWeek' || (payload.photos && payload.photos.length);   // ข้อมูลใหญ่/งานหนัก ไม่รีบยิงซ้ำ
  const reqId = Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  const body = JSON.stringify({ action, payload, idToken: S.idToken, reqId });
  netStart(isWrite);
  let o;
  try { o = await hedgedFetch(body, { hedge: heavy ? 20000 : isWrite ? 8000 : 3500, timeout: heavy ? 90000 : isWrite ? 60000 : 20000, maxAttempts: heavy ? 2 : 4, burst: !heavy }); }
  finally { netEnd(isWrite); }
  if (o.ok) return o;
  if (o.code === 'token' && LIFF_ID && typeof liff !== 'undefined') {   // token หมดอายุ → ล็อกอินใหม่
    try { liff.logout(); } catch(e) {}
    liff.login(); await new Promise(() => {});
  }
  throw new Error(o.error);
}

      if (!liff.isLoggedIn()) { step('กำลังพาไปล็อกอิน LINE...'); liff.login(); return; }

    S.today = S.cursor = ymd(new Date());

    if (cached) { applyState(cached); S.today = S.cursor = ymd(new Date()); render(); document.getElementById('loader').style.display = 'none'; toast(T('refreshing')); }
    // init รอบเดียวพร้อมข้อมูลช่วงกว้าง (ย้อน 5 สัปดาห์ / ล่วงหน้า 10 สัปดาห์) → เลื่อน วัน/สัปดาห์/เดือน ได้ทันทีไม่ต้องรอเซิร์ฟเวอร์
    const [a0, b0] = viewRange(); const f0 = addDays(a0, -RANGE_BACK), t0 = addDays(b0, RANGE_FWD);
    let r;

    catch(e) { if (!cached) throw e; toast(T('refreshFail') + ' ' + (e.message || e)); r = null; }
    if (r) {
      applyState({ user:r.user, isAdmin:r.isAdmin, workers:r.workers, jobTypes:r.jobTypes, statuses:r.statuses, today:r.today, checkinEnabled:r.checkinEnabled, version:r.version, companyName:r.companyName,
        jobs:r.jobs, leaves:r.leaves, holidays:r.holidays, checkins:r.checkins, loaded: r.jobs ? { from:f0, to:t0 } : { from:null, to:null } });
      if (!cached) S.cursor = S.today;
      if (!r.jobs) { step('4/4 โหลดตารางงาน...'); await loadRange(true); }   // backend/mock รุ่นเก่าไม่คืนข้อมูลใน init

const RANGE_BACK = 35, RANGE_FWD = 70;   // โหลดกว้างกว่าที่ดู จะได้เลื่อนดูได้โดยไม่ต้องรอเซิร์ฟเวอร์
function viewRange(){
  const c = S.cursor;
  if (S.view === 'day') return [c, c];
  if (S.view === 'week') { const ws = weekStart(c); return [ws, addDays(ws, 6)]; }
  const d = parse(c); const first = ymd(new Date(d.getFullYear(), d.getMonth(), 1));
  const gridStart = weekStart(first); return [gridStart, addDays(gridStart, 41)];
}
let rangeReq = null;   // คำขอ getData ที่ค้างอยู่ (กันยิงซ้ำเมื่อกดเลื่อนรัว ๆ)
function loadRange(force){
  const [a,b] = viewRange();
  const from = addDays(a,-7), to = addDays(b,7);
  const covered = S.loaded.from && S.loaded.from <= from && S.loaded.to >= to;
  if (!force && covered) { render(); return Promise.resolve(); }
  if (!force && rangeReq && rangeReq.from <= from && rangeReq.to >= to) { render(); return rangeReq.p; }
  // ช่วงที่โหลด = ช่วงเดิม ∪ ช่วงกว้างรอบที่ดู (ถ้าเดิมกว้างเกิน ~1 ปีให้เริ่มนับใหม่ ไม่ให้คำตอบบวมขึ้นเรื่อย ๆ)
  let f = addDays(a,-RANGE_BACK), t = addDays(b,RANGE_FWD);
  if (S.loaded.from && S.loaded.to && addDays(S.loaded.from, 365) > S.loaded.to) { if (S.loaded.from < f) f = S.loaded.from; if (S.loaded.to > t) t = S.loaded.to; }
  if (!covered) render();   // แสดงเท่าที่มีไปก่อน (แถบโหลดด้านบนบอกว่ากำลังดึงข้อมูล)
  const req = { from:f, to:t };
  req.p = (async () => {
    try {
      const r = await call('getData', { from:f, to:t });
      const pend = S.jobs.filter(j => j._pending);   // งานที่กำลังบันทึกอยู่ในเครื่อง ห้ามหายไปกับข้อมูลจากเซิร์ฟเวอร์
      S.jobs = r.jobs.filter(j => !pend.some(p => p.job_id === j.job_id)).concat(pend);
      S.leaves = r.leaves; S.holidays = r.holidays; S.checkins = r.checkins; S.workers = r.workers; S.version = r.version; S.today = r.today;
      S.loaded = { from:f, to:t };
      saveCache();
      return true;
    } catch(e) {
      document.getElementById('live').className = 'live off';
      toast(T('refreshFail') + ' ' + (e.message || e));
      return false;
    } finally { if (rangeReq === req) rangeReq = null; render(); }
  })();
  rangeReq = req;
  return req.p;
}
// ช่วงที่กำลังดูมีข้อมูลครบหรือยัง (ไม่ครบ = กำลังโหลด → โชว์แถบบอกในหน้า)
function viewCovered(){ const [a,b] = viewRange(); return !!(S.loaded.from && S.loaded.from <= a && S.loaded.to >= b); }

/* ================== view / nav ================== */
function setView(v){ S.view = v; document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === v)); loadRange(false); }
function nav(n){
  if (S.view === 'day') S.cursor = addDays(S.cursor, n);
  else if (S.view === 'week') S.cursor = addDays(S.cursor, 7*n);
  else { const d = parse(S.cursor); d.setDate(1); d.setMonth(d.getMonth()+n); S.cursor = ymd(d); }
  loadRange(false);
}
function goToday(){ S.cursor = S.today; loadRange(false); }
function gotoDay(s){ S.cursor = s; setView('day'); }

/* ================== filters ================== */
function jobsOn(dateStr){
  return S.jobs.filter(j => j.start_date <= dateStr && j.end_date >= dateStr).filter(applyFilter)
    .sort((a,b) => (a.start_time||'99').localeCompare(b.start_time||'99'));
}
function applyFilter(j){
  const ids = (j.assignees||'').split(',').map(s=>s.trim());
  if (S.filter === 'me') return S.user ? ids.includes(S.user.worker_id) : true;
  if (S.filter.startsWith('team:')) return j.team === S.filter.slice(5) || ids.some(id => (S.workers.find(w=>w.worker_id===id)||{}).team === S.filter.slice(5));
  return true;
}
function renderChips(){
  const teams = [...new Set(S.workers.map(w => w.team).filter(Boolean))];
  let h = `<button class="chip ${S.filter==='all'?'on':''}" onclick="setFilter('all')">${T('all')}</button>`;
  if (S.user) h += `<button class="chip ${S.filter==='me'?'on':''}" onclick="setFilter('me')">${T('myJobs')}</button>`;
  teams.forEach(t => h += `<button class="chip ${S.filter==='team:'+t?'on':''}" onclick="setFilter('team:${esc(t)}')">${esc(t)}</button>`);
  document.getElementById('chips').innerHTML = h;
}
function setFilter(f){ S.filter = f; render(); }

const worker = id => S.workers.find(w => w.worker_id === id);
const typeColor = t => `var(--t-${t}, #475569)`;
/* ===== สีตามโปรเจกต์: งานโปรเจกต์เดียวกันสีเดียวกันทุกวัน/ทุกมุมมอง, ต่างโปรเจกต์ต่างสี (คละแบบสุ่มแต่คงที่) =====
   ชื่อ "บ้านคุณหมวย" = "คุณหมวย", "หมู่บ้านเอสเคฟ" = "หมู่เอสเคฟ" (ตัดคำนำหน้า/ช่องว่าง/สระซ้ำ)
   เลือกสีจาก hash ของชื่อ ชนกับโปรเจกต์อื่นที่โหลดอยู่ → เลื่อนไปสีถัดไปที่ยังว่าง (ทุกสีอ่านตัวอักษรขาวได้) */
const PROJ_COLORS = ['#2563eb','#dc2626','#15803d','#9333ea','#c2410c','#0e7490','#be185d','#4d7c0f','#a16207','#3730a3',
  '#0f766e','#78350f','#64748b','#1e3a8a','#991b1b','#166534','#6b21a8','#9a3412','#155e75','#86198f'];
function projKey(name){
  const raw = String(name||'').normalize('NFC');
  const k = raw.replace(/\[[^\]]*\]/g,'').replace(/([ั-ฺ็-๎])\1+/g,'$1').replace(/\s+/g,'')
    .replace(/^(?:หมู่บ้าน|หมู่|บ้าน|คุณ|งาน|โครงการ)+/,'');
  return k || raw;
}
function hashStr(s){ let h = 2166136261; for (const ch of s){ h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
let projMap = {}, projSig = '';
function projColor(j){
  const sig = S.jobs.length + ':' + S.version;
  if (sig !== projSig) {
    projSig = sig; projMap = {}; const used = new Set(), N = PROJ_COLORS.length;
    [...new Set(S.jobs.map(x => projKey(x.customer)))]
      .sort((a,b) => hashStr(a) - hashStr(b) || a.localeCompare(b))
      .forEach(k => { let i = hashStr(k) % N; for (let n = 0; n < N && used.has(i); n++) i = (i + 1) % N;
        used.add(i); if (used.size >= N) used.clear(); projMap[k] = PROJ_COLORS[i]; });
  }
  const k = projKey(j.customer);
  return projMap[k] || PROJ_COLORS[hashStr(k) % PROJ_COLORS.length];
}
function checkinState(w){
  // ok=false = ต่อระบบเช็คอินไม่ได้ → ไม่แสดงสัญลักษณ์เลย (ไม่ให้ ⏳ ทุกคนจนเข้าใจผิด)
  if (!S.checkinEnabled || !S.checkins || !S.checkins.ok) return '';
  const ok = (S.checkins.workerIds || []).includes(w.worker_id) ||
    (w.line_user_id && S.checkins.userIds.includes(w.line_user_id)) || S.checkins.names.includes(w.name_th);
  return ok ? 'ci' : 'nci';
}
function peopleHtml(ids, showCheckin){
  return `<div class="ppl">` + ids.split(',').map(s=>s.trim()).filter(Boolean).map(id => {
    const w = worker(id); if (!w) return `<span>${esc(id)}</span>`;
    const cs = showCheckin ? checkinState(w) : '';
    const me = S.user && S.user.worker_id === id ? ' me' : '';
    return `<span class="${cs}${me}" title="${cs==='ci'?T('checkedIn'):cs==='nci'?T('notCheckedIn'):''}">${cs==='ci'?'✅ ':cs==='nci'?'⏳ ':''}${esc(wName(w))}</span>`;
  }).join('') + `</div>`;
}
function renderDay(ds){
  const hol = holidayOf(ds);
  const jobs = jobsOn(ds);
  const leaves = S.leaves.filter(l => l.date_from <= ds && l.date_to >= ds);
  const isToday = ds === S.today;
  let h = '';
  if (hol) h += `<div class="banner">🎌 ${T('holiday')}: ${esc(hol.name)}</div>`;
  if (leaves.length) h += `<div class="leaveline">🏖 ${T('leave')}: ` + leaves.map(l => { const w = worker(l.worker_id); return `${esc(w?wName(w):l.worker_id)} (${esc(l.type)})` + (S.isAdmin ? ` <a href="#" onclick="delLeave('${l.leave_id}');return false;">✕</a>` : ''); }).join(', ') + `</div>`;
  if (!jobs.length) h += `<div class="empty">${T('noJobs')}</div>`;
  jobs.forEach(j => h += jobCard(j, isToday));
  return h;
}
function jobCard(j, showCheckin){
  const multi = j.start_date !== j.end_date;
  const canWork = S.user && (j.assignees||'').split(',').map(s=>s.trim()).includes(S.user.worker_id);
  let acts = '';
  if (j._pending) acts = `<span class="pend">⏳ ${T('saving')}</span>`;   // กำลังส่งขึ้นเซิร์ฟเวอร์ — ยังกดต่อไม่ได้
  else {
    if ((canWork || S.isAdmin) && j.status === 'planned') acts += `<button class="btn w sm" onclick="setStatus('${j.job_id}','in_progress')">🔧 ${T('start')}</button>`;
    if ((canWork || S.isAdmin) && ['planned','in_progress'].includes(j.status)) acts += `<button class="btn g sm" onclick="openFinish('${j.job_id}')">✅ ${T('finish')}</button>`;
    if (S.isAdmin) acts += `<button class="btn sm" onclick="openJob('${j.job_id}')">✏️</button><button class="btn d sm" onclick="delJob('${j.job_id}')">🗑</button>`;
  }
  const photos = (j.done_photos||'').split('|').filter(Boolean);
  const atts = (j.attachments||'').split('|').filter(Boolean);
  return `<div class="card ${j.status==='done'?'done':''}" style="border-left:6px solid ${projColor(j)}">
    <div class="row"><span class="badge" style="background:${projColor(j)}">${esc(T('types')[j.job_type]||j.job_type)}</span>
      ${j.start_time?`<b>⏱ ${esc(j.start_time)}</b>`:''}<span style="flex:1"></span>
      <span class="st" style="background:var(--${j.status})">${esc(T('statuses')[j.status]||j.status)}</span></div>
    <div class="title">${esc(j.customer)}</div>
    <div class="meta">
      ${multi?`📅 ${fmt(j.start_date)} – ${fmt(j.end_date)}<br>`:''}
      ${j.due_date?`⏰ ${T('dueDate')} ${fmt(j.due_date)}<br>`:''}
      ${j.address?`📍 ${esc(j.address)} `:''}${j.map_url?`<a href="${esc(j.map_url)}" target="_blank" rel="noopener">🗺 ${T('map')}</a>`:''}
      ${j.detail?`<br>📝 ${esc(j.detail).replace(/\n/g,'<br>')}`:''}
      ${j.note?`<br>💬 ${esc(j.note)}`:''}
      ${j.team?`<br>👥 ${esc(j.team)}`:''}
    </div>
    ${peopleHtml(j.assignees, showCheckin)}
    ${atts.length?`<div class="thumbs">${atts.map((u,i)=>/\.(jpe?g|png|gif|webp)|uc\?export|drive\.google\.com\/thumbnail/i.test(u)?`<a href="${esc(u)}" target="_blank"><img src="${esc(u)}"></a>`:`<a href="${esc(u)}" target="_blank">📎 ${T('attachments')} ${i+1}</a>`).join('')}</div>`:''}
    ${photos.length?`<div class="meta" style="margin-top:6px">${T('photos')}</div><div class="thumbs">${photos.map(u=>`<a href="${esc(u)}" target="_blank"><img src="${esc(u)}"></a>`).join('')}</div>`:''}
    ${acts?`<div class="acts">${acts}</div>`:''}
  </div>`;
}
function renderWeek(ws){
  const days = []; for (let i=0;i<7;i++) days.push(addDays(ws,i));
  let h = `<div class="wk"><table class="wk-t"><tr><th>${T('worker')}</th>`;
  days.forEach(d => { const hol = holidayOf(d); h += `<th class="${d===S.today?'today':''} ${hol?'hol':''}" onclick="gotoDay('${d}')">${fmt(d,true)}${hol?`<br><small>🎌 ${esc(hol.name)}</small>`:''}</th>`; });
  h += '</tr>';
  const ws_ = S.workers.filter(w => S.filter==='me' ? (S.user && w.worker_id===S.user.worker_id) : S.filter.startsWith('team:') ? w.team===S.filter.slice(5) : true);
  ws_.forEach(w => {
    h += `<tr><td>${esc(wName(w))}<br><small style="color:#64748b">${esc(w.team||'')}</small></td>`;
    days.forEach(d => {
      const hol = holidayOf(d);
      let c = '';
      S.leaves.filter(l => l.worker_id===w.worker_id && l.date_from<=d && l.date_to>=d).forEach(l => c += `<span class="cell-chip lv">🏖 ${esc(l.type)}</span>`);
      S.jobs.filter(j => j.start_date<=d && j.end_date>=d && (j.assignees||'').split(',').map(s=>s.trim()).includes(w.worker_id) && j.status!=='cancelled')
        .sort((a,b)=>(a.start_time||'99').localeCompare(b.start_time||'99'))
        .forEach(j => c += `<span class="cell-chip ${j.status==='done'?'done':''}" style="background:${projColor(j)}" onclick="openDetail('${j.job_id}')">${j.start_time?j.start_time+' ':''}${esc(j.customer)}</span>`);
      h += `<td class="${d===S.today?'today':''} ${hol?'hol':''}">${c}</td>`;
    });
    h += '</tr>';
  });
  // งานที่ยังไม่ได้มอบหมายคน
  const un = days.map(d => S.jobs.filter(j => j.start_date<=d && j.end_date>=d && !(j.assignees||'').trim() && j.status!=='cancelled'));
  if (un.some(a=>a.length)){
    h += `<tr><td>❓</td>` + un.map((a,i)=>`<td class="${days[i]===S.today?'today':''}">${a.map(j=>`<span class="cell-chip" style="background:${projColor(j)}" onclick="openDetail('${j.job_id}')">${esc(j.customer)}</span>`).join('')}</td>`).join('') + '</tr>';
  }
  return h + '</table></div>';
}
function renderMonth(d){
  const first = ymd(new Date(d.getFullYear(), d.getMonth(), 1));
  const gs = weekStart(first);
  let h = `<div class="mo">` + WEEK_ORDER.map(i=>`<div class="h">${T('days')[i]}</div>`).join('');
  for (let i=0;i<42;i++){
    const ds = addDays(gs,i); const dd = parse(ds);
    const out = dd.getMonth() !== d.getMonth();
    const hol = holidayOf(ds);
    const jobs = jobsOn(ds).filter(j=>j.status!=='cancelled');
    const lv = S.leaves.filter(l => l.date_from<=ds && l.date_to>=ds);
    let c = `<div class="d ${out?'out':''} ${ds===S.today?'today':''} ${hol?'hol':''}" onclick="gotoDay('${ds}')"><span class="n">${dd.getDate()}</span>`;
    if (hol && !hol.weekly) c += `<span class="dot" style="background:#e11d48">🎌 ${esc(hol.name)}</span>`;
    jobs.slice(0,3).forEach(j => c += `<span class="dot" style="background:${projColor(j)};${j.status==='done'?'opacity:.5':''}" onclick="event.stopPropagation();openDetail('${j.job_id}')">${esc(j.customer)}</span>`);
    if (jobs.length>3) c += `<span class="more">+${jobs.length-3}</span>`;
    if (lv.length) c += `<div class="lvn">🏖 ${lv.length}</div>`;
    h += c + '</div>';
  }
  return h + '</div>';
}

    <label>${T('attachments')}</label><input type="file" id="f_files" multiple accept="image/*,.pdf" onchange="addAttachments(this)">

function attThumbs(){ return jobAtt.map((u,i)=>`<span>${/uc\?export|drive\.google\.com\/thumbnail|\.(jpe?g|png|webp)/i.test(u)?`<img src="${esc(u)}">`:'📎'}<br><a href="#" onclick="jobAtt.splice(${i},1);document.getElementById('f_thumbs').innerHTML=attThumbs();return false;">✕</a></span>`).join(''); }
async function addAttachments(inp){
  for (const f of inp.files){
    try{
      const data = f.type.startsWith('image/') ? await shrink(f) : await toB64(f);
      const r = await call('uploadFile', { name:f.name, data, mime: f.type.startsWith('image/')?'image/jpeg':f.type });
      jobAtt.push(r.url);
    }catch(e){ alert(e.message); }
  }
  inp.value=''; document.getElementById('f_thumbs').innerHTML = attThumbs();
}
function useLocation(){
  if (!navigator.geolocation) return alert('no geolocation');
  navigator.geolocation.getCurrentPosition(p => {
    const la = p.coords.latitude.toFixed(6), ln = p.coords.longitude.toFixed(6);
    document.getElementById('f_lat').value = la; document.getElementById('f_lng').value = ln;
    document.getElementById('f_map').value = `https://maps.google.com/?q=${la},${ln}`;
    toast('📍 OK');
  }, e => alert(e.message), { enableHighAccuracy:true, timeout:10000 });
}
function syncDates(v){ if(!v) return; document.getElementById('f_end').value = v; document.getElementById('f_due').value = v; }
async function saveJob(){
  const g = id => document.getElementById(id);
  const job = { job_id:g('f_id').value, job_type:g('f_type').value, customer:g('f_customer').value.trim(), start_date:g('f_start').value, end_date:g('f_end').value||g('f_start').value,
    start_time:g('f_time').value, due_date:g('f_due').value, assignees:[...document.querySelectorAll('.f_as:checked')].map(c=>c.value), team:g('f_team').value,
    address:g('f_addr').value.trim(), map_url:g('f_map').value.trim(), lat:g('f_lat').value, lng:g('f_lng').value, detail:g('f_detail').value.trim(),
    status: g('f_status') ? g('f_status').value : 'planned', attachments: jobAtt };
  if (!job.customer || !job.start_date) return alert(T('customer') + ' / ' + T('startDate'));
  if (job.end_date < job.start_date) job.end_date = job.start_date;
  // optimistic: แสดงผลในเครื่องทันที ปิดฟอร์ม แล้วค่อยส่งขึ้นเซิร์ฟเวอร์เบื้องหลัง (ล้มเหลว → ย้อนกลับ + แจ้ง)
  const isNew = !job.job_id;
  const prev = isNew ? null : Object.assign({}, S.jobs.find(x => x.job_id === job.job_id) || {});
  const local = Object.assign({}, prev || {}, job, { job_id: job.job_id || ('tmp' + Date.now()), assignees: job.assignees.join(','), attachments: jobAtt.join('|'), _pending: true });
  upsertLocal(S.jobs, 'job_id', local); closeModal(); render(); toast(T('saving'));
  try{
    const r = await call('saveJob', { job, isNew });
    S.jobs = S.jobs.filter(x => x.job_id !== local.job_id); upsertLocal(S.jobs, 'job_id', r.job); noteVersion(r); saveCache(); render(); toast(T('saved'));
  }catch(e){
    S.jobs = S.jobs.filter(x => x.job_id !== local.job_id); if (prev && prev.job_id) upsertLocal(S.jobs, 'job_id', prev); render(); alert(e.message);
  }
}
async function delJob(id){
  if(!confirm(T('confirmDel'))) return;
  const prev = S.jobs.find(x => x.job_id === id); S.jobs = S.jobs.filter(x => x.job_id !== id); closeModal(); render();
  try{ const r = await call('deleteJob',{jobId:id}); noteVersion(r); saveCache(); }
  catch(e){ if (prev) upsertLocal(S.jobs, 'job_id', prev); render(); alert(e.message); }
}
async function setStatus(id, st, extra){
  const j = S.jobs.find(x => x.job_id === id); if (!j) return;
  const prev = Object.assign({}, j);
  closeModal();   // กดจาก popup รายละเอียด → ปิดให้เลย ตารางด้านหลังอัปเดตทันที
  j.status = st; j._pending = true;
  if (extra && extra.note) j.note = extra.note;
  if (extra && extra.photos && extra.photos.length) j.done_photos = [j.done_photos, extra.photos.map(p => p.data).join('|')].filter(Boolean).join('|');   // โชว์รูปจากเครื่องไปก่อน
  render(); toast(T('saving'));
  try{ const r = await call('setStatus', Object.assign({ jobId:id, status:st }, extra || {})); upsertLocal(S.jobs, 'job_id', r.job); noteVersion(r); saveCache(); render(); toast(T('saved')); }
  catch(e){ Object.assign(j, prev); delete j._pending; render(); alert(e.message); }
}

let finPhotos = [];
function openFinish(id){
  finPhotos = [];
  openModal(`<h3>✅ ${T('finish')}</h3><input type="hidden" id="fin_id" value="${id}">
    <label>${T('attachPhoto')}</label><input type="file" accept="image/*" capture="environment" multiple onchange="addFinPhotos(this)">
    <div class="thumbs" id="fin_thumbs"></div>
    <label>${T('finishNote')}</label><textarea id="fin_note"></textarea>
    <div class="acts"><button class="btn g" id="fin_save" onclick="doFinish()">${T('save')}</button><button class="btn" onclick="closeModal()">${T('cancel')}</button></div>`);
}
async function addFinPhotos(inp){
  for (const f of inp.files) finPhotos.push(await shrink(f));
  inp.value=''; document.getElementById('fin_thumbs').innerHTML = finPhotos.map(d=>`<img src="${d}">`).join('');
}
function doFinish(){
  if (!finPhotos.length && !S.isAdmin) return alert(T('attachPhoto'));
  const id = document.getElementById('fin_id').value, note = document.getElementById('fin_note').value.trim();
  const photos = finPhotos.map(d=>({data:d,mime:'image/jpeg'})); finPhotos = [];
  closeModal();
  setStatus(id, 'done', { photos, note });   // optimistic — ปิดฟอร์มทันที อัปโหลดรูปเบื้องหลัง
}

function openLeave(){
  openModal(`<h3>${T('addLeave')}</h3>
    <label>${T('worker')}</label><select id="lv_w">${S.workers.map(w=>`<option value="${w.worker_id}">${esc(wName(w))}</option>`).join('')}</select>
    <div class="g2"><div><label>${T('dateFrom')}</label><input type="date" id="lv_from" value="${S.cursor}"></div><div><label>${T('dateTo')}</label><input type="date" id="lv_to" value="${S.cursor}"></div></div>
    <label>${T('leaveType')}</label><select id="lv_type">${T('lvTypes').map((t,i)=>`<option value="${I18N.th.lvTypes[i]}">${t}</option>`).join('')}</select>
    <label>${T('note')}</label><input id="lv_note">
    <div class="acts"><button class="btn p" onclick="saveLeave()">${T('save')}</button><button class="btn" onclick="closeModal()">${T('cancel')}</button></div>`);
}
async function saveLeave(){
  const g = id => document.getElementById(id).value;
  const leave = { leave_id:'tmp'+Date.now(), worker_id:g('lv_w'), date_from:g('lv_from'), date_to:g('lv_to')||g('lv_from'), type:g('lv_type'), note:g('lv_note') };
  if (!leave.date_from) return;
  S.leaves.push(leave); closeModal(); render(); toast(T('saving'));
  try{ const r = await call('saveLeave',{ leave:{ worker_id:leave.worker_id, date_from:leave.date_from, date_to:leave.date_to, type:leave.type, note:leave.note } });
    S.leaves = S.leaves.filter(l => l.leave_id !== leave.leave_id); upsertLocal(S.leaves, 'leave_id', r.leave); noteVersion(r); saveCache(); render(); toast(T('saved')); }
  catch(e){ S.leaves = S.leaves.filter(l => l.leave_id !== leave.leave_id); render(); alert(e.message); }
}
async function delLeave(id){
  if(!confirm(T('confirmDel'))) return;
  const prev = S.leaves.find(l => l.leave_id === id); S.leaves = S.leaves.filter(l => l.leave_id !== id); render();
  try{ const r = await call('deleteLeave',{leaveId:id}); noteVersion(r); saveCache(); }
  catch(e){ if (prev) S.leaves.push(prev); render(); alert(e.message); }
}

function openHoliday(){
  const cur = S.holidays.find(h=>h.date===S.cursor);
  openModal(`<h3>${T('addHoliday')}</h3>
    <label>${T('date')}</label><input type="date" id="h_date" value="${S.cursor}">
    <label>${T('holidayName')}</label><input id="h_name" value="${esc(cur?cur.name:'')}">
    <div class="acts"><button class="btn p" onclick="saveHoliday()">${T('save')}</button>${cur?`<button class="btn d" onclick="delHoliday()">${T('del')}</button>`:''}<button class="btn" onclick="closeModal()">${T('cancel')}</button></div>`);
}
async function saveHoliday(){
  const date = document.getElementById('h_date').value, name = document.getElementById('h_name').value; if (!date) return;
  const prev = S.holidays.slice(); upsertLocal(S.holidays, 'date', { date, name }); closeModal(); render(); toast(T('saving'));
  try{ const r = await call('saveHoliday',{ date, name }); noteVersion(r); saveCache(); toast(T('saved')); }
  catch(e){ S.holidays = prev; render(); alert(e.message); }
}
async function delHoliday(){
  const date = document.getElementById('h_date').value;
  const prev = S.holidays.slice(); S.holidays = S.holidays.filter(h => h.date !== date); closeModal(); render();
  try{ const r = await call('deleteHoliday',{ date }); noteVersion(r); saveCache(); }
  catch(e){ S.holidays = prev; render(); alert(e.message); }
}

function openWorker(){
  openModal(`<h3>${T('manageWorkers')}</h3>
    <label>${T('worker')}</label><select id="w_sel" onchange="fillWorker()"><option value="">+ ${T('newWorker')}</option>${S.workers.map(w=>`<option value="${w.worker_id}">${esc(w.name_th)}</option>`).join('')}</select>
    <label>${T('nameTh')}</label><input id="w_th"><label>${T('nameMm')}</label><input id="w_mm">
    <label>${T('team')}</label><input id="w_team" list="teams"><datalist id="teams">${[...new Set(S.workers.map(w=>w.team).filter(Boolean))].map(t=>`<option value="${esc(t)}">`).join('')}</datalist>
    <label>${T('role')}</label><select id="w_role"><option value="worker">worker</option><option value="lead">lead</option></select>

function fillWorker(){
  const w = worker(document.getElementById('w_sel').value) || {};

  document.getElementById('w_team').value = w.team||''; document.getElementById('w_role').value = w.role||'worker'; document.getElementById('w_active').checked = w.active!=='FALSE';
}
async function saveWorker(){
  const g = id => document.getElementById(id);
  const id = g('w_sel').value; const old = worker(id) || {};
  const w = { worker_id:id, name_th:g('w_th').value.trim(), name_mm:g('w_mm').value.trim(), team:g('w_team').value.trim(), role:g('w_role').value, line_user_id: old.line_user_id||'', active: g('w_active').checked };
  if (!w.name_th) return;
  try{ const r = await call('saveWorker',{worker:w}); S.workers = r.workers; noteVersion(r); saveCache(); closeModal(); render(); toast(T('saved')); }catch(e){ alert(e.message); }
}

/* ================== บอร์ดแคสต์เข้ากลุ่ม (แอดมิน) ================== */
// ลงงาน/แก้งานไม่ส่ง LINE อัตโนมัติแล้ว — แอดมินเลือกร่างข้อความ แก้ได้ แล้วกดส่งเข้ากลุ่มเอง
const BC_KINDS = [['today','bcToday'],['tomorrow','bcTomorrow'],['week','bcWeek'],['nextweek','bcNextWeek'],['custom','bcCustom']];
let bcSeq = 0;
function openBroadcast(){
  openModal(`<h3>${T('broadcast')}</h3>
    <div class="acts" id="bc_kinds" style="flex-wrap:wrap;justify-content:flex-start;margin-top:0">${BC_KINDS.map(([k,l])=>`<button class="btn sm" data-k="${k}" onclick="bcPick('${k}')">${T(l)}</button>`).join('')}</div>
    <textarea id="bc_text" rows="12" style="min-height:240px;font-size:14px"></textarea>
    <div class="meta" style="margin-top:6px">${T('bcHint')}</div>
    <div class="acts"><button class="btn p" id="bc_send" onclick="sendBroadcast()">${T('bcSend')}</button><button class="btn" onclick="closeModal()">${T('cancel')}</button></div>`);
  bcPick('today');
}
async function bcPick(kind){
  document.querySelectorAll('#bc_kinds .btn').forEach(b => b.classList.toggle('p', b.dataset.k === kind));
  const ta = document.getElementById('bc_text'); ta.dataset.kind = kind;
  if (kind === 'custom') { ta.value = ''; ta.placeholder = ''; ta.focus(); return; }
  const seq = ++bcSeq; ta.value = ''; ta.placeholder = T('loading');
  try{ const r = await call('broadcastPreview',{ kind }); if (seq === bcSeq && document.getElementById('bc_text')) { ta.value = r.text; ta.placeholder = ''; } }
  catch(e){ if (seq === bcSeq) ta.placeholder = e.message; }
}
async function sendBroadcast(){
  const ta = document.getElementById('bc_text'), btn = document.getElementById('bc_send');
  const text = ta.value.trim(); if (!text) return;
  if (!confirm(T('bcConfirm'))) return;
  btn.disabled = true; btn.textContent = T('bcSending');
  try{ await call('broadcast',{ text, kind: ta.dataset.kind }); closeModal(); toast(T('bcSent')); }
  catch(e){ btn.disabled = false; btn.textContent = T('bcSend'); alert(e.message); }
}

/* ================== image helpers ================== */
function toB64(file){ return new Promise((res,rej)=>{ const r = new FileReader(); r.onload = ()=>res(r.result); r.onerror = rej; r.readAsDataURL(file); }); }
function shrink(file, max=1280, q=0.75){
  return new Promise((res,rej)=>{
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => { const s = Math.min(1, max/Math.max(img.width,img.height)); const c = document.createElement('canvas');
      c.width = Math.round(img.width*s); c.height = Math.round(img.height*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q)); };
    img.onerror = rej; img.src = url;
  });
}
boot();

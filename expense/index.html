<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>SGQ บันทึกค่าใช้จ่าย</title>
<meta name="description" content="ตัวอย่างหน้าเว็บระบบบันทึกค่าใช้จ่ายจากสลิปในกลุ่ม LINE ของ SGQ Co., Ltd. (ข้อมูลสมมติ)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&amp;family=Prompt:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
/* ===== SGQ expenses v2.1 — "ledger on aluminium" (single light theme) ===== */
:root{
  color-scheme: light;
  /* type */
  --font-display:"Prompt","IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
  --font-body:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
  --fs-12:12px; --fs-13:13px; --fs-14:14px; --fs-16:16px; --fs-18:18px; --fs-22:22px; --fs-28:28px; --fs-40:40px;
  --lh-body:1.5; --lh-display:1.15; --ls-label:.02em;
  /* surfaces (aluminium grey) */
  --bg:#eef1f4; --surface:#ffffff; --surface2:#f6f8fa; --line:#d9dfe6; --line2:#e8edf2;
  --ink:#0f1b2d; --ink2:#4a5668; --ink3:#8a95a5;
  /* navy chrome */
  --navy:#0b1f33; --navy2:#122b45; --onNavy:#e6edf5; --onNavy2:#9fb3c8; --navyLine:rgba(230,237,245,.14);
  /* accent */
  --brand:#0f4c81; --brandSoft:#e4eef8; --accent:#1d6fd1; --accentOnNavy:#6fb0ff; --onBrand:#ffffff;
  /* semantic */
  --ok:#15803d; --okSoft:#dcfce7; --warn:#b45309; --warnSoft:#fef3c7; --bad:#b91c1c; --badSoft:#fee2e2; --inc:#0e7490; --incSoft:#cffafe;
  /* shape */
  --r:10px; --rc:8px; --rp:999px;
  --scrim:rgba(11,31,51,.55); --shadowFloat:0 16px 40px rgba(11,31,51,.22);
  /* chart */
  --chart-grid:#e4eef8; --chart-axis:#d9dfe6; --chart-ink:#8a95a5; --chart-ink-strong:#0f1b2d;
  --barToday:#0f4c81; --barMuted:rgba(15,76,129,.45); --barHover:#1d6fd1; --barIncome:#0e7490; --weekend:#f6f8fa; --track:#e8edf2; --stAuto:#b8c4d2;
  /* categories (v1 order, validated) */
  --cat-alu:#1d6fd1; --cat-glass:#eb6834; --cat-hw:#1baf7a; --cat-labor:#eda100; --cat-fuel:#e87ba4;
  --cat-tool:#008300; --cat-office:#6250d6; --cat-util:#e34948; --cat-other:#94a3b8;
  /* banks (mock slips) */
  --bk-kbank:#138f2d; --bk-scb:#4e2a84; --bk-bbl:#1e3a8a; --bk-ktb:#1ba5e1; --bk-ttb:#f07c1b;
  --bk-gsb:#eb198d; --bk-pp:#123a6b; --bk-cash:#64748b; --on-bank:#ffffff;
  /* slip */
  --slip-paper:#ffffff; --slip-ink:#0f1b2d; --slip-muted:#64748b; --slip-line:#e2e8f0; --slip-ok:#16a34a; --slip-qr:#0f1b2d; --slip-ph:#cbd5e1;
  /* LINE chat mock */
  --chat-bg:#cbd7e4; --bubbleMember:#a6e58a; --bubbleBot:#ffffff; --bubble-ink:#0f1b2d; --chat-time:#4a5668; --line-green:#06c755; --chat-av1:#b45309; --chat-av2:#0e7490;
  /* sticky offset (phone header 56px) */
  --stickTop:calc(env(safe-area-inset-top, 0px) + 56px); --fbarH:0px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);font-family:var(--font-body);color:var(--ink);font-size:var(--fs-16);line-height:var(--lh-body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top, 0px);background:var(--navy);z-index:45}
body.noscroll{overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
h1,h2,h3,h4{margin:0;font-family:var(--font-display);font-weight:600;line-height:var(--lh-display);text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top :focus-visible,.side :focus-visible{outline-color:var(--accentOnNavy)}
svg :focus-visible{outline:none}
h2[tabindex="-1"]:focus{outline:none}
.muted{color:var(--ink3)}

/* --- phone header --- */
.col{min-width:0}
.top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:30;height:56px;display:flex;align-items:center;gap:10px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));background:var(--navy);color:var(--onNavy)}
.wm{width:36px;height:36px;border-radius:var(--rc);border:1.5px solid var(--onNavy2);color:var(--onNavy);font-family:var(--font-display);font-weight:600;font-size:var(--fs-13);letter-spacing:.04em;display:grid;place-items:center;flex:none}
.top .tt{min-width:0;flex:1;line-height:1.2}
.top .t1{font-family:var(--font-display);font-weight:600;font-size:var(--fs-16);display:flex;align-items:center;gap:6px}
.top .t2{font-size:var(--fs-12);color:var(--onNavy2);letter-spacing:var(--ls-label)}
.live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--line-green);flex:none}
.meav{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:var(--fs-13);background:var(--navy2);color:var(--onNavy);border:1px solid var(--navyLine);flex:none;text-decoration:none}
.demo{height:28px;display:flex;align-items:center;justify-content:center;background:var(--surface2);color:var(--ink2);font-size:var(--fs-12);letter-spacing:var(--ls-label);border-bottom:1px solid var(--line);padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* --- content --- */
.wrap{padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:16px calc(108px + env(safe-area-inset-bottom, 0px));max-width:1280px;margin:0 auto}
.view{min-width:0}
.shead{display:flex;align-items:center;gap:10px;margin:0 0 14px;flex-wrap:wrap}
.shead h2{font-size:var(--fs-22);flex:1;min-width:0}
.shead .sub{font-size:var(--fs-13);color:var(--ink3)}
.msw{display:inline-flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--rc);flex:none;height:40px}
.msw button{width:38px;height:38px;border:none;background:none;display:grid;place-items:center;color:var(--brand);font-size:var(--fs-12);padding:0;border-radius:var(--rc)}
.msw button:hover:not(:disabled){background:var(--brandSoft)}
.msw button:disabled{color:var(--line);cursor:default}
.msw b{min-width:86px;text-align:center;font-family:var(--font-display);font-weight:500;font-size:var(--fs-16);border-inline:1px solid var(--line2);line-height:38px}

/* --- cards --- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card h3{font-size:var(--fs-18);display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
.card h3 .sp{flex:1}
.card h3 .note,.card h3 small{font-family:var(--font-body);font-size:var(--fs-13);font-weight:400;color:var(--ink3)}
.lnk{background:none;border:none;color:var(--accent);font-weight:500;font-size:var(--fs-14);padding:4px 2px;text-decoration:none;font-family:var(--font-body)}
.lnk:hover{text-decoration:underline}
.grid{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.stack{display:grid;gap:12px;min-width:0}

/* --- KPI band --- */
.kband{padding:0;display:grid;grid-template-columns:minmax(0,1fr)}
.kmain{padding:16px 16px 14px;min-width:0}
.klabel,.kl{font-size:var(--fs-13);color:var(--ink2);letter-spacing:var(--ls-label)}
.kfig{font-family:var(--font-display);font-weight:600;font-size:32px;line-height:var(--lh-display);color:var(--ink);font-variant-numeric:tabular-nums;margin:4px 0 6px;white-space:nowrap}
.kfoot{font-size:var(--fs-12);color:var(--ink3)}
.kstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line2)}
.kstat{padding:12px 10px;display:flex;flex-direction:column;gap:2px;min-width:0;border-left:1px solid var(--line2);color:inherit;text-decoration:none}
.kstat:first-child{border-left:none}
a.kstat:hover{background:var(--surface2)}
.kv{font-size:var(--fs-22);font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:4px;white-space:nowrap}
.kv .ar{font-size:var(--fs-13)}
.ks{font-size:var(--fs-12);color:var(--ink3);line-height:1.35}
.kstat.pend .kv{color:var(--warn)}
.wdot{width:8px;height:8px;border-radius:50%;background:var(--warn);display:inline-block;flex:none}
.delta.up{color:var(--warn)} .delta.down{color:var(--ok)} .delta.flat{color:var(--ink2)}

/* --- charts --- */
.chart{position:relative;min-width:0}
.chart svg{display:block;overflow:visible;font-family:var(--font-body)}
.chart svg:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:4px}
.ctext{font-size:var(--fs-12);font-variant-numeric:tabular-nums}
.legend-note{font-size:var(--fs-12);color:var(--ink3);margin:8px 0 0;letter-spacing:var(--ls-label)}
.legend-note i{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:4px}
details.tbl{margin-top:8px;font-size:var(--fs-14)}
details.tbl summary{cursor:pointer;color:var(--accent);font-weight:500;padding:4px 0;width:max-content;max-width:100%}
.tblwrap{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:var(--rc);margin-top:6px}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line2);font-size:var(--fs-13)}
th{background:var(--surface2);color:var(--ink2);font-weight:500;position:sticky;top:0;letter-spacing:var(--ls-label)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.tip{position:fixed;z-index:90;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--rc);box-shadow:var(--shadowFloat);padding:7px 10px;font-size:var(--fs-12);line-height:1.4;max-width:220px}
.tip b{display:block;font-size:var(--fs-16);font-weight:600;font-variant-numeric:tabular-nums}
.tip span{color:var(--ink3)}

/* --- ledger tables --- */
.ledger{list-style:none;margin:0 -16px;padding:0}
.ledger li{border-top:1px solid var(--line2)}
.ledger li:first-child{border-top:none}
.lrow{width:100%;border:none;background:none;text-align:left;padding:10px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto 46px;grid-template-areas:"name amt pct" "bar bar bar";gap:6px 10px;align-items:center;min-width:0;border-radius:0}
.lrow:hover{background:var(--surface2)}
.lname{grid-area:name;min-width:0;display:flex;align-items:center;gap:8px;font-size:var(--fs-14);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lname span{overflow:hidden;text-overflow:ellipsis}
.lname i,.cat i{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.lbar{grid-area:bar;min-width:0;display:block}
.lbar svg{display:block}
.lamt{grid-area:amt;font-size:var(--fs-14);font-weight:600;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.lpct{grid-area:pct;font-size:var(--fs-12);color:var(--ink3);font-variant-numeric:tabular-nums;text-align:right}
.lrow.np .lname{color:var(--ink2);font-weight:400}

/* --- list rows --- */
.lcard{padding:0;overflow:visible}
.rows{display:block}
button.row{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px 10px 18px;border:none;border-top:1px solid var(--line2);background:var(--surface);text-align:left;min-width:0}
button.row:first-child{border-top:none}
button.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--stripe, var(--line))}
button.row:hover{background:var(--surface2)}
.row.s-auto{--stripe:var(--stAuto)} .row.s-approved{--stripe:var(--ok)} .row.s-pending{--stripe:var(--warn)} .row.s-rejected{--stripe:var(--bad)} .row.s-in{--stripe:var(--inc)}
.row.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{background:var(--brandSoft)}100%{background:var(--surface)}}
.thumb{flex:none;width:40px;height:52px;border-radius:4px;overflow:hidden;border:1px solid var(--line);display:block;background:var(--slip-paper)}
.thumb svg,.thumb img{display:block;width:38px;height:50px;object-fit:cover}
.rmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.rname{font-weight:500;font-size:var(--fs-14);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rsub{font-size:var(--fs-12);color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.rsub2{font-size:var(--fs-12);color:var(--ink2);display:flex;flex-wrap:wrap;gap:2px 10px;align-items:center}
.cat{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.flag{font-weight:600;white-space:nowrap;letter-spacing:var(--ls-label)}
.flag.bad{color:var(--bad)} .flag.warn{color:var(--warn)} .flag.inc{color:var(--inc)}
.ramt{flex:none;font-weight:600;font-size:var(--fs-14);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.ramt.void{color:var(--ink3);text-decoration:line-through}
.ramt.inc{color:var(--inc)}
.dhd{position:sticky;top:calc(var(--stickTop) + var(--fbarH));z-index:5;display:flex;align-items:baseline;gap:8px;font-size:var(--fs-13);font-weight:600;color:var(--ink2);padding:6px 14px;background:var(--surface2);border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);letter-spacing:var(--ls-label)}
.lcard > .dgrp:first-child > .dhd{border-top:none}
.dhd span{flex:1}
.dhd small{font-size:var(--fs-13);font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}

/* --- chips / segmented --- */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:var(--rp);padding:5px 12px;font-size:var(--fs-13);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;flex:none;color:var(--ink2)}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chip[aria-pressed="true"]{background:var(--brandSoft);color:var(--brand);border-color:var(--brand);font-weight:500}
.chip .n,.seg-b .n{font-size:var(--fs-12);opacity:.7;font-variant-numeric:tabular-nums}
.segs{display:flex;border:1px solid var(--line);border-radius:var(--rp);background:var(--surface);padding:2px;gap:2px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.segs::-webkit-scrollbar{display:none}
.seg-b{flex:1 0 auto;border:none;background:none;border-radius:var(--rp);padding:6px 8px;font-size:var(--fs-13);white-space:nowrap;color:var(--ink2);min-height:34px}
.seg-b[aria-pressed="true"]{background:var(--brand);color:var(--onBrand);font-weight:500}
.seg-b[aria-pressed="true"] .n{opacity:.85}

/* --- list filter bar --- */
.lhead{gap:10px}
.lhead h2{flex:1 1 auto}
.lhead .msw-wrap{order:1;flex:none}
.lhead .search{order:2;flex:1 1 200px}
.lhead .ftoggle{order:3;flex:none}
.search{min-width:0;position:relative}
.search input{width:100%;height:44px;border:1px solid var(--line);border-radius:var(--rc);padding:0 12px 0 38px;font-size:var(--fs-16);background:var(--surface)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--ink3)}
.ftoggle{height:44px;border:1px solid var(--line);background:var(--surface);border-radius:var(--rc);padding:0 14px;font-family:var(--font-display);font-weight:500;font-size:var(--fs-14);display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.ftoggle[aria-expanded="true"]{border-color:var(--brand);color:var(--brand);background:var(--brandSoft)}
.ftoggle .cnt{background:var(--brand);color:var(--onBrand);border-radius:var(--rp);font-size:var(--fs-12);padding:0 6px;line-height:1.6;font-family:var(--font-body)}
.fbar{position:sticky;top:var(--stickTop);z-index:20;background:var(--bg);margin:0 0 10px;padding:8px 0 2px}
.fpanel{margin-top:8px}
.fpanel .g2{margin-bottom:6px}
.fsum{display:flex;align-items:center;gap:8px;font-size:var(--fs-13);color:var(--ink2);padding:6px 2px 4px;flex-wrap:wrap}
.fsum b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.fsum .sp{flex:1}

/* --- forms --- */
.f label,.flabel{display:block;font-size:var(--fs-13);font-weight:500;color:var(--ink2);margin:14px 0 6px;letter-spacing:var(--ls-label)}
.f input,.f textarea,.f select,.sel{width:100%;min-width:0;max-width:100%;min-height:44px;border:1px solid var(--line);border-radius:var(--rc);padding:9px 12px;font-size:var(--fs-16);background:var(--surface);color:var(--ink)}
.f input[type=file]{padding:8px;font-size:var(--fs-14)}
.f textarea{min-height:84px;resize:vertical}
.f input:focus-visible,.f textarea:focus-visible,.f select:focus-visible,.sel:focus-visible,.search input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-color:var(--accent)}
.f [aria-invalid="true"]{border-color:var(--bad)}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.err{font-size:var(--fs-13);color:var(--bad);margin-top:5px}
.hint{font-size:var(--fs-13);color:var(--ink3);margin-top:6px}
.segfs{border:none;padding:0;margin:14px 0 0;min-width:0}
.segfs legend{padding:0;margin:0 0 6px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg label{margin:0;border:1px solid var(--line);background:var(--surface);border-radius:var(--rp);padding:8px 16px;font-size:var(--fs-14);font-weight:400;color:var(--ink);cursor:pointer;letter-spacing:0}
.seg input:checked+label{border-color:var(--brand);background:var(--brandSoft);color:var(--brand);font-weight:500}
.seg input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchip{border:1px solid var(--line);background:var(--surface);border-radius:var(--rp);padding:5px 11px;font-size:var(--fs-13);display:inline-flex;align-items:center;gap:6px;color:var(--ink2)}
.tchip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.tchip[aria-pressed="true"]{border-color:var(--brand);background:var(--brandSoft);color:var(--brand);font-weight:500}
button.tchip:hover{border-color:var(--ink3)}
.photo{position:relative;border:1px dashed var(--ink3);border-radius:var(--r);padding:18px 10px;text-align:center;color:var(--ink2);background:var(--surface2);display:block;cursor:pointer;font-weight:500}
.photo:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.photo .big{font-size:26px;display:block}
.photo input{position:absolute;opacity:0;width:1px;height:1px}
.preview{margin-top:10px;display:flex;gap:10px;align-items:center}
.preview img{width:84px;height:84px;object-fit:cover;border-radius:var(--rc);display:block;border:1px solid var(--line)}

/* --- buttons --- */
.btn{border:1px solid transparent;border-radius:var(--rc);padding:9px 16px;font-family:var(--font-display);font-weight:500;font-size:var(--fs-14);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;min-height:44px;letter-spacing:.01em}
.btn.primary{background:var(--brand);color:var(--onBrand);border-color:var(--brand)}
.btn.primary:hover:not(:disabled){background:var(--navy2);border-color:var(--navy2)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover:not(:disabled){background:var(--surface2)}
.btn.danger{background:var(--surface);color:var(--bad);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--onBrand)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:var(--fs-13)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:16px}
.btns .full{grid-column:1/-1}

/* --- warn boxes --- */
.warnbox{border-radius:var(--rc);padding:9px 12px;font-size:var(--fs-14);margin-top:10px;display:flex;gap:8px;align-items:flex-start;border:1px solid transparent}
.warnbox.w{background:var(--warnSoft);color:var(--warn)}
.warnbox.b{background:var(--badSoft);color:var(--bad)}
.warnbox.i{background:var(--incSoft);color:var(--inc)}
.warnbox .ic{flex:none;font-weight:700;line-height:1.5}
.warnbox p{margin:0;min-width:0}
.warnbox b{font-weight:600}

/* --- review cards --- */
.rvlist{align-items:start}
.rv{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;transition:opacity .25s ease,transform .25s ease}
.rv.out{opacity:0;transform:translateX(24px)}
.rvtop{display:flex;gap:12px;align-items:flex-start}
.rvtop .thumbbtn{border:none;padding:0;background:none;border-radius:4px;flex:none}
.rvm{flex:1;min-width:0}
.rvamt{font-size:var(--fs-22);font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.rvname{font-weight:500;font-size:var(--fs-14);overflow-wrap:anywhere}
.rvsub{font-size:var(--fs-12);color:var(--ink3);font-variant-numeric:tabular-nums}
.conf{flex:none;font-size:var(--fs-12);font-weight:600;border-radius:var(--rp);padding:1px 9px;background:var(--okSoft);color:var(--ok);font-variant-numeric:tabular-nums}
.conf.lo{background:var(--warnSoft);color:var(--warn)}
.rvsec{margin-top:12px}
.rvsec .flabel{margin:0 0 6px}
.rvacts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.rvacts .btn{flex:1 1 120px}
.empty{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:32px 16px;text-align:center;color:var(--ink2)}
.empty .big{font-size:36px;display:block}
.empty b{display:block;font-family:var(--font-display);font-weight:600;font-size:var(--fs-18);color:var(--ink);margin:6px 0 2px}

/* --- LINE bot --- */
.bot{display:flex;gap:12px;align-items:center}
.bot .lg{width:40px;height:40px;border-radius:var(--rc);background:var(--line-green);color:var(--onBrand);font-weight:700;display:grid;place-items:center;font-size:var(--fs-12);flex:none}
.bot .bt{min-width:0;font-size:var(--fs-14);color:var(--ink2)}
.bot .bt b{color:var(--ink);font-size:var(--fs-14);font-weight:600;display:flex;align-items:center;gap:6px}
.chat{background:var(--chat-bg);border-radius:var(--r);padding:12px 10px;display:flex;flex-direction:column;gap:10px}
.chat .day{align-self:center;font-size:var(--fs-12);background:var(--surface2);color:var(--chat-time);padding:0 10px;border-radius:var(--rp)}
.msg{display:flex;gap:8px;align-items:flex-start;max-width:100%}
.msg .av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--onBrand);font-weight:600;font-size:var(--fs-12);flex:none;font-family:var(--font-display)}
.msg .mb{min-width:0;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.msg .who{font-size:var(--fs-12);color:var(--chat-time)}
.bub{background:var(--bubbleBot);color:var(--bubble-ink);border-radius:14px;border-top-left-radius:4px;padding:8px 11px;font-size:var(--fs-14);max-width:min(300px,100%);overflow-wrap:anywhere}
.bub.mem{background:var(--bubbleMember)}
.bub.img{padding:4px;line-height:0;background:var(--bubbleBot)}
.bub.img svg{display:block}
.mt{font-size:var(--fs-12);color:var(--chat-time)}
.qr{display:flex;flex-wrap:wrap;gap:6px}
.qr button{border:1px solid var(--line-green);background:var(--bubbleBot);color:var(--ok);border-radius:var(--rp);padding:4px 11px;font-size:var(--fs-13);font-weight:500}
.qr button[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--onBrand)}

/* --- menu / settings --- */
.set{border-top:1px solid var(--line2);padding:14px 0}
.set:first-of-type{border-top:none;padding-top:0}
.set h4{font-size:var(--fs-16);margin-bottom:8px;font-weight:500}
.set .hint{margin-top:0;margin-bottom:8px}
.addrow{display:flex;gap:8px;margin-top:8px}
.addrow input{flex:1;min-width:0;border:1px solid var(--line);border-radius:var(--rc);padding:0 10px;min-height:36px;font-size:var(--fs-16)}
.acct,.usr{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:var(--fs-14);border-top:1px solid var(--line2)}
.acct:first-of-type,.usr:first-of-type{border-top:none}
.acct .bk{width:30px;height:30px;border-radius:6px;color:var(--on-bank);display:grid;place-items:center;font-size:10px;font-weight:700;flex:none}
.acct .ad,.usr .ud{flex:1;min-width:0}
.acct b,.usr b{font-weight:500}
.acct small,.usr small{display:block;color:var(--ink3);font-size:var(--fs-12)}
.role{font-size:var(--fs-12);font-weight:500;padding:1px 9px;border-radius:var(--rp);border:1px solid var(--line);color:var(--ink2);flex:none}
.role.admin{border-color:var(--brand);color:var(--brand);background:var(--brandSoft)}
.role.acc{border-color:var(--ok);color:var(--ok);background:var(--okSoft)}
.about ul{margin:0;padding-left:20px}
.about li{margin:4px 0;font-size:var(--fs-14);color:var(--ink2)}

/* --- bottom nav + centre FAB --- */
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end;padding:0 max(4px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(4px, env(safe-area-inset-left, 0px))}
.nb{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 4px;font-size:var(--fs-12);font-weight:500;color:var(--ink3);text-decoration:none;min-width:0;letter-spacing:var(--ls-label)}
.nb svg,.sn svg{width:22px;height:22px;flex:none}
.nb[aria-current="page"]{color:var(--brand)}
.nb[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:2px;background:var(--brand);border-radius:0 0 2px 2px}
.nb.fab .fabc{width:52px;height:52px;margin-top:-24px;border-radius:50%;background:var(--brand);color:var(--onBrand);display:grid;place-items:center;border:4px solid var(--surface)}
.nb.fab .fabc svg{width:24px;height:24px}
.nb.fab[aria-current="page"]::before{display:none}
.nb.fab[aria-current="page"] .fabc{background:var(--navy)}
.icw{position:relative;display:inline-flex}
.badge{position:absolute;top:-5px;right:-11px;min-width:18px;height:18px;border-radius:var(--rp);background:var(--bad);color:var(--onBrand);font-size:11px;font-weight:600;display:grid;place-items:center;padding:0 5px;border:2px solid var(--surface);font-variant-numeric:tabular-nums;line-height:1;letter-spacing:0}

/* --- sidebar (desktop) --- */
.side{display:none}

/* --- detail sheet --- */
.ov{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease}
.sheet{background:var(--surface);width:100%;max-height:92vh;overflow-y:auto;border-radius:14px 14px 0 0;box-shadow:var(--shadowFloat);animation:up .2s ease;-webkit-overflow-scrolling:touch;padding:0 max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.shd{position:sticky;top:0;background:var(--surface);display:flex;align-items:center;gap:10px;padding:14px 0 12px;z-index:2;border-bottom:1px solid var(--line2)}
.shd h2{font-size:var(--fs-18);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x{width:36px;height:36px;border-radius:var(--rc);border:1px solid var(--line);background:var(--surface);font-size:var(--fs-16);padding:0;flex:none;color:var(--ink)}
.sgrid{display:grid;gap:16px;padding-top:14px;min-width:0}
.slipbig{display:flex;justify-content:center;background:var(--surface2);border:1px solid var(--line2);border-radius:var(--r);padding:12px}
.slipbig svg,.slipbig img{width:100%;max-width:240px;height:auto;display:block;border-radius:6px;border:1px solid var(--line)}
.dchips{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:var(--fs-13)}
.kvl{display:grid;grid-template-columns:auto minmax(0,1fr);font-size:var(--fs-14);margin:12px 0 0;border-top:1px solid var(--line2)}
.kvl dt,.kvl dd{padding:7px 0;border-bottom:1px solid var(--line2)}
.kvl dt{color:var(--ink3);padding-right:12px}
.kvl dd{margin:0;font-weight:500;text-align:right;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.linewrap{display:inline-block}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--navy);color:var(--onNavy);padding:10px 18px;border-radius:var(--rc);font-size:var(--fs-14);z-index:80;max-width:calc(100vw - 32px);text-align:center}

.flag.ok{color:var(--ok)}
.lcard{overflow:clip}
.lcard > h3{padding:16px 16px 0;margin-bottom:12px}
.lcard > .rows{border-top:1px solid var(--line2)}

/* ===== v2.1: income / tax / tables ===== */
.inc{color:var(--inc)} .neg{color:var(--bad)}
.kv.inc{color:var(--inc)} .kv.neg{color:var(--bad)}
.tip b.inc{color:var(--inc)}
.flag.mute{color:var(--ink3);font-weight:500}
.kstats.k4{grid-template-columns:repeat(2,minmax(0,1fr))}
.kstats.k4 .kstat:nth-child(3){border-left:none}
.kstats.k4 .kstat:nth-child(n+3){border-top:1px solid var(--line2)}
.kstats.k4 .kv{font-size:var(--fs-18)}
.ogrid{display:grid;gap:12px;grid-template-columns:minmax(0,1fr);margin-top:16px}
.card h3 .segs.sm{margin-left:auto;font-family:var(--font-body)}
.segs.sm .seg-b{min-height:30px;padding:3px 10px;font-size:var(--fs-12)}
.card h3:has(.segs){flex-wrap:wrap;align-items:center}
.ledger.tax .trow{display:flex;align-items:flex-start;gap:12px;padding:12px 16px}
.ledger.tax .tl{flex:1;min-width:0;font-size:var(--fs-14);font-weight:500}
.ledger.tax .tl small{display:block;font-weight:400;font-size:var(--fs-12);color:var(--ink3);margin-top:2px}
.ledger.tax .tv{font-size:var(--fs-16);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.twrap{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
.ptable{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.ptable th,.ptable td{padding:8px 6px;border-bottom:1px solid var(--line2);font-size:var(--fs-13);white-space:nowrap;background:none;position:static}
.ptable thead th{color:var(--ink3);font-weight:500;font-size:var(--fs-12);letter-spacing:var(--ls-label)}
.ptable tbody tr{cursor:pointer}
.ptable tbody tr:hover{background:var(--surface2)}
.ptable .pn{font-weight:500;text-align:left;width:40%;max-width:150px;white-space:normal}
.plink{border:none;background:none;padding:0;font:inherit;color:var(--ink);text-align:left;max-width:100%}
.ptable .pbar{display:flex;align-items:center;gap:6px;margin-top:4px;max-width:150px}
.ptable .pbar svg{flex:1;min-width:0;display:block}
.ptable .pbar small{font-size:var(--fs-12);color:var(--ink3);font-weight:400;width:30px;text-align:right}
.ptable tfoot th,.ptable tfoot td{font-weight:600;color:var(--ink);border-bottom:none;border-top:1px solid var(--line)}
@media (max-width:599px){
  .ptable thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .ptable tr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px 8px;padding:10px 0;border-bottom:1px solid var(--line2)}
  .ptable th,.ptable td{border:none;padding:0;white-space:normal}
  .ptable .pn,.ptable tfoot th{grid-column:1/-1;max-width:none;font-size:var(--fs-14)}
  .ptable td.r{text-align:left}
  .ptable td.r::before{content:attr(data-label);display:block;font-size:var(--fs-12);color:var(--ink3);font-weight:400}
  .ptable .pbar{max-width:none}
  .ptable tfoot tr{border-bottom:none;border-top:1px solid var(--line)}
  .ptable tfoot th,.ptable tfoot td{border-top:none}
}
.ltable{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.ltable th{position:sticky;top:0;z-index:2;background:var(--surface2);text-align:left;font-size:var(--fs-12);font-weight:500;color:var(--ink2);letter-spacing:var(--ls-label);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.ltable th.r,.ltable td.r,.ltable td.ramt{text-align:right}
.ltable td{padding:9px 10px;border-bottom:1px solid var(--line2);font-size:var(--fs-13);vertical-align:top;background:var(--surface)}
.ltable tr.row{cursor:pointer}
.ltable tr.row > td:first-child{box-shadow:inset 4px 0 0 var(--stripe, var(--line));padding-left:14px}
.ltable tr.row:hover td{background:var(--surface2)}
.ltable tr.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.ltable tr.row.flash td{animation:flash 1.6s ease}
.ltable td small{display:block;font-size:var(--fs-12);color:var(--ink3);white-space:nowrap}
.ltable .dt b{font-weight:500;white-space:nowrap}
.ltable td.doc{white-space:nowrap}
.ltable .pty span{display:block;font-weight:500;font-size:var(--fs-14);max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ltable .prj{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ltable td.ramt{font-size:var(--fs-14);white-space:nowrap}
.ltable .st{white-space:nowrap}
.ltable .st small.flag{font-weight:600}
.sortb{border:none;background:none;padding:0;font:inherit;color:inherit;letter-spacing:inherit;display:inline-flex;gap:4px;align-items:center}
.sdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--stAuto)}
.sdot.pending{background:var(--warn)} .sdot.approved{background:var(--ok)} .sdot.rejected{background:var(--bad)}
.lt{padding:0;overflow-x:auto}
.g4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:6px}
.cbline{display:flex !important;align-items:center;gap:8px;font-weight:500 !important;color:var(--ink) !important;letter-spacing:0 !important}
.cbline input{width:18px !important;min-height:0 !important;height:18px}
.calc{margin:10px 0 0;padding:9px 12px;background:var(--surface2);border:1px solid var(--line2);border-radius:var(--rc);font-size:var(--fs-13);color:var(--ink2)}
.policy{margin:0 0 6px;font-size:var(--fs-14);font-weight:500;color:var(--ink)}
.usr .role{min-width:0}
.btns .g2{gap:8px}
.rvamt.inc{color:var(--inc)}
@keyframes slide{from{transform:translateX(40px);opacity:.5}to{transform:none;opacity:1}}
/* ===== desktop ≥ 900px ===== */
@media (min-width:900px){
  :root{--stickTop:env(safe-area-inset-top, 0px)}
  body::before{display:none}
  .top{display:none}
  .side{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:240px;background:var(--navy);color:var(--onNavy);padding:20px 12px;padding-top:calc(20px + env(safe-area-inset-top, 0px));padding-bottom:calc(16px + env(safe-area-inset-bottom, 0px));z-index:40;gap:2px}
  .sbrand{display:flex;align-items:center;gap:10px;padding:0 8px 18px;margin-bottom:10px;border-bottom:1px solid var(--navyLine)}
  .sbrand b{display:block;font-family:var(--font-display);font-weight:600;font-size:var(--fs-16);line-height:1.2}
  .sbrand small{display:block;font-size:var(--fs-12);color:var(--onNavy2);letter-spacing:var(--ls-label)}
  .sn{position:relative;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--rc);text-decoration:none;color:var(--onNavy2);font-weight:500;font-size:var(--fs-14)}
  .sn:hover{background:var(--navy2);color:var(--onNavy)}

  .sn[aria-current="page"]::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accentOnNavy)}
  .sn .sbadge{margin-left:auto;background:var(--bad);color:var(--onBrand);border-radius:var(--rp);font-size:var(--fs-12);font-weight:600;padding:0 7px;line-height:1.6;font-variant-numeric:tabular-nums}
  .sfoot{margin-top:auto;padding:14px 8px 0;border-top:1px solid var(--navyLine)}
  .suser{display:flex;align-items:center;gap:10px}
  .suser .meav{width:32px;height:32px}
  .suser b{display:block;font-size:var(--fs-14);font-weight:500;color:var(--onNavy)}
  .suser small{display:block;font-size:var(--fs-12);color:var(--onNavy2)}
  .sfoot p{margin:12px 0 0;font-size:var(--fs-12);color:var(--onNavy2);letter-spacing:var(--ls-label)}
  .col{margin-left:240px}
  .bnav{display:none}
  .wrap{padding-block:24px 48px}
  .shead{margin-bottom:18px}
  .shead h2{font-size:var(--fs-28)}
  .lhead{gap:12px;flex-wrap:nowrap}
  .lhead h2{flex:none;margin-right:12px}
  .lhead .msw-wrap,.lhead .search,.lhead .ftoggle{order:0}
  .lhead .search{max-width:520px}
  .lhead .ftoggle{margin-right:auto}
  .segs{display:inline-flex}
  .seg-b{flex:none;padding:6px 14px}
  .card{padding:20px}
  .ledger{margin:0 -20px}
  .lrow{padding:10px 20px;grid-template-columns:minmax(0,1.5fr) minmax(48px,.8fr) auto 46px;grid-template-areas:"name bar amt pct";gap:12px}
  .lcard{padding:0}
  .lcard > h3{padding:20px 20px 0}
  .grid.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
  .kband{grid-template-columns:minmax(0,1.25fr) minmax(0,3fr)}
  .kmain{padding:22px 24px}
  .kfig{font-size:var(--fs-40)}
  .kstats{border-top:none;grid-template-columns:repeat(3,minmax(150px,auto))}
  .kstat{padding:22px 22px;border-left:1px solid var(--line2);justify-content:center}

  .rvlist{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .ov{align-items:stretch;justify-content:flex-end;padding:0}
  .sheet{width:420px;max-width:100%;height:100%;max-height:none;border-radius:0;padding:0 20px 24px;animation:slide .2s ease;border-left:1px solid var(--line)}
  .sgrid{grid-template-columns:minmax(0,1fr)}
  .slipbig svg,.slipbig img{max-width:200px}
  .ogrid{grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}

  .kstats.k4 .kv{font-size:20px}
  .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .ledger.tax .trow{padding:12px 20px}
  .toast{bottom:28px}
  .addcard{max-width:680px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important}
}

<body>
<!-- navy sidebar (desktop) -->
<aside class="side" aria-label="แถบด้านข้าง">

  <nav aria-label="เมนูหลัก (จอคอม)" id="snav"></nav>

<script>
'use strict';
/* =========================================================
   SGQ บันทึกค่าใช้จ่าย — ตัวอย่าง (ไม่มี backend)
   ข้อมูลทั้งหมดสร้างจาก seed คงที่ → เปิดกี่ครั้งก็ได้ชุดเดิม
   แก้ไขใด ๆ = แก้ state ในหน่วยความจำ แล้วทุกหน้าคำนวณใหม่
   ========================================================= */

/* --- constants --- */
const TODAY = new Date(2026, 9, 26);            // "วันนี้" ของตัวอย่าง
const COMPANY = 'บจก. เอสจีคิว';
const TH_M = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TH_D = ['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];
const VIEWS = ['overview','list','review','add','menu'];

const BANKS = {
  KBANK:{code:'KBank', name:'ธ.กสิกรไทย', color:'--bk-kbank'},
  SCB:{code:'SCB', name:'ธ.ไทยพาณิชย์', color:'--bk-scb'},
  BBL:{code:'BBL', name:'ธ.กรุงเทพ', color:'--bk-bbl'},
  KTB:{code:'KTB', name:'ธ.กรุงไทย', color:'--bk-ktb'},
  TTB:{code:'ttb', name:'ธ.ทหารไทยธนชาต', color:'--bk-ttb'},
  GSB:{code:'GSB', name:'ธ.ออมสิน', color:'--bk-gsb'},
  PP:{code:'PromptPay', name:'พร้อมเพย์', color:'--bk-pp'},
  CASH:{code:'เงินสด', name:'เงินสด', color:'--bk-cash'},
  XFER:{code:'โอน', name:'โอน (บันทึกเอง)', color:'--bk-cash'},
  CARD:{code:'บัตรเครดิต', name:'บัตรเครดิต', color:'--bk-cash'}
};
// categories: fixed colour order (never cycled); added ones use grey
const CATS = [
  {key:'alu', name:'วัสดุอลูมิเนียม', color:'--cat-alu'},
  {key:'glass', name:'กระจก', color:'--cat-glass'},
  {key:'hw', name:'อุปกรณ์/ฮาร์ดแวร์', color:'--cat-hw'},
  {key:'labor', name:'ค่าแรงช่าง', color:'--cat-labor'},
  {key:'fuel', name:'น้ำมัน/เดินทาง', color:'--cat-fuel'},
  {key:'tool', name:'เครื่องมือ', color:'--cat-tool'},
  {key:'office', name:'ค่าใช้จ่ายสำนักงาน', color:'--cat-office'},
  {key:'util', name:'สาธารณูปโภค', color:'--cat-util'},
  {key:'other', name:'อื่นๆ', color:'--cat-other'}
];
const NO_PROJ = 'ไม่ระบุโครงการ';
const PROJECTS = ['บ้านคุณวิทยา บางนา','คอนโด The Base พระราม 9','โรงงาน ABC นิคมฯ บางปู','ร้านกาแฟ Slow Bar เอกมัย','หมู่บ้านศุภาลัย รังสิต', NO_PROJ];
const POSTERS = ['คุณแอน (บัญชี)','พี่ต้น (หัวหน้าช่าง)','คุณบอส','ช่างเก่ง'];
// status: auto (counted) · pending (flagged only) · approved (counted) · rejected (not counted)
const STATUS = {auto:'บันทึกอัตโนมัติ', pending:'รอตรวจ', approved:'ตรวจแล้ว', rejected:'ไม่นับ'};
const STATUS_SHORT = {auto:'อัตโนมัติ', pending:'รอตรวจ', approved:'ตรวจแล้ว', rejected:'ไม่นับ'};
const DOCS = {slip:'สลิปโอน', receipt:'ใบเสร็จ', tax_invoice:'ใบกำกับภาษี', cash_bill:'บิลเงินสด'};
const WHT_RATES = [0, 1, 3, 5];
const INCOME_CATS = [{key:'income', name:'รายรับงวดงาน', color:'--inc'}, {key:'income_other', name:'รายรับอื่น', color:'--inc'}];
const COMPANY_ACCTS = [
  {bank:'KBANK', acct:'xxx-x-xx452-1', label:'บัญชีหลัก (กระแสรายวัน)'},
  {bank:'SCB', acct:'xxx-x-xx780-3', label:'ออมทรัพย์ · สำรองจ่าย'}
];
const ROLES = [
  {role:'แอดมิน', cls:'admin', desc:'ตั้งค่าระบบ และทำได้ทุกอย่าง'},
  {role:'ผู้ได้รับมอบอำนาจ', cls:'acc', desc:'ตรวจ แก้ไข อนุมัติ และส่งออกรายงาน'},
  {role:'พนักงาน', cls:'', desc:'ส่งสลิปในกลุ่ม LINE · เห็นเฉพาะรายการที่ตนเองส่ง'},
  {role:'ดูอย่างเดียว', cls:'', desc:'ดูสรุปและรายการ แก้ไขไม่ได้'}
];
const USERS = [
  {name:'คุณบอส', sub:'เจ้าของกิจการ', role:0},
  {name:'คุณแอน (บัญชี)', sub:'ฝ่ายบัญชี', role:1},
  {name:'พี่ต้น (หัวหน้าช่าง)', sub:'หัวหน้าทีมช่าง', role:2},
  {name:'ช่างเก่ง', sub:'ทีมช่างติดตั้ง', role:2},
  {name:'สำนักงานบัญชี ทีแอนด์พี', sub:'ผู้ทำบัญชีภายนอก', role:3}
];

/* --- formatting --- */
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const TODAY_ISO = iso(TODAY);
const TODAY_MK = TODAY_ISO.slice(0, 7);
function parseISO(s){ const [y, m, d] = s.slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d); }
function fmtDate(s){ const d = parseISO(s); return d.getDate() + ' ' + TH_M[d.getMonth()] + ' ' + (d.getFullYear() + 543); }
function fmtDM(s){ const d = parseISO(s); return d.getDate() + ' ' + TH_M[d.getMonth()]; }
function fmtSlipDate(s){ const d = parseISO(s); return d.getDate() + ' ' + TH_M[d.getMonth()] + ' ' + String(d.getFullYear() + 543).slice(2); }
function fmtDow(s){ return TH_D[parseISO(s).getDay()]; }
function monthLabel(mk){ const [y, m] = mk.split('-').map(Number); return TH_M[m - 1] + ' ' + (y + 543); }
const round2 = n => Math.round(n * 100) / 100;
const num2 = n => round2(n).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
const baht = n => '฿' + num2(n);
function compactBaht(v){
  if (v === 0) return '0';
  if (v >= 1000){ const k = v / 1000; return '฿' + (Number.isInteger(k) ? k : k.toFixed(1)) + 'K'; }
  return '฿' + v;
}
const pct = (a, b) => b > 0 ? (a / b * 100) : 0;
const shortName = p => String(p).replace(/\s*\(.*\)\s*$/, '');
const trunc = (s, n) => (s = String(s ?? '')).length > n ? s.slice(0, n - 1) + '…' : s;
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const catOf = key => CATS.find(c => c.key === key) || INCOME_CATS.find(c => c.key === key) || CATS[CATS.length - 1];
const F = token => 'style="fill:var(' + token + ')"';   // every SVG fill comes from a token

/* --- aggregation (shared by every view, so numbers always agree) --- */
const sumBy = (arr, f) => arr.reduce((s, x) => s + (Number(f(x)) || 0), 0);
const groupBy = (arr, f) => arr.reduce((m, x) => { const k = f(x); (m[k] || (m[k] = [])).push(x); return m; }, {});
const monthKey = r => r.slipDate.slice(0, 7);
const amountOf = r => r.amount;
// counted = auto/approved and not a duplicate · expense = out · income = in
const isCounted = r => (r.status === 'auto' || r.status === 'approved') && !r.duplicateOf;
const isOut = r => r.direction === 'out', isIn = r => r.direction === 'in';
const outTotal = list => round2(sumBy(list.filter(r => isCounted(r) && isOut(r)), amountOf));
const inTotal = list => round2(sumBy(list.filter(r => isCounted(r) && isIn(r)), amountOf));
const countedTotal = outTotal;
const partyOf = r => r.direction === 'in' ? r.sender : r.receiver;
// WHT: slip amount is net; gross = net / (1 - rate)
function whtOf(net, rate){ if (!rate) return null; const gross = round2(net / (1 - rate / 100)); return {rate, amount: round2(gross - net), gross}; }
function vatOf(total, taxId, invoiceNo){ const subtotal = round2(total / 1.07); return {subtotal, rate:7, amount: round2(total - subtotal), taxId, invoiceNo}; }
const byNewest = (a, b) => (b.slipDate + b.slipTime + b.createdAt).localeCompare(a.slipDate + a.slipTime + a.createdAt);

/* --- mock data (seeded PRNG) --- */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function buildMockData(){
  const rnd = mulberry32(25691026);
  const pick = a => a[Math.floor(rnd() * a.length)];
  const wpick = (items, wf) => { let r = rnd() * sumBy(items, wf); for (const x of items){ r -= wf(x); if (r <= 0) return x; } return items[items.length - 1]; };
  const digits = n => { let s = ''; for (let i = 0; i < n; i++) s += Math.floor(rnd() * 10); return s; };
  // [receiver, category, receiver bank, min, max, weight, vendor type]
  const VENDORS = [
    ['บจก. ไทยเมทัล อลูมิเนียม','alu','BBL',6500,48000,6,'ผู้ขายวัสดุ'],
    ['บจก. อลูเม็กซ์ ซัพพลาย','alu','KBANK',3200,26000,3,'ผู้ขายวัสดุ'],
    ['หจก. สยามกระจกนิรภัย','glass','SCB',2800,24000,5,'ผู้ขายวัสดุ'],
    ['ร้านกระจกเจริญชัย','glass','KTB',900,7800,2,'ร้านค้า'],
    ['ร้านฮาร์ดแวร์ลุงชัย','hw','PP',350,5200,5,'ร้านค้า'],
    ['บจก. ซิลิโคน แอนด์ ซีล','hw','SCB',1500,9800,3,'ผู้ขายวัสดุ'],
    ['นายสมศักดิ์ (ช่าง)','labor','PP',2500,9000,4,'ช่างรับเหมา'],
    ['นายวีระ (ช่างติดตั้ง)','labor','PP',1800,6500,2,'ช่างรับเหมา'],
    ['ปตท. สาขาบางนา-ตราด กม.4','fuel','KTB',700,2200,5,'ปั๊มน้ำมัน'],
    ['บางจาก สาขารังสิต คลอง 3','fuel','TTB',600,1800,2,'ปั๊มน้ำมัน'],
    ['ร้านเครื่องมือช่าง HomePro','tool','KBANK',890,14500,2,'ร้านค้า'],
    ['ร้านสมบูรณ์การช่าง','tool','GSB',450,6800,1,'ร้านค้า'],
    ['ร้านเครื่องเขียนอักษรสยาม','office','KBANK',180,2400,1,'ร้านค้า'],
    ['ร้านถ่ายเอกสาร ก๊อปปี้พลัส','office','PP',120,950,1,'ร้านค้า'],
    ['นายบุญมี (รถรับจ้างขนของ)','other','PP',500,2500,2,'บุคคล']
  ];
  const UTIL = {
    mea:['การไฟฟ้านครหลวง','util','KTB',0,0,0,'หน่วยงานรัฐ'],
    mwa:['การประปานครหลวง','util','KTB',0,0,0,'หน่วยงานรัฐ']
  };
  const SPECIAL = {
    food:['ร้านอาหารครัวคุณยาย','other','PP',0,0,0,'ร้านค้า'],
    shop:['ร้านค้าออนไลน์ ช้อปดี','other','KBANK',0,0,0,'ร้านค้า']
  };
  const vByName = n => VENDORS.find(v => v[0] === n);
  const acctOf = {};
  [...VENDORS, ...Object.values(UTIL), ...Object.values(SPECIAL)].forEach(v => {
    acctOf[v[0]] = v[2] === 'PP' ? 'xxx-xxx-' + digits(4) : 'xxx-x-xx' + digits(3) + '-' + digits(1);
  });
  const NOTES = {
    alu:['ค่าเส้นอลูมิเนียม {p}','เส้นบานเลื่อน 2 นิ้ว 20 เส้น','โปรไฟล์ประตูบานสวิง','มัดจำเส้นอลู ล็อตใหม่'],
    glass:['กระจกเทมเปอร์ 6 มม. {p}','กระจกลามิเนต 8.38 มม.','กระจกใส 5 มม. ตัดตามขนาด'],
    hw:['ล้อบานเลื่อน + มือจับ','ซิลิโคน 2 ลัง','สกรู พุก ยาง EPDM','กุญแจบานเลื่อน 10 ชุด'],
    labor:['ค่าแรงติดตั้ง {p}','ค่าแรงรายสัปดาห์','ค่าแรงรื้อถอนบานเก่า'],
    fuel:['เติมน้ำมันรถกระบะ','น้ำมันรถส่งของ','ค่าน้ำมันไปหน้างาน'],
    tool:['ใบตัดอลูมิเนียม 10 นิ้ว','สว่านไร้สาย','ดอกสว่าน + ตลับเมตร'],
    office:['กระดาษ A4 + หมึกพิมพ์','ถ่ายเอกสารใบเสนอราคา'],
    util:['ค่าน้ำ/ไฟโรงงาน'],
    other:['ค่ารถขนกระจกไปหน้างาน','ค่าขนของ']
  };
  const PROJ_W = [3, 2.5, 3, 1.2, 2];   // weights of the 5 real projects
  const realProj = () => wpick([0,1,2,3,4], i => PROJ_W[i]);
  function chooseProject(cat){
    if (['office','util'].includes(cat)) return NO_PROJ;
    if (cat === 'tool') return rnd() < 0.6 ? NO_PROJ : PROJECTS[realProj()];
    if (cat === 'fuel') return rnd() < 0.45 ? NO_PROJ : PROJECTS[realProj()];
    if (cat === 'other') return rnd() < 0.5 ? NO_PROJ : PROJECTS[realProj()];
    if (cat === 'hw' && rnd() < 0.15) return NO_PROJ;
    return PROJECTS[realProj()];
  }
  function choosePoster(cat, amount){
    const P = POSTERS, r = rnd();
    if (amount > 30000) return r < 0.6 ? P[2] : P[0];
    if (cat === 'alu' || cat === 'glass') return r < 0.6 ? P[0] : r < 0.9 ? P[1] : P[2];
    if (cat === 'hw' || cat === 'tool') return r < 0.5 ? P[1] : r < 0.85 ? P[3] : P[0];
    if (cat === 'labor') return r < 0.7 ? P[1] : P[2];
    if (cat === 'fuel') return r < 0.6 ? P[3] : P[1];
    return r < 0.8 ? P[0] : P[3];
  }
  function roundAmt(x, cat){
    if (['alu','glass','labor','tool'].includes(cat)) return Math.round(x / 10) * 10;
    if (cat === 'hw') return Math.round(x / 5) * 5;
    if (cat === 'other') return Math.round(x / 50) * 50;
    if (cat === 'office') return Math.round(x);
    return round2(x);
  }
  function stamp(dateISO, time, addMin){
    const [h, m] = time.split(':').map(Number);
    const d = parseISO(dateISO); d.setHours(h, m + addMin, 0);
    return iso(d) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':00';
  }
  const randTime = () => pad(7 + Math.floor(rnd() * 11)) + ':' + pad(Math.floor(rnd() * 60));
  function make(dateISO, time, v, o = {}){
    const [name, cat, bankTo, min, max, , vtype] = v;
    const amount = o.amount ?? roundAmt(min + rnd() * (max - min), cat);
    const project = o.project ?? chooseProject(cat);
    const bankFrom = o.bankFrom ?? (rnd() < 0.8 ? 'KBANK' : 'SCB');
    const note = o.note ?? pick(NOTES[cat]).replace('{p}', shortName(project) === NO_PROJ ? '' : 'งาน' + project.split(' ')[0]).trim();
    return {
      id:'', createdAt: stamp(dateISO, time, 1 + Math.floor(rnd() * 20)),
      slipDate: dateISO, slipTime: time, amount,
      fee: (bankFrom !== bankTo && bankTo !== 'PP' && rnd() < 0.12) ? 10 : 0,
      bankFrom, bankTo,
      sender: o.sender ?? COMPANY,
      accountFromMasked: o.accountFrom ?? (bankFrom === 'KBANK' ? COMPANY_ACCTS[0].acct : COMPANY_ACCTS[1].acct),
      receiver: o.receiver ?? name,
      accountToMasked: o.accountTo ?? acctOf[name],
      ref: digits(3) + dateISO.slice(2).replace(/-/g, '') + time.replace(':', '') + digits(5),
      category: cat, project, vendorType: vtype,
      poster: o.poster ?? choosePoster(cat, amount),
      note, status: o.status ?? 'auto', docType: o.docType ?? 'slip', wht: null, vat: null, whtByCustomer: null,
      confidence: o.confidence ?? round2(0.88 + rnd() * 0.115),
      duplicateOf: null, direction: o.direction ?? 'out',
      source: o.source ?? 'line', payMethod: o.payMethod ?? 'transfer'
    };
  }

  const recs = [];
  // 1) random daily slips 1 Sep – 25 Oct (denser in Oct, few on Sundays)
  for (let d = new Date(2026, 8, 1); d < TODAY; d.setDate(d.getDate() + 1)){
    const oct = d.getMonth() === 9, dow = d.getDay();
    const n = dow === 0 ? (rnd() < 0.2 ? 1 : 0) : oct ? pick([1,1,1,2,2,2]) : pick([0,1,1,1,2]);
    Array.from({length:n}, randTime).sort().forEach(t => recs.push(make(iso(d), t, wpick(VENDORS, v => v[5]))));
  }
  // 2) monthly utilities
  recs.push(make('2026-09-05','09:12', UTIL.mea, {amount:4812.37, note:'ค่าไฟโรงงาน ส.ค.', poster:POSTERS[0]}));
  recs.push(make('2026-09-08','10:05', UTIL.mwa, {amount:612.50, note:'ค่าน้ำโรงงาน ส.ค.', poster:POSTERS[0]}));
  recs.push(make('2026-10-05','09:40', UTIL.mea, {amount:5236.90, note:'ค่าไฟโรงงาน ก.ย.', poster:POSTERS[0]}));
  recs.push(make('2026-10-08','11:22', UTIL.mwa, {amount:588.25, note:'ค่าน้ำโรงงาน ก.ย.', poster:POSTERS[0]}));
  // 3) 3 rejected (personal / recorded elsewhere)
  recs.push(make('2026-09-12','12:40', SPECIAL.food, {amount:860, project:NO_PROJ, poster:POSTERS[3], note:'ค่าอาหารกลางวัน (ส่วนตัว)', status:'rejected'}));
  recs.push(make('2026-09-24','20:15', SPECIAL.shop, {amount:1290, project:NO_PROJ, poster:POSTERS[1], note:'ของใช้ส่วนตัว ส่งผิดกลุ่ม', status:'rejected'}));
  recs.push(make('2026-10-14','17:10', vByName('นายสมศักดิ์ (ช่าง)'), {amount:3000, poster:POSTERS[1], note:'เบิกล่วงหน้า — ลงในระบบเงินเดือนแล้ว', status:'rejected'}));
  // 4) today's 4 slips (14:32 = chat example, 11:20 = labour with WHT unknown)
  recs.push(make(TODAY_ISO,'08:15', vByName('ปตท. สาขาบางนา-ตราด กม.4'), {amount:1450, project:NO_PROJ, poster:POSTERS[3], bankFrom:'KBANK', note:'เติมน้ำมันรถกระบะ ไปหน้างาน', confidence:0.98}));

  // 6) transport (WHT 1%)

  // 7) income: customer instalments into the main account (juristic payers withhold 3%)

    const w = juristic ? whtOf(round2(gross * 0.97), 3) : null;

      amount: net, bankFrom: o.bankFrom || bank, sender: name, accountFrom: 'xxx-x-xx' + (300 + gross / 1000 % 700) + '-' + (gross / 5000 % 10 | 0),
      receiver: COMPANY, accountTo: COMPANY_ACCTS[0].acct, direction:'in', project: proj, poster: POSTERS[0], note
    }, o));
    if (w) r.whtByCustomer = {rate:3, amount: round2(gross - net), gross};
    return r;
  };
  recs.push(income('2026-09-04','11:10','vit',120000,PROJECTS[0],'รับเงินงวด 1 บ้านคุณวิทยา'));
  recs.push(income('2026-09-10','15:20','nok',45000,PROJECTS[3],'รับเงินงวด 1 ร้าน Slow Bar'));
  recs.push(income('2026-09-15','10:30','abc',180000,PROJECTS[2],'รับเงินงวด 1 โรงงาน ABC'));

  recs.push(income('2026-10-20','09:30','rp',60000,PROJECTS[4],'รับเงินงวด 2 หมู่บ้านศุภาลัย'));

  const byDate = (a, b) => (a.slipDate + a.slipTime).localeCompare(b.slipDate + b.slipTime);
  const TAXV = ['บจก. ไทยเมทัล อลูมิเนียม','บจก. อลูเม็กซ์ ซัพพลาย','หจก. สยามกระจกนิรภัย','บจก. ซิลิโคน แอนด์ ซีล'];
  const taxIdOf = n => '0105' + String(hashStr(n) % 1e9).padStart(9, '0');
  let ivn = 1200;
  recs.filter(r => TAXV.includes(r.receiver) && r.slipDate !== TODAY_ISO).sort(byDate).filter((r, i) => i % 2 === 0).slice(0, 10).forEach(r => {
    r.docType = 'tax_invoice'; ivn += 7 + (hashStr(r.ref) % 30);
    r.vat = vatOf(r.amount, taxIdOf(r.receiver), 'IV-2569-' + ivn);
  });
  const RECV = ['ร้านฮาร์ดแวร์ลุงชัย','ร้านเครื่องมือช่าง HomePro','ร้านสมบูรณ์การช่าง','ร้านเครื่องเขียนอักษรสยาม','ร้านถ่ายเอกสาร ก๊อปปี้พลัส'];
  recs.filter(r => RECV.includes(r.receiver) && r.status === 'auto' && r.slipDate !== TODAY_ISO).sort(byDate).slice(0, 5).forEach(r => { r.docType = 'receipt'; });
  // 9) WHT: labour 3%, transport 1% (from ฿1,000)
  recs.forEach(r => {
    if (r.direction !== 'out' || r.status === 'rejected') return;
    if (r.category === 'labor') r.wht = whtOf(r.amount, 3);
    else if (r.receiver.startsWith('นายบุญมี') && r.amount >= 1000) r.wht = whtOf(r.amount, 1);
  });

  // 10) review flags (everything else is auto)
  const plain = r => r.direction === 'out' && r.status === 'auto' && r.slipDate < TODAY_ISO && r.source === 'line';
  // 3 low-confidence reads (19–22 Oct)
  const lowC = recs.filter(r => plain(r) && r.slipDate >= '2026-10-19' && r.slipDate <= '2026-10-22' && r.amount > 1000).sort(byDate);
  [0.64, 0.72, 0.77].forEach((c, i) => { const r = lowC[i * 2] || lowC[i]; if (r){ r.confidence = c; r.status = 'pending'; } });
  // 2 WHT-unknown: today's labour + latest Oct labour
  const lab2 = recs.filter(r => plain(r) && r.category === 'labor' && r.slipDate >= '2026-10-01').sort(byDate).pop();
  [labToday, lab2].forEach(r => { if (r){ r.wht = null; r.whtUnknown = true; r.whtAsked = true; r.status = 'pending'; } });
  // approved: Sep records read below 90% confidence
  recs.forEach(r => { if (r.status === 'auto' && r.slipDate < '2026-10-01' && r.confidence != null && r.confidence < 0.9) r.status = 'approved'; });
  // 2 duplicate posts (same ref as an earlier record)
  const dupSrc = recs.filter(r => plain(r) && r.slipDate >= '2026-10-15' && r.slipDate <= '2026-10-21' && r.amount > 3000 && r.confidence >= 0.8).sort(byDate).slice(0, 2);
  dupSrc.forEach((o, i) => {
    const next = parseISO(o.slipDate); next.setDate(next.getDate() + 1 + i);
    recs.push(Object.assign({}, o, {
      createdAt: iso(next) + 'T0' + (8 + i) + ':1' + (4 + i) + ':00',
      poster: o.poster === POSTERS[0] ? POSTERS[1] : POSTERS[0],
      status:'pending', _dupOf: o
    }));
  });

  // sort by slip time, then assign EXP-yyyy-mm-nnnn
  recs.sort((a, b) => (a.slipDate + a.slipTime + a.createdAt).localeCompare(b.slipDate + b.slipTime + b.createdAt));
  const seq = {};
  recs.forEach(r => { const mk = monthKey(r); seq[mk] = (seq[mk] || 0) + 1; r.id = 'EXP-' + mk + '-' + String(seq[mk]).padStart(4, '0'); });
  recs.forEach(r => { if (r._dupOf){ r.duplicateOf = r._dupOf.id; delete r._dupOf; } });
  return recs;
}

/* --- mock slip / document SVG --- */
function hashStr(s){ let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function qrSVG(seed, x0, y0, m, full){
  // fake 9×9 QR: 3 finder squares + modules seeded by ref
  let out = '<rect x="' + (x0 - 2) + '" y="' + (y0 - 2) + '" width="' + (m * 9 + 4) + '" height="' + (m * 9 + 4) + '" ' + F('--slip-paper') + '/>';
  const finder = (cx, cy) => '<rect x="' + (x0 + cx * m) + '" y="' + (y0 + cy * m) + '" width="' + (3 * m) + '" height="' + (3 * m) + '" ' + F('--slip-qr') + '/>' +
    '<rect x="' + (x0 + (cx + 1) * m) + '" y="' + (y0 + (cy + 1) * m) + '" width="' + m + '" height="' + m + '" ' + F('--slip-paper') + '/>';
  out += finder(0, 0) + finder(6, 0) + finder(0, 6);
  let h = hashStr(seed);
  for (let y = 0; y < 9; y++) for (let x = 0; x < 9; x++){
    const inF = (x < 4 && y < 4) || (x > 4 && y < 4) || (x < 4 && y > 4);
    h = Math.imul(h ^ (h >>> 13), 1103515245) + 12345 >>> 0;
    if (inF || (!full && (x + y) % 2)) continue;
    if (h & 4) out += '<rect x="' + (x0 + x * m) + '" y="' + (y0 + y * m) + '" width="' + m + '" height="' + m + '" ' + F('--slip-qr') + '/>';
  }
  return out;
}

const $ = id => document.getElementById(id);

/* --- shared components --- */
const bg = tok => 'style="background:var(' + tok + ')"';
function monthSwitcher(){
  const ms = monthsWithData(), i = ms.indexOf(state.month);
  return '<div class="msw" role="group" aria-label="เลือกเดือน">' +
    '<button type="button" data-act="month" data-step="-1" aria-label="เดือนก่อนหน้า"' + (i <= 0 ? ' disabled' : '') + '>◀</button>' +

    '<button type="button" data-act="month" data-step="1" aria-label="เดือนถัดไป"' + (i >= ms.length - 1 ? ' disabled' : '') + '>▶</button></div>';

function catTag(r){ const c = catOf(r.category); return '<span class="cat"><i ' + bg(c.color) + '></i>' + esc(c.name) + '</span>'; }
const isLow = r => r.confidence != null && r.confidence < 0.8;
// small status flags (the stripe colour always has a text label)
function statusFlags(r, loud){
  let s = '';
  if (r.status === 'rejected') s += '<span class="flag bad">ไม่นับ</span>';
  else if (r.status === 'pending') s += '<span class="flag warn">รอตรวจ</span>';
  else if (r.status === 'approved') s += loud ? '<span class="flag ok">✓ ตรวจแล้ว</span>' : '<span class="sr">ตรวจแล้ว</span>';
  else s += loud ? '<span class="flag mute">บันทึกอัตโนมัติ</span>' : '<span class="sr">บันทึกอัตโนมัติ</span>';
  if (r.direction === 'in' && r.status !== 'rejected') s += '<span class="flag inc">รายรับ</span>';
  if (r.duplicateOf) s += '<span class="flag bad">ซ้ำ</span>';
  if (isLow(r) && r.status === 'pending') s += '<span class="flag warn">AI ไม่มั่นใจ</span>';
  if (r.whtUnknown) s += '<span class="flag warn">หัก ณ ที่จ่าย?</span>';
  if (r.projUnknown) s += '<span class="flag warn">ไม่ระบุโครงการ</span>';
  return s;
}
const stripeOf = r => r.status === 'rejected' ? 's-rejected' : r.status === 'pending' ? 's-pending' : r.direction === 'in' ? 's-in' : 's-' + r.status;
function bankLine(r){
  if (r.source === 'manual') return 'บันทึกเอง · ' + BANKS[r.bankFrom].code;
  return BANKS[r.bankFrom].code + ' → ' + BANKS[r.bankTo].code;
}
function thumbHTML(r){ return r.receiptImg ? '<img src="' + r.receiptImg + '" alt="">' : slipSVG(r, 'sm'); }
const isVoid = r => r.status === 'rejected' || !!r.duplicateOf;
function amountHTML(r, tag){
  const cls = isVoid(r) ? 'void' : r.direction === 'in' ? 'inc' : '';
  return '<' + (tag || 'span') + ' class="ramt ' + cls + '">' + (r.direction === 'in' ? '+' : '') + baht(r.amount) + '</' + (tag || 'span') + '>';
}
const rowData = r => ' data-act="open" data-id="' + r.id + '" data-amount="' + r.amount + '" data-status="' + r.status + '" data-dir="' + r.direction + '" data-dup="' + (r.duplicateOf ? 1 : 0) + '" data-month="' + monthKey(r) + '"';
// card row (phone + overview)
function rowHTML(r){
  return '<button type="button" class="row ' + stripeOf(r) + (state.flashId === r.id ? ' flash' : '') + '"' + rowData(r) + '>' +

    '<span class="rsub2">' + catTag(r) + (r.wht ? '<span class="flag mute">หัก ' + r.wht.rate + '%</span>' : '') + statusFlags(r, false) + '</span></span>' +
    amountHTML(r) + '</button>';
}

/* --- shared tooltip (textContent only) --- */
const tip = $('tip');
function showTip(x, y, value, title, sub, value2){
  tip.replaceChildren();
  const b = document.createElement('b'); b.textContent = value;
  const t = document.createElement('div'); t.textContent = title;
  tip.append(b);
  if (value2){ const b2 = document.createElement('b'); b2.className = 'inc'; b2.textContent = value2; tip.append(b2); }
  tip.append(t);
  if (sub){ const s = document.createElement('span'); s.textContent = sub; tip.append(s); }
  tip.hidden = false;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  const left = Math.min(Math.max(8, x - w / 2), window.innerWidth - w - 8);
  let top = y - h - 10; if (top < 8) top = y + 14;
  tip.style.left = left + 'px'; tip.style.top = top + 'px';
}
const hideTip = () => { tip.hidden = true; };

/* --- nice scale --- */
function niceStep(raw){ const p = Math.pow(10, Math.floor(Math.log10(raw))); const f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
function niceScale(max, n){ if (max <= 0) return {top:1000, step:250}; const step = niceStep(max / (n || 4)); return {top: Math.ceil(max / step - 1e-9) * step, step}; }
// column: rounded top, square base
function colPath(x, y0, w, h, r){
  r = Math.min(r, w / 2, h);
  return 'M' + x + ',' + y0 + ' v' + (-(h - r)) + ' a' + r + ',' + r + ' 0 0 1 ' + r + ',' + (-r) + ' h' + (w - 2 * r) + ' a' + r + ',' + r + ' 0 0 1 ' + r + ',' + r + ' v' + (h - r) + ' z';
}

/* --- view: overview --- */
function compareMonth(mk){
  const [y, m] = mk.split('-').map(Number);
  const pk = iso(new Date(y, m - 2, 1)).slice(0, 7);
  if (!state.recs.some(r => monthKey(r) === pk)) return null;
  const partial = mk === TODAY_MK, lim = partial ? TODAY.getDate() : 31;
  const upTo = key => state.recs.filter(r => monthKey(r) === key && +r.slipDate.slice(8, 10) <= lim);
  const cur = countedTotal(upTo(mk)), prv = countedTotal(upTo(pk));
  return {cur, prv, pk, partial, lim, change: prv > 0 ? (cur - prv) / prv * 100 : null};
}

// tax card: WHT withheld / WHT by customers / input VAT
function taxSums(recs){
  const c = recs.filter(isCounted);
  const w = c.filter(r => isOut(r) && r.wht), wc = c.filter(r => isIn(r) && r.whtByCustomer), v = c.filter(r => isOut(r) && r.vat);
  return {wht: round2(sumBy(w, r => r.wht.amount)), whtN: w.length, whtCust: round2(sumBy(wc, r => r.whtByCustomer.amount)), whtCustN: wc.length,
    vat: round2(sumBy(v, r => r.vat.amount)), vatN: v.length};
}
function taxCard(recs){
  const t = taxSums(recs), row = (id, label, v, sub) => '<li class="trow"><span class="tl">' + label + '<small>' + sub + '</small></span><span class="tv" id="' + id + '" data-value="' + v + '">' + baht(v) + '</span></li>';
  return '<h3>ภาษีเดือนนี้<span class="sp"></span><span class="note">' + monthLabel(state.month) + '</span></h3><ul class="ledger tax">' +
    row('taxWht', 'หัก ณ ที่จ่ายที่บริษัทหักไว้', t.wht, t.whtN + ' รายการ · ยื่น ภ.ง.ด.3/53 ภายในวันที่ 7 เดือนถัดไป') +
    row('taxWhtCust', 'ถูกลูกค้าหัก ณ ที่จ่าย', t.whtCust, t.whtCustN + ' รายการ · ใช้เครดิตภาษีปลายปี') +
    row('taxVat', 'ภาษีซื้อ 7%', t.vat, 'จากใบกำกับภาษี ' + t.vatN + ' ใบ') + '</ul>' +
    (pendingAll().some(r => r.whtUnknown) ? '<p class="hint" style="margin:10px 0 0">มีรายการที่ยังไม่ระบุหัก ณ ที่จ่าย <a class="lnk" href="#review">ตรวจ →</a></p>' : '');
}
// project table: income | expense | net | expense share (all projects + totals)
function projectTable(recs){
  const c = recs.filter(isCounted), totOut = outTotal(recs), totIn = inTotal(recs);
  const rows = PROJECTS.map(p => { const L = c.filter(r => r.project === p); return {p, i: inTotal(L), o: outTotal(L), n: L.length}; })
    .sort((a, b) => b.o - a.o || b.i - a.i);
  const money = (v, cls) => '<span class="' + (cls || '') + '">' + baht(v) + '</span>';
  const netCell = v => '<span class="' + (v < 0 ? 'neg' : '') + '">' + (v < 0 ? '−' + baht(-v) : baht(v)) + '</span>';
  return '<div class="twrap"><table class="ptable"><thead><tr><th scope="col">โครงการ</th><th scope="col" class="r">รายรับ</th><th scope="col" class="r">รายจ่าย</th><th scope="col" class="r">คงเหลือ</th></tr></thead><tbody>' +
    rows.map(x => { const p = pct(x.o, totOut), net = round2(x.i - x.o);
      return '<tr data-act="proj-filter" data-proj="' + esc(x.p) + '"><th scope="row" class="pn"><button type="button" class="plink" data-act="proj-filter" data-proj="' + esc(x.p) + '" aria-label="' + esc(x.p + ' รายจ่าย ' + p.toFixed(1) + '% ของทั้งหมด') + '">' + esc(x.p) + '</button>' +
        '<span class="pbar" title="' + p.toFixed(1) + '% ของรายจ่าย"><svg width="100%" height="4" aria-hidden="true" focusable="false"><rect x="0" y="0" width="100%" height="4" rx="2" ' + F('--track') + '/><rect x="0" y="0" width="' + p.toFixed(2) + '%" height="4" rx="2" ' + F('--brand') + '/></svg><small>' + p.toFixed(0) + '%</small></span></th>' +
        '<td class="r" data-label="รายรับ">' + money(x.i, x.i ? 'inc' : 'muted') + '</td><td class="r" data-label="รายจ่าย">' + money(x.o) + '</td><td class="r" data-label="คงเหลือ">' + netCell(net) + '</td></tr>';
    }).join('') + '</tbody><tfoot><tr><th scope="row">รวม</th>' +
    '<td class="r" data-label="รายรับ"><span class="inc" id="projTotIn" data-value="' + totIn + '">' + baht(totIn) + '</span></td>' +
    '<td class="r" data-label="รายจ่าย"><span id="projTotOut" data-value="' + totOut + '">' + baht(totOut) + '</span></td>' +
    '<td class="r" data-label="คงเหลือ"><span id="projTotNet" class="' + (totIn - totOut < 0 ? 'neg' : '') + '" data-value="' + round2(totIn - totOut) + '">' + (totIn - totOut < 0 ? '−' + baht(totOut - totIn) : baht(totIn - totOut)) + '</span></td></tr></tfoot></table></div>';
}
function dailySeries(mk){
  const [y, m] = mk.split('-').map(Number), nDays = new Date(y, m, 0).getDate();
  const byDay = groupBy(monthRecs(mk).filter(isCounted), r => +r.slipDate.slice(8, 10));
  return Array.from({length:nDays}, (_, i) => { const L = byDay[i + 1] || [], O = L.filter(isOut), I = L.filter(isIn);
    return {d:i + 1, iso: mk + '-' + pad(i + 1), v: round2(sumBy(O, amountOf)), n: O.length, vi: round2(sumBy(I, amountOf)), ni: I.length}; });
}
function dailyTable(mk){
  const rows = dailySeries(mk).filter(x => x.n + x.ni > 0);
  return '<details class="tbl"><summary>ดูเป็นตาราง</summary><div class="tblwrap"><table><thead><tr><th scope="col">วันที่</th><th scope="col" class="r">รายการ</th><th scope="col" class="r">รายจ่าย</th><th scope="col" class="r">รายรับ</th></tr></thead><tbody>' +
    rows.map(x => '<tr><td>' + fmtDow(x.iso) + ' ' + fmtDate(x.iso) + '</td><td class="r">' + (x.n + x.ni) + '</td><td class="r">' + baht(x.v) + '</td><td class="r">' + (x.vi ? '+' + baht(x.vi) : '—') + '</td></tr>').join('') +
    '</tbody></table></div></details>';
}
// daily columns: one shared scale from 0 · expense (today brand, others 45%) · income teal · both = grouped
function drawDaily(){
  const el = $('dailyChart'); if (!el) return;
  const mk = state.month, data = dailySeries(mk), nDays = data.length, mode = state.chartMode;
  const showO = mode !== 'in', showI = mode !== 'out', both = mode === 'both';
  const todayIdx = mk === TODAY_MK ? TODAY.getDate() - 1 : -1;
  const val = (x, s) => s === 'i' ? x.vi : x.v;
  const series = [showO && 'o', showI && 'i'].filter(Boolean);
  let max = 0, maxAt = null;
  data.forEach((x, i) => series.forEach(s => { if (val(x, s) > max){ max = val(x, s); maxAt = [i, s]; } }));
  const {top, step} = niceScale(max, 4);
  const W = Math.max(280, Math.floor(el.clientWidth || 320)), H = 230;
  const M = {l:52, r:6, t:26, b:28}, pw = W - M.l - M.r, ph = H - M.t - M.b;
  const band = pw / nDays, gap = 2;
  const bw = both ? Math.max(1.5, Math.min(12, (band - 2 - gap) / 2)) : Math.max(2, Math.min(24, band - 2));
  const yS = v => M.t + ph - v / top * ph;
  // today is dark only in expense mode (in "both" a bold label marks it, so it never competes with income teal)
  const tok = (i, s) => s === 'i' ? '--barIncome' : (i === todayIdx && !both ? '--barToday' : '--barMuted');
  const xOf = (i, s) => both ? M.l + i * band + (band - (2 * bw + gap)) / 2 + (s === 'i' ? bw + gap : 0) : M.l + i * band + (band - bw) / 2;
  let s = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" tabindex="0" role="group" aria-roledescription="กราฟแท่ง" ' +
    'aria-label="' + esc((mode === 'in' ? 'รายรับ' : mode === 'both' ? 'รายจ่ายและรายรับ' : 'รายจ่าย') + 'รายวัน ' + monthLabel(mk) + ' สูงสุด ' + baht(max) + ' ใช้ปุ่มลูกศรซ้ายขวาเพื่อดูแต่ละวัน') + '" xmlns="http://www.w3.org/2000/svg">';
  data.forEach((x, i) => { const dw = parseISO(x.iso).getDay(); if (dw === 0 || dw === 6) s += '<rect x="' + (M.l + i * band) + '" y="' + M.t + '" width="' + band + '" height="' + ph + '" ' + F('--weekend') + '/>'; });
  s += '<rect id="dBand" x="0" y="' + M.t + '" width="' + band + '" height="' + ph + '" ' + F('--brandSoft') + ' visibility="hidden"/>';
  for (let v = 0; v <= top + 1e-6; v += step){
    const yy = Math.round(yS(v)) + 0.5;
    s += '<rect x="' + M.l + '" y="' + (yy - 0.5) + '" width="' + pw + '" height="1" ' + F(v === 0 ? '--chart-axis' : '--chart-grid') + '/>';
    s += '<text class="ctext" x="' + (M.l - 8) + '" y="' + (yy + 4) + '" text-anchor="end" ' + F('--chart-ink') + '>' + compactBaht(v) + '</text>';
  }
  data.forEach((x, i) => series.forEach(k => {
    const v = val(x, k); if (v <= 0) return;
    const h = Math.max(2, v / top * ph);
    s += '<path class="dbar" data-i="' + i + '" data-s="' + k + '" d="' + colPath(xOf(i, k), M.t + ph, bw, h, 2) + '" ' + F(tok(i, k)) + '/>';
  }));
  const ticks = [1, 5, 10, 15, 20, 25, 30].filter(d => d <= nDays && (todayIdx < 0 || Math.abs(d - 1 - todayIdx) > 2));
  ticks.forEach(d => { s += '<text class="ctext" x="' + (M.l + (d - 0.5) * band) + '" y="' + (H - 8) + '" text-anchor="middle" ' + F('--chart-ink') + '>' + d + '</text>'; });
  if (todayIdx >= 0) s += '<text class="ctext" font-weight="600" x="' + (M.l + (todayIdx + 0.5) * band) + '" y="' + (H - 8) + '" text-anchor="middle" ' + F('--chart-ink-strong') + '>' + (todayIdx + 1) + ' วันนี้</text>';

// read the detail form into the record (false if invalid) — used by save and approve
function applyDetailForm(r, approving){
  const payee = $('d-payee').value.trim(), whtV = $('d-wht').value, proj = $('d-proj').value;
  if (!payee){ showErr('d-payee', 'กรุณาระบุชื่อ'); return false; }
  if (approving && whtV === '' && r.direction === 'out'){ showErr('d-wht', 'เลือกการหัก ณ ที่จ่ายก่อนอนุมัติ'); return false; }
  if (approving && r.direction === 'in' && proj === NO_PROJ && r.projUnknown){ showErr('d-proj', 'รายรับต้องระบุโครงการ'); return false; }
  r.category = $('d-cat').value; r.project = proj; r.note = $('d-note').value.trim();
  if (r.direction === 'in') r.sender = payee; else r.receiver = payee;
  if (proj !== NO_PROJ) r.projUnknown = false;
  const doc = $('d-doc').value;
  if (doc === 'tax_invoice' && !r.vat) r.vat = vatOf(r.amount, '', '');
  if (doc !== 'tax_invoice') r.vat = null;
  r.docType = doc;
  if (whtV !== ''){
    const w = whtOf(r.amount, +whtV);
    if (r.direction === 'in') r.whtByCustomer = w; else { r.wht = w; r.whtUnknown = false; }
  }
  return true;
}

  const r = byId($('sheet').dataset.id); if (!r || !applyDetailForm(r, false)) return;

// danger button: first tap arms, second tap within 3.5 s confirms
function armConfirm(btn, label, fn){
  if (btn.dataset.armed === '1'){ clearTimeout(btn._t); fn(); return; }
  btn.dataset.armed = '1'; btn.dataset.orig = btn.textContent; btn.textContent = label; btn.classList.add('armed');
  $('live').textContent = label;
  btn._t = setTimeout(() => { btn.dataset.armed = ''; btn.textContent = btn.dataset.orig; btn.classList.remove('armed'); }, 3500);
}

// animate a resolved card out, then focus the next one
function resolveCard(id, msg){
  const card = $('rv-' + id);
  const next = card && (card.nextElementSibling || card.previousElementSibling);
  const nextId = next ? next.id : null;
  const done = () => {
    rerender(); toast(msg);
    const n = nextId && $(nextId);
    const f = n ? n.querySelector('button') : $('h-review');
    if (f) f.focus();
  };
  if (card){ card.classList.add('out'); setTimeout(done, 260); } else done();
}
